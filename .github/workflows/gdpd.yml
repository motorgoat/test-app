name: gdpd – Testversion

# Baut bei jedem Push auf den Spiel-Branch (nur wenn sich gdpd/ ändert):
# 1. Regeltests und Modelltests (headless), 2. Probelauf des Spiels (~50 s Spielzeit, ohne Grafik),
# 3. Handy-Screenshots (die Tour muss ganz durchlaufen), 4. Android-APK (Gradle-Build mit dem Erinnerungs-Plugin
# „GdpdReminder“, Rückfall: einfaches APK ohne Plugin) und PC-Versionen. Alles landet unter Releases → „gdpd-testversion“.
# Das Original „God does play dice!“ hat seinen eigenen Workflow (god-does-play-dice.yml).

on:
  push:
    branches: [claude/new-session-znknd9]
    paths:
      - "gdpd/**"
      - ".github/workflows/gdpd.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gdpd
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    env:
      PROJECT: gdpd
    steps:
      - uses: actions/checkout@v4

      - name: Godot einrichten (Vorlagen, Android-SDK, Debug-Keystore)
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/ ~/.config/
          cp -r /root/.config/godot ~/.config/godot
          cp -r /root/.local/share/godot/export_templates/. ~/.local/share/godot/export_templates/
          ls ~/.config/godot ~/.local/share/godot/export_templates/
          godot --version

      - name: Projekt importieren
        run: |
          cd $PROJECT
          timeout 300 godot --headless --editor --quit 2>&1 | tail -20 || true

      - name: Regeltests
        run: |
          cd $PROJECT
          godot --headless --script res://tests/test_rules.gd 2>&1 | tee ../tests.log
          if grep -q "SCRIPT ERROR" ../tests.log; then echo "Skriptfehler in den Tests"; exit 1; fi
          grep -q " 0 Fehler" ../tests.log

      - name: Modelltests (alle Arten und Symbole bauen)
        run: |
          cd $PROJECT
          godot --headless --script res://tests/test_models.gd 2>&1 | tee ../models.log || true
          # „Parameter "m" is null“ kommt vom Dummy-Renderer ohne Grafik (auch im Original) und ist harmlos
          if grep -n "SCRIPT ERROR" -A3 ../models.log; then echo "Skriptfehler in den Modelltests"; exit 1; fi
          grep -q "OK test_models" ../models.log || { echo "Modelltests nicht bestanden"; exit 1; }

      - name: Probelauf des Spiels (3000 Bilder bei 60 fps, ohne Grafik)
        run: |
          cd $PROJECT
          timeout 300 godot --headless --fixed-fps 60 --quit-after 3000 2>&1 | tee ../smoke.log || true
          if grep -n "SCRIPT ERROR" -A3 ../smoke.log; then echo "Skriptfehler im Probelauf"; exit 1; fi

      - name: Handy-Screenshots (1080×2340, Software-OpenGL)
        run: |
          apt-get update -qq >/dev/null
          apt-get install -y -qq xvfb xauth libgl1 libgl1-mesa-dri libglx-mesa0 libegl1 libgles2 \
            libxcursor1 libxinerama1 libxrandr2 libxi6 libxext6 libxrender1 libxkbcommon0 libfontconfig1 >/dev/null
          cd $PROJECT
          mkdir -p ../shots
          # Die Tour braucht mit Software-Grafik gut 12 Minuten (mit Ersteller, Serie, Weiterbauen): genug Luft, damit sie nicht mittendrin abbricht
          timeout 1500 xvfb-run -a -s "-screen 0 1100x2400x24" \
            godot --rendering-driver opengl3 --resolution 1080x2340 --position 0,0 -- --shots=$GITHUB_WORKSPACE/shots > ../shots.log 2>&1 || echo "Tour beendet mit Code $?"
          tail -40 ../shots.log
          ls -la ../shots
          # Prüfungen der Tour mit echter Eingabe: jede Zeile „…CHECK ok=false“ lässt den Build scheitern
          grep -E "CHECK ok=" ../shots.log || true
          if grep -n "SCRIPT ERROR" -A3 ../shots.log; then echo "Skriptfehler in der Screenshot-Tour"; exit 1; fi
          if grep -nE "CHECK ok=false" ../shots.log; then echo "Eine Prüfung der Screenshot-Tour ist fehlgeschlagen"; exit 1; fi
          # Die Tour muss ganz durchgelaufen sein, und jede Prüfung muss da sein (ein Abbruch druckt sie nicht)
          grep -qE "^TOUR-DONE checks=[0-9]+ failed=0" ../shots.log || { echo "Die Screenshot-Tour lief nicht bis zum Ende"; exit 1; }
          for c in creator_finish day_overview day1_goal_card character_coach day1_tutorial goal_chip day1_your_turn no_auto_twist_after_input \
                   day_success permission_ask continue_mode_no_limit day_locked_until_tomorrow next_day_debug_unlocks day_next \
                   streak_increments reminder_scheduled daily_world \
                   day2_rain_reveal day_help resting_row_feedback resting_row_rain day_fail day4_wish day5_choice \
                   day6_faith day6_war day7_green day7_smog world_complete free_play \
                   rain rain_refused rain_off merge merge_repeat choice choice_longpress choice_outside \
                   choice_timeout choice_mini field_sheet war smog coach_wish wish strike flood complete game_over; do
            grep -q "CHECK ok=true name=$c " ../shots.log || { echo "Prüfung $c fehlt"; exit 1; }
          done
          touch ../shots/.tour_done

      - name: Screenshots ins Repo legen (docs/screenshots)
        if: github.event_name == 'push'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Nur einen vollständigen Satz Bilder übernehmen
          test -f shots/.tour_done || { echo "Tour unvollständig: Screenshots bleiben, wie sie sind"; exit 0; }
          mkdir -p $PROJECT/docs/screenshots
          rm -f $PROJECT/docs/screenshots/*.jpg
          cp shots/*.jpg $PROJECT/docs/screenshots/ || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $PROJECT/docs/screenshots
          git diff --cached --quiet || (git commit -q -m "gdpd: Screenshots aus Build ${GITHUB_RUN_NUMBER} [skip ci]" && git push -q origin HEAD:${GITHUB_REF_NAME}) || echo "Push der Screenshots fehlgeschlagen"

      - name: Screenshots hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdpd-screenshots
          path: |
            shots/
            shots.log
          if-no-files-found: warn

      - name: Gradle-Cache (Android-Build)
        uses: actions/cache@v4
        with:
          path: |
            /github/home/.gradle/caches
            /github/home/.gradle/wrapper
          key: gradle-gdpd-4.3-${{ hashFiles('gdpd/android_plugin/**', 'gdpd/addons/gdpd_reminder/**') }}
          restore-keys: |
            gradle-gdpd-4.3-

      - name: Android-APK exportieren (Gradle mit Erinnerungs-Plugin, sonst ohne)
        run: |
          cd $PROJECT
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/; s/^version\/name=.*/version\/name=\"0.1.${GITHUB_RUN_NUMBER}\"/" export_presets.cfg
          mkdir -p build
          # 1. Gradle-Build: Android-SDK 34, Bauvorlage nach android/, Plugin-AAR (javac), Export, Prüfung des APK
          #    (docs/GDPD_TAEGLICH_CHARAKTER.md 6.6; das Skript gibt alles ausführlich aus)
          if ANDROID_HOME=/usr/lib/android-sdk bash android_plugin/ci_android_export.sh build/gdpd.apk; then
            echo "ANDROID_NOTE=**Erinnerungen:** Dieses APK enthält das Erinnerungs-Plugin (Gradle-Build) – dein Charakter erinnert dich höchstens einmal am Tag." >> "$GITHUB_ENV"
          else
            # 2. Rückfall: das bisherige APK ohne Gradle und ohne Plugin (das Spiel plant dann nur Protokoll-Zeilen)
            echo "::warning title=Android::Gradle-Export fehlgeschlagen – das APK wird ohne Erinnerungs-Plugin gebaut (Log: android_export.log)"
            sed -i "s/^gradle_build\/use_gradle_build=.*/gradle_build\/use_gradle_build=false/" export_presets.cfg
            rm -f build/gdpd.apk
            godot --headless --verbose --export-debug "Android" build/gdpd.apk 2>&1 | tail -40
            echo "ANDROID_NOTE=**Hinweis:** Dieser Build hat **keine** Handy-Erinnerungen – der Gradle-Build mit dem Erinnerungs-Plugin ist fehlgeschlagen (Rückfall auf das einfache APK)." >> "$GITHUB_ENV"
          fi
          ls -la build
          test -s build/gdpd.apk

      - name: Android-Export-Log hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdpd-android-export-log
          path: ${{ env.PROJECT }}/build/android_export.log
          if-no-files-found: ignore

      - name: PC-Versionen exportieren (Windows, Linux)
        run: |
          cd $PROJECT
          mkdir -p build/windows build/linux
          godot --headless --export-release "Windows" build/windows/gdpd.exe 2>&1 | tail -15
          godot --headless --export-release "Linux" build/linux/gdpd.x86_64 2>&1 | tail -15
          ls -la build/windows build/linux
          test -s build/windows/gdpd.exe
          test -s build/linux/gdpd.x86_64
          cd build/linux && chmod +x gdpd.x86_64 && zip -q ../gdpd_linux.zip gdpd.x86_64

      - name: Testversion veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gdpd-testversion
          name: "gdpd – Testversion"
          prerelease: true
          make_latest: false
          body: |
            Automatisch gebaut aus `${{ github.sha }}` (Build ${{ github.run_number }}).

            **gdpd** ist das Gottspiel auf dem Würfel – der Ableger von „God does play dice!“
            (das Original gibt es weiter unter `dice-testversion`).
            **Die Schöpfung in 7 Tagen:** Jeder Tag hat eine Aufgabe (oben im Ziel-Chip), wenige Drehungen und bis zu
            3 Sterne. Dreh drei gleiche Felder in eine neue Reihe – sie wachsen. Erst Land, dann Pflanzen, Tiere, Menschen;
            ab Tag 5 entscheidest du, was wächst. Nach Tag 7 ist deine Welt vollendet und das freie Spiel geht auf.
            Halte ein Symbol gedrückt, um es zu erklären.

            ${{ env.ANDROID_NOTE }}

            **Am Handy installieren (Android):** `gdpd.apk` antippen, herunterladen, öffnen.
            Beim ersten Mal fragt Android, ob der Browser Apps installieren darf: erlauben.
            gdpd lässt sich neben dem Original installieren; neue Testversionen gehen über die alte drüber.

            **Am PC (Windows):** `gdpd.exe` herunterladen und starten. Windows warnt eventuell
            („Der Computer wurde durch Windows geschützt“), weil die Datei nicht signiert ist: „Weitere Informationen“ → „Trotzdem ausführen“.
            Bedienung: Ziehen mit der linken Maustaste dreht eine Reihe bzw. die Ansicht, Mausrad zoomt.

            **Am PC (Linux):** `gdpd_linux.zip` entpacken, `gdpd.x86_64` starten.
          files: |
            ${{ env.PROJECT }}/build/gdpd.apk
            ${{ env.PROJECT }}/build/windows/gdpd.exe
            ${{ env.PROJECT }}/build/gdpd_linux.zip
