<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2b6cb8">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>STUNT Alpenflug K90 – Skisprung</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #2b6cb8; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; touch-action: none;
         -webkit-user-select: none; user-select: none; }
  #game { display: block; width: 100%; height: 100%; touch-action: none; }
  /* HUD-Canvas: volle Auflösung, scharfe Texte, liegt über der Welt */
  #hud { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  /* --- Glas-Overlays (Start / Ergebnis / Tutorial) --- */
  .panel {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    background: linear-gradient(160deg, rgba(13,27,46,.97), rgba(9,18,32,.98));
    color: #eef6ff; border-radius: 24px;
    padding: 26px 28px; width: min(92vw, 400px); text-align: center;
    box-shadow: 0 24px 60px rgba(2,10,24,.55), inset 0 1px 0 rgba(255,255,255,.12);
    border: 1px solid rgba(120,200,255,.22);
    animation: pop .32s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes pop { from { transform: translate(-50%,-46%) scale(.92); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .panel { animation: none; } }
  .panel h1 {
    font-size: 34px; font-weight: 900; letter-spacing: 3px;
    background: linear-gradient(100deg, #7fd8ff 10%, #ffffff 50%, #9be8ff 90%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .panel h2 { font-size: 15px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #8fc6ea; }
  .panel .sub { color: #7ea8c9; font-size: 13px; letter-spacing: 1px; margin: 4px 0 16px; }
  .panel .big {
    font-size: 54px; font-weight: 900; margin: 8px 0 2px; letter-spacing: -1px;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(180deg, #ffffff, #9adcff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .pills { display: flex; gap: 8px; justify-content: center; margin: 14px 0 6px; }
  .pill { flex: 1; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12);
          border-radius: 14px; padding: 9px 4px; }
  .pill .v { font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .pill .k { font-size: 10px; color: #7ea8c9; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }
  .total { font-size: 15px; color: #cfe6f8; margin: 6px 0 4px; }
  .total b { font-size: 22px; color: #fff; }
  .windline { font-size: 13px; color: #7ea8c9; margin-bottom: 12px; }
  .rating { font-weight: 800; color: #9be8ff; }
  .panel button {
    font: inherit; font-weight: 800; font-size: 17px; letter-spacing: .5px; color: #06222e;
    background: linear-gradient(180deg, #7fe3ff, #22b8e6); border: none; border-radius: 14px;
    padding: 14px 26px; margin-top: 10px; cursor: pointer; width: 100%;
    box-shadow: 0 6px 20px rgba(34,184,230,.45), inset 0 1px 0 rgba(255,255,255,.6);
  }
  .panel button:active { transform: translateY(1px); }
  .menurow { display: flex; gap: 8px; margin-top: 8px; }
  .panel .menurow button.secondary {
    background: rgba(255,255,255,.08); color: #cfe6f8; box-shadow: none;
    border: 1px solid rgba(120,200,255,.25); font-size: 15px; padding: 11px; margin-top: 0;
  }
  .best { font-size: 13px; color: #ffd35c; margin-top: 12px; font-weight: 600; }
  .hint { font-size: 12px; color: #7ea8c9; margin-top: 10px; line-height: 1.5; }
  .roundline { font-size: 14px; color: #9be8ff; font-weight: 700; margin: 2px 0 6px; }
  .place { font-size: 19px; color: #ffd35c; font-weight: 900; letter-spacing: .5px; margin: 4px 0; }
  .hidden { display: none !important; }

  #muteBtn {
    position: fixed; left: 12px; bottom: max(12px, env(safe-area-inset-bottom, 0px));
    width: 42px; height: 42px; border-radius: 50%; cursor: pointer;
    border: 1px solid rgba(120,200,255,.3); background: rgba(13,27,46,.72);
    font-size: 18px; line-height: 1; color: #fff; z-index: 5;
  }
  #homeBtn {
    position: fixed; left: 62px; bottom: max(12px, env(safe-area-inset-bottom, 0px));
    width: 42px; height: 42px; border-radius: 50%; cursor: pointer;
    border: 1px solid rgba(120,200,255,.3); background: rgba(13,27,46,.72);
    font-size: 20px; line-height: 1; color: #fff; z-index: 5;
  }
  #nextBtn {
    position: fixed; left: 50%; bottom: max(6vh, env(safe-area-inset-bottom, 0px) + 20px);
    transform: translateX(-50%); z-index: 6; cursor: pointer;
    font: 800 17px system-ui; letter-spacing: .5px; color: #06222e;
    background: linear-gradient(180deg, #7fe3ff, #22b8e6);
    border: none; border-radius: 14px; padding: 13px 32px;
    box-shadow: 0 6px 20px rgba(34,184,230,.45), inset 0 1px 0 rgba(255,255,255,.6);
    animation: rise .3s cubic-bezier(.2,1.3,.4,1);
  }
  #nextBtn:active { transform: translateX(-50%) translateY(1px); }

  /* Tutorial-Karte (blockiert keine Taps – die gehen ans Canvas) */
  #tutCard {
    position: fixed; left: 50%; bottom: max(4vh, env(safe-area-inset-bottom, 0px) + 18px);
    transform: translateX(-50%);
    width: min(90vw, 380px); pointer-events: none;
    background: linear-gradient(160deg, rgba(13,27,46,.96), rgba(9,18,32,.97));
    border: 1px solid rgba(120,200,255,.25); border-left: 4px solid #35d0ff;
    border-radius: 16px; padding: 14px 16px; color: #eef6ff;
    box-shadow: 0 14px 40px rgba(2,10,24,.5);
    animation: rise .3s cubic-bezier(.2,1.3,.4,1);
  }
  @keyframes rise { from { transform: translateX(-50%) translateY(14px); opacity: 0; } }
  #tutCard .step { font-size: 10px; font-weight: 800; letter-spacing: 2px; color: #35d0ff; text-transform: uppercase; }
  #tutCard .txt { font-size: 15px; font-weight: 600; line-height: 1.45; margin-top: 4px; }
  #tutCard .go { font-size: 12px; color: #7ea8c9; margin-top: 8px; animation: blink 1.1s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  #tutCard .row { display: flex; gap: 14px; align-items: center; margin-top: 6px; }
  #tutCard .gest { flex: none; width: 64px; text-align: center; }
  #tutAnim { position: relative; width: 64px; height: 58px; }
  #tutAnim .dot, #tutAnim .ring2 { position: absolute; left: 50%; top: 50%; width: 20px; height: 20px; margin: -10px; border-radius: 50%; }
  #tutAnim .dot { background: #eaf6ff; box-shadow: 0 2px 8px rgba(0,0,0,.45); }
  #tutAnim .ring2 { border: 2px solid #35d0ff; opacity: 0; }
  #tutAnim.tap .dot { animation: tutTap 1.15s ease-in-out infinite; }
  #tutAnim.tap .ring2 { animation: tutRipple 1.15s ease-out infinite; }
  @keyframes tutTap { 0%, 100% { transform: scale(1); } 12% { transform: scale(.68); } 28% { transform: scale(1); } }
  @keyframes tutRipple { 0%, 10% { opacity: 0; transform: scale(.7); } 16% { opacity: .95; } 55% { opacity: 0; transform: scale(2.6); } 100% { opacity: 0; } }
  #tutAnim.swipe::before { content: ''; position: absolute; left: 50%; top: 4px; bottom: 4px; width: 3px; margin-left: -1.5px; border-radius: 2px; background: rgba(120,200,255,.28); }
  #tutAnim.swipe .dot { animation: tutSwipe 1.7s ease-in-out infinite; }
  @keyframes tutSwipe { 0%, 100% { transform: translateY(15px); } 50% { transform: translateY(-15px); } }
  #tutCard .lbl { font-size: 9px; font-weight: 800; letter-spacing: 1px; color: #5cffa8; text-transform: uppercase; margin-top: 3px; line-height: 1.3; }
  @media (prefers-reduced-motion: reduce) { #tutCard, #tutCard .go, #tutAnim .dot, #tutAnim .ring2 { animation: none; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="hud"></canvas>

<!-- Startbildschirm -->
<div id="startPanel" class="panel">
  <h1>ALPENFLUG <span style="color:#ffd35c">STUNT</span></h1>
  <div class="sub">STUNT-FLUG · WEICH DEN SÄGEBLÄTTERN AUS!</div>
  <button id="startBtn">Wettkampf starten</button>
  <div class="menurow">
    <button id="trainBtn" class="secondary">Training</button>
    <button id="tutBtn" class="secondary">Tutorial</button>
  </div>
  <div class="hint">Tippen: Start · Absprung · Landeposition.<br>Im Flug: Finger halten &amp; wischen – neuer Tipp = Landung.<br>Desktop: Leertaste + ↑ ↓ · M = Ton</div>
  <div class="best" id="startBest"></div>
</div>

<!-- Weiter-Button (das Ergebnis läuft live unter dem Springer auf dem Canvas) -->
<button id="nextBtn" class="hidden">Nächster Sprung</button>

<button id="muteBtn" title="Ton an/aus (M)">🔊</button>
<button id="homeBtn" class="hidden" title="Zurück zum Menü">⌂</button>

<!-- Interaktives Tutorial -->
<div id="tutCard" class="hidden">
  <div class="step" id="tutStep">Tutorial 1/4</div>
  <div class="row">
    <div class="gest">
      <div id="tutAnim" class="tap"><div class="ring2"></div><div class="dot"></div></div>
      <div class="lbl" id="tutLbl">Tippen</div>
    </div>
    <div class="txt" id="tutText"></div>
  </div>
  <div class="go" id="tutGo">▸ Tippen zum Fortfahren</div>
</div>

<script>
'use strict';

/* =====================================================================
   ALPENFLUG K90 – HTML5-Canvas-Skisprung-Prototyp (Vanilla JS)
   Struktur:
     CONFIG   – alle Balancing-Parameter
     Hill     – Anlaufspur + Aufsprungprofil (vorberechnete Punktlisten)
     Input    – Pointer + Tastatur, vereinheitlicht
     Tutorial – interaktive Schritte mit Spielpausen (nur beim 1. Mal)
     Game     – State-Machine (MENU → GATE → INRUN → FLIGHT → OUTRUN → RESULT)
     Render   – Kamera, Parallax, Schanze, Springer, HUD
   ===================================================================== */

// ------------------------------------------------------------------ CONFIG
const CONFIG = {
  // Allgemein
  gravity: 9.81,              // m/s²
  timestep: 1 / 240,          // fixe Physikrate (240 Hz → butterweich auch auf 120-Hz-Displays)
  pixelLevels: 0,             // Retro-Posterisierung (0 = aus → modernes Flat Design)
  ditherAmount: 0.5,          // Breite der Dither-Übergänge (nur bei pixelLevels > 0)

  // Schanze (K90 / HS100)
  kPoint: 200,                 // K-Punkt in m (entlang des Hangs gemessen)
  hillSize: 300,              // Hillsize in m
  takeoffHeight: 3.0,         // Höhe der Tischkante über dem Profil-Ursprung (m)
  tableAngle: 10.5,           // Neigung des Schanzentischs (Grad, abwärts)
  tableLength: 6.5,           // Länge des Tischs (m)
  inrunAngle: 35,             // Neigung des Anlaufhangs (Grad)
  inrunStraight: 42,          // Länge des geraden Anlaufstücks (m)
  inrunRadius: 90,            // Übergangsradius Anlauf → Tisch (m)
  gateOffset: 3.5,            // Startposition unterhalb des Spur-Anfangs (m)
  // Aufsprungprofil: Winkelverlauf über horizontale Distanz x
  landing: { startAngle: 10, maxAngle: 36, steepen0: 8, steepen1: 50, flat0: 300, flat1: 385 },

  // Anlauf
  inrunFriction: 0.025,       // Gleitreibungskoeffizient Ski/Spur
  inrunDrag: 0.0011,          // Luftwiderstand in der Hocke (a = k·v²)

  // Absprung (jederzeit möglich – der Springer streckt sich sofort)
  takeoffImpulse: 3.5,        // Absprung-Impuls senkrecht zur Spur (m/s)
  perfectWindow: 0.016,       // Sekunden vor der Tischkante = "perfekt" – muss GENAU sitzen (~40 cm)
  earlyFalloff: 0.38,         // Bewertungs-Abfall für frühe Sprünge (steiler = Timing zählt mehr)
  lateWindow: 0.18,           // so lange nach der Kante zählt ein Tap noch (stark reduziert)
  jumpAnimTime: 0.16,         // Dauer der Streck-Animation beim Absprung (s)

  // Flug
  liftCoefficient: 0.0058,    // Auftrieb: a = CL · v_rel² · liftFactor(α)
  dragCoefficient: 0.0024,    // Grundwiderstand: a = CD · v_rel² · dragFactor(α)
  dragAngleFactor: 0.0042,    // Zusatzwiderstand bei steilem Anstellwinkel
  // Der Spieler steuert den ANSTELLWINKEL (alpha) direkt – der Körper folgt der
  // Flugbahn automatisch. Drift + Böen stören alpha, Wischen korrigiert.
  optimalAngle: 12,           // optimaler Anstellwinkel α relativ zur Anströmung (Grad)
  angleTolerance: 11,        // ± Korridor (Grad) – eng: 5° daneben kosten ~30 m
  angleSpeed: 40,             // Änderungsrate der Tastatursteuerung (Grad/s)
  swipeSensitivity: 0.11,     // Grad Winkeländerung pro Pixel Wischweg (absolut –
                              // fühlt sich in jedem Fenster/Vollbild gleich an)
  pitchDrift: 1.2,            // Aufdreh-Tendenz von alpha (Grad/s) – regelmäßig gegenwischen
  gustPitchFactor: 2.0,       // Böen stören alpha (Grad/s pro m/s Böenabweichung)
  gustPitchV: 3.0,            // vertikale Böen stören alpha zusätzlich
  windPitchH: 0.4,            // stetiger Horizontalwind drückt die Haltung (Grad/s pro m/s)
  windPitchV: 1.0,            // stetiger Auf-/Abwind drückt die Haltung (Grad/s pro m/s)
  windShakeMin: 3.5,          // ab diesem Störwert (Grad/s) zittert die Figur
  jumpLockout: 3.0,           // Sekunden nach dem Abstoßen ohne Absprung (schützt vor Doppel-Tap)
  gateGreenDelay: 1.5,        // Sekunden bis die Startampel auf Grün springt
  startWindow: 10,            // Startfenster wie bei der FIS: 10 s nach Grün
  hapticMin: 5.0,             // ab diesem Störwert vibriert das Handy
  initAlpha: 9,               // Anstellwinkel unmittelbar nach dem Absprung
  initAlphaSpread: 5,         // schlechter Absprung → Startlage streut bis ± so viel
  impulseBase: 0.72,          // Impuls-Grundanteil; Rest kommt nur bei gutem Timing
  alphaMin: -12, alphaMax: 32,// Begrenzung des steuerbaren Anstellwinkels
  bodyFollowRate: 140,        // wie schnell der Körper der Bahn nachrotiert (Grad/s)
  bodyMin: -70, bodyMax: 25,  // Begrenzung des Körperwinkels (Grad, absolut)

  // Wind (positiv = Rückenwind → schlechter, negativ = Gegenwind → besser)
  windStrength: 1.2,          // maximale Windstärke ± m/s (zufällig pro Sprung)
  windVertical: 0.4,          // vertikaler Wind (Auf-/Abwind) ± m/s – große Wirkung!
  windWander: 0.35,           // langsames Wandern des Winds während des Sprungs
  windAeroFactor: 2.0,        // Gameplay-Verstärkung der Windwirkung auf die Anströmung
  gustAmount: 0.22,           // Böen: ±45 % um den Basiswind
  inrunFricJitter: 0.08,      // Spur-/Wachs-Streuung: ±8 % Reibung pro Sprung

  // Landung (DSJ-Stil): zweiter Tap = sofort Landeposition. In der Landeposition
  // bricht der Auftrieb ein (zu früh = Weitenverlust), ohne Landeposition = Sturz.
  stanceLift: 0.35,           // Auftrieb-Faktor in Landeposition
  stanceDrag: 1.9,            // Widerstands-Faktor in Landeposition
  stanceCrashTime: 0.055,     // Position < 55 ms vor dem Aufsetzen → Sturz (zu spät)
  stanceWobbleTime: 0.16,     // < 160 ms → wacklige Landung (Notenabzug)
  stanceEarlyTime: 0.85,      // Position länger als das vor dem Aufsetzen → Jury-Abzug
  earlyNotePenalty: 2.2,      // Notenabzug pro Sekunde zu früh eingeleiteter Landung
  crashSpeed: 11.5,           // Aufprall senkrecht zum Hang > x m/s = Sturz
  outrunFriction: 0.06,       // Gleitreibung direkt nach der Landung
  brakeFriction: 0.75,        // Schneepflug-Bremsen im Auslauf (Springer hält an)
  crashFriction: 0.30,        // Sturz bremst stark

  // Punkte (FIS-Schema)
  meterValue: 1.8,            // Weitenpunkte pro Meter (K90-Standard)
  basePoints: 60,             // Punkte am K-Punkt
  windFactor: 3.5,            // Windpunkte pro m/s (Kompensation, K90-getunt)
  fieldSize: 30,              // Starterfeld inkl. Spieler (für die Platzierung)

  // Kamera (sichtbare Weltbreite in m pro Phase – kleiner = näher dran)
  camGateView: 13.5,
  camInrunView: 22,
  camFlightMin: 17.5, camFlightMax: 46,
  camOutrunView: 20,
};

// ------------------------------------------------------------------ Utils
const D2R = Math.PI / 180;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const damp = (cur, target, rate, dt) => lerp(cur, target, 1 - Math.exp(-rate * dt));
// localStorage kann in Sandbox-Umgebungen beim Zugriff werfen
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

// ------------------------------------------------------------------ Hill
// Weltkoordinaten: Tischkante = (0, 0). +x in Flugrichtung, +y nach oben.
const Hill = (() => {
  const L = CONFIG.landing;

  function landingAngle(x) {
    if (x < L.steepen1)
      return L.startAngle + (L.maxAngle - L.startAngle) * smoothstep((x - L.steepen0) / (L.steepen1 - L.steepen0));
    if (x < L.flat0) return L.maxAngle;
    return L.maxAngle * (1 - smoothstep((x - L.flat0) / (L.flat1 - L.flat0)));
  }

  // Profil integrieren: y(x) und Bogenlänge s(x) (= gemessene Weite)
  const STEP = 0.5, XMAX = 470;
  const prof = [{ x: 0, y: -CONFIG.takeoffHeight, s: 0 }];
  for (let x = STEP; x <= XMAX; x += STEP) {
    const th = landingAngle(x - STEP / 2) * D2R;
    const p = prof[prof.length - 1];
    prof.push({ x, y: p.y - Math.tan(th) * STEP, s: p.s + STEP / Math.cos(th) });
  }
  function groundAt(x) {
    x = clamp(x, 0, XMAX - STEP);
    const i = Math.floor(x / STEP), t = (x - prof[i].x) / STEP;
    return {
      y: lerp(prof[i].y, prof[i + 1].y, t),
      s: lerp(prof[i].s, prof[i + 1].s, t),
      angle: landingAngle(x),
    };
  }
  function xAtDistance(s) {
    for (let i = 1; i < prof.length; i++)
      if (prof[i].s >= s) return lerp(prof[i - 1].x, prof[i].x, (s - prof[i - 1].s) / (prof[i].s - prof[i - 1].s));
    return XMAX;
  }

  // Anlaufspur: vom Tisch rückwärts integriert. inrun[0] = Startpunkt oben.
  const arcLen = (CONFIG.inrunAngle - CONFIG.tableAngle) * D2R * CONFIG.inrunRadius;
  const inrunLength = CONFIG.inrunStraight + arcLen + CONFIG.tableLength;
  function inrunAngleAt(sFromTop) {
    if (sFromTop < CONFIG.inrunStraight) return CONFIG.inrunAngle;
    if (sFromTop < CONFIG.inrunStraight + arcLen)
      return CONFIG.inrunAngle - (sFromTop - CONFIG.inrunStraight) / arcLen * (CONFIG.inrunAngle - CONFIG.tableAngle);
    return CONFIG.tableAngle;
  }
  const inrun = [];
  {
    let x = 0, y = 0;
    const n = Math.ceil(inrunLength / STEP);
    inrun[n] = { x: 0, y: 0, s: inrunLength };
    for (let i = n - 1; i >= 0; i--) {
      const s = i * STEP;
      const th = inrunAngleAt(s + STEP / 2) * D2R;
      x -= Math.cos(th) * STEP; y += Math.sin(th) * STEP;
      inrun[i] = { x, y, s };
    }
  }
  function inrunAt(s) {
    s = clamp(s, 0, inrunLength - 0.001);
    const i = Math.floor(s / STEP);
    const t = (s - inrun[i].s) / (inrun[i + 1].s - inrun[i].s);
    return {
      x: lerp(inrun[i].x, inrun[i + 1].x, t),
      y: lerp(inrun[i].y, inrun[i + 1].y, t),
      angle: inrunAngleAt(s),
    };
  }
  // Anlaufspur nach x abfragen (für Kollision beim Sprung ÜBER der Spur)
  function inrunAtX(x) {
    x = clamp(x, inrun[0].x, 0);
    let lo = 0, hi = inrun.length - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (inrun[m].x <= x) lo = m; else hi = m; }
    const a = inrun[lo], b = inrun[hi];
    const t = (x - a.x) / ((b.x - a.x) || 1);
    const s = lerp(a.s, b.s, t);
    return { y: lerp(a.y, b.y, t), s, angle: inrunAngleAt(s) };
  }

  return { prof, groundAt, xAtDistance, inrun, inrunAt, inrunAtX, inrunLength, landingAngle };
})();

// ------------------------------------------------------------------ Input
const Input = (() => {
  // tap: sofort bei Berührung (zeitkritisch: Start/Absprung).
  // tapUp: nur bei kurzem Tipp OHNE Wischbewegung (Landeposition) – so löst
  // ein Wisch-Griff nach dem Absprung nie versehentlich die Landung aus.
  const state = { tap: false, tapUp: false, pointerDown: false };
  let lastY = 0, swipeAcc = 0, downT = 0, moveTotal = 0;
  const keys = {};
  const canvas = document.getElementById('game');

  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    Sound.init();
    state.tap = true;
    state.pointerDown = true;
    lastY = e.clientY;
    downT = performance.now();
    moveTotal = 0;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  });
  canvas.addEventListener('pointermove', e => {
    if (!state.pointerDown) return;
    const dy = lastY - e.clientY;
    swipeAcc += dy;
    moveTotal += Math.abs(dy);
    lastY = e.clientY;
  });
  const up = () => {
    if (state.pointerDown && performance.now() - downT < 250 && moveTotal < 14)
      state.tapUp = true;
    state.pointerDown = false;
  };
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', () => { state.pointerDown = false; });

  window.addEventListener('keydown', e => {
    if (e.repeat) return;
    Sound.init();
    keys[e.key] = true;
    if (e.key === ' ' || e.key === 'Enter') { state.tap = true; state.tapUp = true; }
    if (e.key === 'd' || e.key === 'D') Game.debug = !Game.debug;
    if (e.key === 'm' || e.key === 'M') muteBtn.click();
  });
  window.addEventListener('keyup', e => { keys[e.key] = false; });

  // Pro Physikframe: liefert Steuerwerte, konsumiert Taps und Wischweg (px).
  function poll() {
    let a = 0;
    if (keys['ArrowUp'] || keys['w']) a = 1;
    if (keys['ArrowDown'] || keys['s']) a = -1;
    const tap = state.tap; state.tap = false;
    const tapUp = state.tapUp; state.tapUp = false;
    const swipe = swipeAcc; swipeAcc = 0;
    return { tap, tapUp, angle: a, swipe };
  }
  return { poll, state };
})();

// ------------------------------------------------------------------ Haptik
// Vibration, wenn der Wind an der Fluglage reißt (Android; iOS ignoriert es still).
const Haptics = (() => {
  let last = 0;
  function gust(strength) {
    if (!navigator.vibrate) return;
    const now = performance.now();
    if (now - last < 160) return; // Puls-Abstand, kein Dauerbrummen
    last = now;
    navigator.vibrate(Math.min(12 + strength * 3, 45) | 0);
  }
  return { gust };
})();

// ------------------------------------------------------------------ Sound
// Komplett synthetisiert (WebAudio): Windrauschen + kurze Effekt-Töne.
const Sound = (() => {
  let ac = null, master = null, windGain = null, windFilter = null;
  let enabled = true;

  function init() { // muss aus einer User-Geste heraus passieren
    if (ac) { if (ac.state === 'suspended') ac.resume().catch(() => {}); return; }
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    master = ac.createGain(); master.gain.value = 0.5; master.connect(ac.destination);
    // Dauerschleife Rauschen → Bandpass → Gain (Wind)
    const buf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
    windFilter = ac.createBiquadFilter(); windFilter.type = 'bandpass';
    windFilter.frequency.value = 500; windFilter.Q.value = 0.7;
    windGain = ac.createGain(); windGain.gain.value = 0;
    src.connect(windFilter).connect(windGain).connect(master);
    src.start();
  }

  function wind(level, freq) {
    if (!ac) return;
    windGain.gain.setTargetAtTime(enabled ? level : 0, ac.currentTime, 0.12);
    windFilter.frequency.setTargetAtTime(freq, ac.currentTime, 0.2);
  }

  function tone(freq, dur, { type = 'sine', vol = 0.25, slide = 0, delay = 0 } = {}) {
    if (!ac || !enabled) return;
    const t0 = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g).connect(master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }

  function burst(dur, vol, freq, q = 1, delay = 0) { // Rausch-Impuls (Swoosh/Aufprall)
    if (!ac || !enabled) return;
    const t0 = ac.currentTime + delay;
    const buf = ac.createBuffer(1, Math.floor(ac.sampleRate * dur), ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const n = ac.createBufferSource(); n.buffer = buf;
    const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    const g = ac.createGain(); g.gain.value = vol;
    n.connect(f).connect(g).connect(master);
    n.start(t0);
  }

  return {
    init, wind,
    click:    () => tone(700, 0.07, { type: 'triangle', vol: 0.14 }),
    takeoff:  () => { burst(0.3, 0.5, 1200, 0.8); tone(280, 0.25, { type: 'triangle', vol: 0.2, slide: 320 }); },
    perfect:  () => { tone(880, 0.12, { vol: 0.2, delay: 0.1 }); tone(1320, 0.2, { vol: 0.2, delay: 0.2 }); },
    stance:   () => tone(520, 0.08, { type: 'triangle', vol: 0.18 }),
    telemark: () => { tone(660, 0.12, { vol: 0.24 }); tone(990, 0.24, { vol: 0.24, delay: 0.1 }); burst(1.1, 0.22, 900, 0.5, 0.15); },
    landOk:   () => { tone(520, 0.16, { vol: 0.2 }); burst(0.6, 0.16, 800, 0.6, 0.05); },
    crash:    () => { tone(90, 0.4, { type: 'sawtooth', vol: 0.32, slide: -50 }); burst(0.5, 0.5, 300, 0.6); },
    toggle()  { enabled = !enabled; if (ac && !enabled) windGain.gain.setTargetAtTime(0, ac.currentTime, 0.05); return enabled; },
  };
})();

// ------------------------------------------------------------------ Ragdoll
// Verlet-Ragdoll für Stürze: Punktmassen + Stab-Constraints + Bodenkollision.
// Die Ski lösen sich beim Sturz und fliegen als eigene Körper davon.
const Ragdoll = {
  active: false,
  pts: [], sticks: [], skiPts: [], skiSticks: [],

  surfaceAt(x) { return x < 0 ? Hill.inrunAtX(x) : Hill.groundAt(x); },

  start(S) {
    const b = S.body * D2R, cos = Math.cos(b), sin = Math.sin(b);
    // Startpunkte aus der aktuellen Figur (lokal: x nach vorn, y nach oben)
    const mk = (lx, ly) => {
      const wx = S.x + lx * cos - ly * sin;
      const wy = S.y + lx * sin + ly * cos;
      return { x: wx, y: wy,
               px: wx - S.vx * CONFIG.timestep + (Math.random() - 0.5) * 0.03,
               py: wy - S.vy * CONFIG.timestep + (Math.random() - 0.5) * 0.03 };
    };
    // 0 Hüfte, 1 Schulter, 2 Kopf, 3 Fuß vorn, 4 Fuß hinten, 5 Hand
    this.pts = [mk(-0.45, 0.3), mk(0.55, 0.48), mk(0.74, 0.62),
                mk(0.15, 0.02), mk(-0.15, 0.02), mk(0.05, 0.35)];
    const len = (a, b2) => Math.hypot(this.pts[a].x - this.pts[b2].x, this.pts[a].y - this.pts[b2].y);
    this.sticks = [[0, 1], [1, 2], [0, 3], [0, 4], [1, 5]].map(([a, b2]) => ({ a, b: b2, len: len(a, b2) }));
    // Ski als freie Stäbe mit etwas Drall
    this.skiPts = []; this.skiSticks = [];
    for (const off of [0.02, 0.14]) {
      const p1 = mk(-1.0, off), p2 = mk(1.3, off);
      p1.py -= Math.random() * 0.05; p2.py += Math.random() * 0.05;
      const i = this.skiPts.length;
      this.skiPts.push(p1, p2);
      this.skiSticks.push({ a: i, b: i + 1, len: Math.hypot(p1.x - p2.x, p1.y - p2.y) });
    }
    this.active = true;
  },

  stepSet(pts, sticks, dt) {
    for (const p of pts) {
      const vx = (p.x - p.px) * 0.999, vy = (p.y - p.py) * 0.999;
      p.px = p.x; p.py = p.y;
      p.x += vx; p.y += vy - CONFIG.gravity * dt * dt;
    }
    for (let it = 0; it < 4; it++) {
      for (const s of sticks) {
        const a = pts[s.a], b = pts[s.b];
        const dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.hypot(dx, dy) || 1e-6;
        const corr = (d - s.len) / d / 2;
        a.x += dx * corr; a.y += dy * corr;
        b.x -= dx * corr; b.y -= dy * corr;
      }
      for (const p of pts) {
        const sy = this.surfaceAt(p.x).y;
        if (p.y < sy) {
          const vyN = p.y - p.py;
          p.y = sy;
          p.px = p.x - (p.x - p.px) * 0.5;   // Reibung tangential
          p.py = p.y + vyN * 0.3;            // gedämpfter Abpraller
        }
      }
    }
  },

  step(dt) {
    if (!this.active) return;
    this.stepSet(this.pts, this.sticks, dt);
    this.stepSet(this.skiPts, this.skiSticks, dt);
  },

  speed() {
    let m = 0;
    for (const p of this.pts) m = Math.max(m, Math.hypot(p.x - p.px, p.y - p.py));
    return m / CONFIG.timestep;
  },
};

// ------------------------------------------------------------------ Tutorial
// Beim ersten Spiel: an Schlüsselmomenten pausieren, erklären, bei Tap weiter.
const Tutorial = {
  active: false, // Tipps standardmäßig aus – Aktivierung über den Tutorial-Button im Menü
  step: 0,
  paused: false,
  card: null, // DOM-Refs werden unten verdrahtet

  // when(): Bedingung zum Auslösen · pause: Spiel anhalten bis Tap
  steps: [
    { id: 'gate',
      when: () => Game.state === 'GATE',
      pause: false, // Spiel wartet ohnehin – der Start-Tap ist die Aktion
      anim: 'tap', lbl: 'Tippen = Start',
      text: 'Du sitzt am Startbalken. Tippe, um dich abzustoßen – der Anlauf läuft dann automatisch.' },
    { id: 'takeoff',
      when: () => Game.state === 'INRUN' && (Hill.inrunLength - Game.skier.s) / Math.max(Game.skier.v, 0.1) < 1.15,
      pause: true,
      anim: 'tap', lbl: 'Tippen = Absprung',
      text: 'Gleich kommt die Tischkante (rote Linie)! Du kannst jederzeit springen – aber nur GENAU an der Kante holt die volle Weite.' },
    { id: 'flight',
      when: () => Game.state === 'FLIGHT' && Game.flight.time > 0.45,
      pause: true,
      anim: 'swipe', lbl: 'Halten + Wischen',
      text: 'Flug: Finger GEDRÜCKT HALTEN und hoch/runter wischen. Liegt der Springer ruhig und flach über den Skiern, stimmt die Lage – zittert er, musst du korrigieren!' },
    { id: 'landing',
      when: () => Game.state === 'FLIGHT' && Game.landingTap.tta < 0.85,
      pause: true,
      anim: 'tap', lbl: 'Tippen = Landung',
      text: 'Landung: Jetzt loslassen und neu TIPPEN – der Springer geht sofort in die Landeposition. Zu früh kostet Weite, ohne Landeposition stürzt du!' },
  ],

  update() {
    if (!this.active || this.paused || this.step >= this.steps.length) return;
    const s = this.steps[this.step];
    if (s.when() && tutCard.classList.contains('hidden')) {
      this.show(s);
      if (s.pause) this.paused = true;
    }
  },

  show(s) {
    tutStep.textContent = `Tutorial ${this.step + 1}/${this.steps.length}`;
    tutAnim.className = s.anim || 'tap';
    tutLbl.textContent = s.lbl || 'Tippen';
    tutText.textContent = s.text;
    tutGo.textContent = s.pause ? '▸ Tippen zum Fortfahren' : '▸ Tippen, wenn du bereit bist';
    tutCard.classList.remove('hidden');
  },

  // true = Tap wurde vom Tutorial konsumiert (Spiel läuft weiter, Tap zählt nicht)
  consumeTap() {
    if (!this.active || this.step >= this.steps.length) return false;
    if (this.paused) {
      this.paused = false;
      this.advance();
      return true;
    }
    // Nicht-pausierender Schritt (Gate): Tap zählt als Aktion, Karte weg
    if (!tutCard.classList.contains('hidden')) this.advance();
    return false;
  },

  advance() {
    tutCard.classList.add('hidden');
    this.step++;
  },

  finish() {
    if (!this.active) return;
    this.active = false;
    tutCard.classList.add('hidden');
    store.set('alpenflug_tut_v1', '1');
  },
};

// ------------------------------------------------------------------ Game
const Game = {
  state: 'MENU',   // MENU | GATE | INRUN | FLIGHT | OUTRUN | RESULT
  debug: false,
  time: 0,
  outrunTimer: 0,

  // poseA→poseB werden über poseT weich überblendet; crash übersteuert alles
  skier: { x: 0, y: 0, vx: 0, vy: 0, body: 0, s: 0, v: 0, spin: 0, alphaCtl: 0,
           poseA: 'crouch', poseB: 'crouch', poseT: 1, poseDur: 0.2, crash: false, standing: false },

  wind: 0, gustPhase: 0,
  takeoff: { tapped: false, quality: 0, lateTimer: 0, done: false, tapTTE: null },
  flight: { time: 0, corridorTime: 0, alpha: 0, lift: 0, drag: 0, stance: false, stanceT: 0, tv: 0, lastErr: null },
  landingTap: { windowOpen: false, tta: 99 },
  result: null,
  best: (() => { try { return JSON.parse(store.get('alpenflug_stunt_best') || 'null'); } catch (e) { return null; } })(),
  bestComp: parseFloat(store.get('alpenflug_stunt_best_comp') || '0') || 0,
  // Schanzenrekord = weitester gestandener Sprung des TAGES (Spieler springen
  // abwechselnd gegeneinander; jeden Tag zählt neu). Wird nach der
  // Objekt-Definition aus dem Speicher geladen (Schlüssel enthält das Datum).
  record: 0, recordKey: 'alpenflug_record',

  // Modus: 'comp' = Wettkampf (2 Durchgänge + Platzierung), 'train' = freies Springen
  mode: 'comp',
  // Wettkampf: 2 Durchgänge, Gesamtwertung, KI-Starterfeld für die Platzierung
  round: 1,
  roundTotals: [],
  theme: null,
  field: [],

  newCompetition() {
    this.round = 1;
    this.roundTotals = [];
    // Stimmung pro Wettkampf: meist Tag, manchmal Abendlicht
    this.theme = Math.random() < 0.3 ? THEMES.dusk : THEMES.day;
    this.field = [];
    for (let i = 0; i < CONFIG.fieldSize - 1; i++) {
      const skill = 88 + Math.random() * 42;               // Grundstärke des Springers
      this.field.push({
        r1: Math.max(30, skill + (Math.random() - 0.5) * 20),
        r2: Math.max(30, skill + (Math.random() - 0.5) * 20),
      });
    }
  },

  // Platzierung nach aktuellem Stand (Summe der gesprungenen Durchgänge)
  placement() {
    const mine = this.roundTotals.reduce((a, b) => a + (b || 0), 0);
    let rank = 1;
    for (const ai of this.field) {
      const theirs = this.round === 1 ? ai.r1 : ai.r1 + ai.r2;
      if (theirs > mine) rank++;
    }
    return rank;
  },

  obstacles: [],
  message: { text: '', color: '#fff', until: 0, start: 0 },
  popup: null,       // Weiten-Popup nach der Landung
  particles: [],
  fx: [],            // Effekte (z. B. Absprung-Ring)
  trail: [],         // Flugspur-Punkte
  trailT: 0,

  // weiche Pose-Überblendung
  setPose(name, dur = 0.18) {
    const S = this.skier;
    if (S.poseB === name) return;
    S.poseA = S.poseB; S.poseB = name; S.poseT = 0; S.poseDur = dur;
  },

  ring(color) {
    this.fx.push({ x: this.skier.x, y: this.skier.y, t0: this.time, color });
  },

  showMsg(text, color, dur = 1.4) {
    this.message = { text, color, until: this.time + dur, start: this.time };
  },

  // Neuer Sprung: Springer ans Gate, Wind auslosen – Start erst per Tap
  newJump() {
    this.state = 'GATE';
    // Windrichtung frei im Kreis: 0° = Rückenwind, 90° = Aufwind,
    // 180° = Gegenwind, 270° = Abwind – und alles dazwischen.
    // Vertikal elliptisch auf windVertical skaliert (Auf-/Abwind wirkt stärker pro m/s).
    this.windAng = Math.random() * Math.PI * 2;
    const wr = 0.25 + Math.random() * 0.75;
    this.wind = Math.cos(this.windAng) * wr * CONFIG.windStrength;
    this.windV = Math.sin(this.windAng) * wr * CONFIG.windVertical;
    this.gustPhase = Math.random() * 100;
    this.wanderPhase = Math.random() * 100;
    this.gateTimer = 0;
    this.inrunTimer = 0;
    // Sägeblätter: auf Masten oder frei schwebend, Höhen im Flugfenster
    this.obstacles = [];
    for (let ox = 55; ox < 320; ox += 16 + Math.random() * 14) {
      const float = Math.random() < 0.45;
      this.obstacles.push({
        x: ox, h: 1.6 + Math.random() * 7.6, r: 1.35 + Math.random() * 1.15,
        float, bob: float ? 1.0 + Math.random() * 1.4 : 0,
        bobSpd: 0.6 + Math.random() * 0.9, phase: Math.random() * 7,
        spin: (Math.random() < 0.5 ? -1 : 1) * (2.5 + Math.random() * 3.5), hit: false,
      });
    }
    // Windzonen entlang der Strecke: am Absprung gilt exakt der Basiswind,
    // am Hang und im Aufsprung weicht er in Stärke und Richtung ab.
    const zone = () => ({ fw: 0.72 + Math.random() * 0.62, fv: 0.72 + Math.random() * 0.62,
                          ow: (Math.random() - 0.5) * 0.9, ov: (Math.random() - 0.5) * 0.34 });
    this.windZones = [{ fw: 1, fv: 1, ow: 0, ov: 0 }, zone(), zone()];
    this.fricJit = 1 + (Math.random() * 2 - 1) * CONFIG.inrunFricJitter;
    const start = Hill.inrunAt(CONFIG.gateOffset);
    Object.assign(this.skier, { s: CONFIG.gateOffset, v: 0, x: start.x, y: start.y, vx: 0, vy: 0, body: -start.angle,
                                spin: 0, poseA: 'gate', poseB: 'gate', poseT: 1, crash: false, standing: false });
    this.fx.length = 0;
    this.takeoff = { tapped: false, quality: 0, lateTimer: 0, done: false, tapTTE: null };
    this.flight = { time: 0, corridorTime: 0, alpha: 0, lift: 0, drag: 0, stance: false, stanceT: 0, windPush: 0, tv: 0, lastErr: null };
    this.landingTap = { windowOpen: false, tta: 99 };
    this.result = null;
    this.popup = null;
    this.particles.length = 0;
    this.trail.length = 0;
    Ragdoll.active = false;
    hide(startPanel); hide(nextBtn);
  },

  // aktueller Wind: Basis + Böen + langsames Wandern (jeder Sprung anders)
  currentWind() {
    const gust = Math.sin(this.time * 1.3 + this.gustPhase) * Math.sin(this.time * 0.7);
    const wander = Math.sin(this.time * 0.35 + this.wanderPhase) * CONFIG.windWander * CONFIG.windStrength;
    return this.wind * (1 + CONFIG.gustAmount * gust) + wander;
  },
  // Windfeld entlang der Strecke: Zonen Absprung (0 m) / Hang (55 m) /
  // Aufsprung (110 m), dazwischen weich interpoliert. Die Windampel zeigt
  // GENAU dieses Feld – und die Flugphysik nutzt es an der Position des
  // Springers. Was angezeigt wird, stimmt also auf der ganzen Strecke.
  windLocalAt(x) {
    const w = this.currentWind(), wv = this.currentWindV();
    const z = this.windZones;
    if (!z || z.length < 3) return { w, wv };
    const t = clamp(x / 55, 0, 2);
    const i = Math.min(Math.floor(t), 1), f = t - i;
    const s = f * f * (3 - 2 * f);
    return {
      w:  w  * lerp(z[i].fw, z[i + 1].fw, s) + lerp(z[i].ow, z[i + 1].ow, s),
      wv: wv * lerp(z[i].fv, z[i + 1].fv, s) + lerp(z[i].ov, z[i + 1].ov, s),
    };
  },
  windAtPoint(k) { return this.windLocalAt([0, 55, 110][k]); },

  // vertikaler Wind (Auf-/Abwind), leicht pulsierend + eigenes Wandern –
  // zusammen mit currentWind() dreht sich der Windvektor langsam im Kreis
  currentWindV() {
    const wander = Math.sin(this.time * 0.3 + this.wanderPhase * 1.3) * CONFIG.windWander * CONFIG.windVertical;
    return (this.windV || 0) * (1 + 0.4 * Math.sin(this.time * 0.8 + this.gustPhase * 1.7)) + wander;
  },

  // ---------------- Physik-Update (fixer Timestep) ----------------
  update(dt) {
    this.time += dt;
    const inp = Input.poll();
    const S = this.skier;

    // Tutorial: pausierte Schritte fangen den Tap ab
    if (inp.tap && Tutorial.consumeTap()) return;
    if (Tutorial.paused) return;

    if (this.state === 'GATE') {
      this.gateTimer += dt;
      // Startfenster wie bei der FIS: nach Grün bleiben 10 s zum Abstoßen.
      // Läuft die Uhr ab, wird automatisch gestartet (im Tutorial nie).
      const expired = !Tutorial.active
        && this.gateTimer - CONFIG.gateGreenDelay > CONFIG.startWindow;
      if (inp.tap || expired) {
        this.state = 'INRUN';
        this.setPose('crouch', 0.35);
        this.showMsg(expired ? 'Startfenster abgelaufen!' : 'LOS!',
                     expired ? '#ffd35c' : '#9be8ff', expired ? 1.4 : 0.7);
        Sound.click();
      }
    }

    // ---------- ANLAUF ----------
    else if (this.state === 'INRUN') {
      this.inrunTimer += dt;
      const th = Hill.inrunAt(S.s).angle * D2R;
      const a = CONFIG.gravity * Math.sin(th)
              - CONFIG.inrunFriction * this.fricJit * CONFIG.gravity * Math.cos(th)
              - CONFIG.inrunDrag * S.v * S.v;
      S.v += a * dt;
      S.s += S.v * dt;

      // Schneestaub hinter dem Springer (Rate pro Sekunde, framerate-unabhängig)
      if (S.v > 8 && Math.random() < dt * 30) this.dust();

      // Absprung: JEDERZEIT und ÜBERALL möglich (DSJ-Stil) – der Springer hebt
      // sofort physisch ab. Nahe der Kante trägt der Sprung hinaus, weiter oben
      // landet er wieder auf der Spur und verliert Tempo und Haltung.
      // Sprungsperre direkt nach dem Abstoßen: ungeduldige Taps (z.B. vom
      // 'Nächster Sprung'-Button) lösen keinen sofortigen Absprung mehr aus
      if (inp.tap && !this.takeoff.tapped && this.inrunTimer >= CONFIG.jumpLockout) {
        const T = this.takeoff;
        T.tapped = T.jumped = T.done = true;
        const tte = (Hill.inrunLength - S.s) / Math.max(S.v, 0.1);
        T.tapTTE = tte;
        T.quality = tte <= CONFIG.perfectWindow
          ? 1
          : Math.max(0.05, 1 - (tte - CONFIG.perfectWindow) / CONFIG.earlyFalloff);
        const p = Hill.inrunAt(S.s), th = p.angle * D2R;
        const imp = CONFIG.takeoffImpulse * (CONFIG.impulseBase + (1 - CONFIG.impulseBase) * T.quality);
        S.x = p.x; S.y = p.y + 0.02;
        S.vx = S.v * Math.cos(th) + imp * Math.sin(th);
        S.vy = -S.v * Math.sin(th) + imp * Math.cos(th);
        S.body = -p.angle;
        S.alphaCtl = CONFIG.initAlpha
          + (1 - T.quality) * (Math.random() * 2 - 1) * CONFIG.initAlphaSpread
          + (Math.random() * 2 - 1) * 1.2;
        this.setPose('extend', CONFIG.jumpAnimTime);
        this.state = 'FLIGHT';
        this.ring(tte <= CONFIG.perfectWindow ? '#5cffa8' : tte <= 0.15 ? '#b9f6ca' : '#ffb74d');
        this.spray(8);
        Sound.takeoff();
        if (tte <= CONFIG.perfectWindow) Sound.perfect();
        this.rateTakeoff(T.quality, tte <= CONFIG.perfectWindow ? 'perfekt' : 'früh');
      }

      else if (S.s >= Hill.inrunLength) this.startFlight();
      else {
        const p = Hill.inrunAt(S.s);
        S.x = p.x; S.y = p.y; S.body = -p.angle;
      }
    }

    // ---------- FLUG ----------
    else if (this.state === 'FLIGHT') {
      const F = this.flight, T = this.takeoff;

      let tapFree = inp.tap; // ein Tap löst nur EINE Aktion aus

      // Verspäteter Absprung: Tap kurz nach der Kante zählt noch (reduziert)
      if (!T.done) {
        T.lateTimer += dt;
        if (tapFree && T.lateTimer <= CONFIG.lateWindow) {
          tapFree = false;
          T.tapped = true; T.done = true;
          T.quality = Math.max(0.05, 1 - (T.lateTimer + CONFIG.perfectWindow) / (CONFIG.lateWindow + CONFIG.perfectWindow));
          this.applyTakeoffImpulse(T.quality, true);
          this.setPose('extend', CONFIG.jumpAnimTime);
          this.ring('#ffb74d');
          this.spray(6);
          this.rateTakeoff(T.quality, 'spät');
        } else if (T.lateTimer > CONFIG.lateWindow) {
          T.done = true;
          // kein Absprung: zügig trotzdem in die Flughaltung
          this.setPose('flight', 0.45);
          this.rateTakeoff(0, 'keiner');
        }
      }

      // DSJ-Landemechanik: kurzer TIPP (ohne Wischen) = SOFORT Landeposition.
      // Kleine Schonfrist nach dem Absprung, damit der Griffwechsel nie landet.
      if (inp.tapUp && T.done && !F.stance && S.x > 0 && F.time > 0.35) {
        F.stanceTta = Math.min(this.landingTap.tta, 3); // Restflug-Schätzung merken
        F.stance = true;
        F.stanceT = this.time;
        this.setPose('telemark', 0.28);
        Sound.stance();
      }

      // Nach der Streckung zügig in die tiefe Flughaltung absenken
      if (!F.stance && F.time > 0.18 && S.poseB === 'extend') this.setPose('flight', 0.3);

      // Anströmung: lokales Windfeld an der Position des Springers
      const wl = this.windLocalAt(Math.max(S.x, 0));
      const gust = wl.w;
      const w = gust * CONFIG.windAeroFactor;
      const wv = wl.wv * CONFIG.windAeroFactor;
      const rvx = S.vx - w, rvy = S.vy - wv;
      const rv = Math.hypot(rvx, rvy);
      const velAng = Math.atan2(rvy, rvx) / D2R;

      if (!F.stance) {
        // Anstellwinkel-Steuerung: Wischen justiert alpha direkt, Drift + Böen stören.
        // Der Wind schiebt die Fluglage aktiv weg – horizontal UND vertikal:
        // Böen (schnelle Abweichung) reißen kurz, der stetige Wind drückt dauerhaft:
        // Gegenwind/Aufwind hebt die Spitze (alpha steigt), Rücken-/Abwind drückt sie runter.
        const wvNow = wl.wv;
        const push = (gust - this.wind) * CONFIG.gustPitchFactor
                   + (wvNow - this.windV) * CONFIG.gustPitchV
                   + (-gust) * CONFIG.windPitchH
                   + wvNow * CONFIG.windPitchV;
        F.windPush = push;
        S.alphaCtl += inp.swipe * CONFIG.swipeSensitivity
                    + inp.angle * CONFIG.angleSpeed * dt
                    + CONFIG.pitchDrift * dt
                    + push * dt;
        // STUNT: Wischen/Pfeiltasten geben zusätzlich direkten Auf-/Abtrieb –
        // damit kann man den Sägeblättern aktiv ausweichen. Jedes Manöver
        // kostet Tempo, sonst wäre Hochziehen ein Gratis-Weiten-Cheat.
        const boost = inp.swipe * 0.05 + inp.angle * 10 * dt;
        S.vy += boost;
        S.vx -= Math.abs(boost) * 0.6;
        S.alphaCtl = clamp(S.alphaCtl, CONFIG.alphaMin, CONFIG.alphaMax);
        // Haptik: wenn der Wind an der Haltung reißt, vibriert das Handy
        if (F.time > 0.3 && Math.abs(push) > CONFIG.hapticMin) Haptics.gust(Math.abs(push));
        // Der Körper rotiert automatisch mit der steiler werdenden Flugbahn mit
        S.body += clamp(velAng + S.alphaCtl - S.body, -CONFIG.bodyFollowRate * dt, CONFIG.bodyFollowRate * dt);
      } else {
        // Landeposition: Körper richtet sich zum Hang aus, keine Steuerung mehr
        const gAng = Hill.groundAt(Math.max(S.x, 0)).angle;
        S.body += clamp(-gAng - S.body, -90 * dt, 90 * dt);
      }
      S.body = clamp(S.body, CONFIG.bodyMin, CONFIG.bodyMax);

      const alpha = S.body - velAng;                       // Anstellwinkel
      const dNorm = (alpha - CONFIG.optimalAngle) / CONFIG.angleTolerance;
      const liftF = Math.exp(-dNorm * dNorm);              // Gauß-Glocke ums Optimum
      const aPos = Math.max(0, alpha) / 30;
      const dragF = 1 + (CONFIG.dragAngleFactor / CONFIG.dragCoefficient) * aPos * aPos;
      // In der Landeposition bricht der Auftrieb ein – zu früh = Weitenverlust
      const lift = CONFIG.liftCoefficient * rv * rv * liftF * (F.stance ? CONFIG.stanceLift : 1);
      const drag = CONFIG.dragCoefficient * rv * rv * dragF * (F.stance ? CONFIG.stanceDrag : 1);
      const ux = rvx / rv, uy = rvy / rv;
      S.vx += (-drag * ux - lift * uy) * dt;
      S.vy += (-drag * uy + lift * ux - CONFIG.gravity) * dt;
      S.x += S.vx * dt; S.y += S.vy * dt;

      // Sägeblatt erwischt? Comic-Ragdoll statt Zerfetzen.
      for (const o of this.obstacles) {
        if (o.hit) continue;
        if (Math.abs(S.x - o.x) > o.r + 1) continue;
        const oy = this.obstacleY(o);
        if (Math.hypot(S.x - o.x, S.y - oy) < o.r + 0.42) {
          o.hit = true;
          this.hitObstacle(o);
          break;
        }
      }
      if (this.state !== 'FLIGHT') return; // nach Treffer sofort raus

      // Haltungsnote: nur die aktive Flugphase zählt.
      // tv = Gesamtbewegung des Haltungsfehlers – wer ruhig und dosiert
      // ausgleicht, hält tv klein; hektisches Hin- und Herreißen treibt es hoch.
      if (!F.stance) {
        F.time += dt;
        const err = alpha - CONFIG.optimalAngle;
        if (Math.abs(err) <= CONFIG.angleTolerance) F.corridorTime += dt;
        if (F.lastErr !== null) F.tv += Math.abs(err - F.lastErr);
        F.lastErr = err;
      }
      F.alpha = alpha; F.lift = lift; F.drag = drag;

      // Flugspur aufzeichnen
      this.trailT += dt;
      if (this.trailT > 0.05) {
        this.trailT = 0;
        this.trail.push({ x: S.x, y: S.y, t: this.time });
        if (this.trail.length > 90) this.trail.shift();
      }

      // Fläche unter dem Springer: über der Anlaufspur (x<0) die Spur selbst
      const overRamp = S.x < -0.05;
      const surf = overRamp ? Hill.inrunAtX(S.x) : Hill.groundAt(S.x);

      // Restflugzeit-Schätzung (für Tutorial und Debug; die Landung selbst ist
      // rein DSJ-mechanisch: Landeposition per Tap, sonst Sturz)
      if (!overRamp && S.x > 5) {
        const gap = S.y - surf.y;
        const closure = -(S.vy + S.vx * Math.tan(surf.angle * D2R));
        this.landingTap.tta = closure > 0.3 ? gap / closure : 99;
        this.landingTap.windowOpen = this.landingTap.tta < 1.1;
      }

      // Bodenkontakt
      if (S.y <= surf.y && F.time > 0.05) {
        if (overRamp) {
          // zu früh gesprungen und auf der Rampe aufgekommen → Sturz (DSJ-Stil)
          this.crashOnRamp();
        } else if (F.time > 0.1) {
          this.touchdown(surf);
        }
      }
    }

    // ---------- AUSLAUF (läuft hinter dem Ergebnis-Panel weiter) ----------
    else if ((this.state === 'OUTRUN' || this.state === 'RESULT') && this.result) {
      this.outrunTimer += dt;
      if (this.result.crashed) {
        // Ragdoll übernimmt – Kamera folgt der Hüfte
        Ragdoll.step(dt);
        const hip = Ragdoll.pts[0];
        S.x = hip.x; S.y = hip.y;
        S.v = Ragdoll.speed();
        if (S.v > 3 && Math.random() < dt * 35) this.spray(1);
        // STUNT: Die Weite zählt dort, wo die Puppe liegen bleibt –
        // rutschen und purzeln bringt also noch Extrameter!
        if (this.state === 'OUTRUN') {
          this.result.dist = Math.max(this.result.dist,
            Math.round(Hill.groundAt(clamp(S.x, 0, 460)).s * 2) / 2);
          if ((S.v < 0.9 && this.outrunTimer > 1.2) || this.outrunTimer > 8) {
            this.popup = { text: this.result.dist.toFixed(1).replace(".", ",") + " m",
                           x: S.x, y: S.y + 2.5, t0: this.time, crashed: true };
            this.showResult();
          }
        }
      } else {
        // erst ausfahren, dann kräftig in den Schneepflug bremsen und anhalten
        const braking = this.outrunTimer > 1.15;
        const th = Hill.groundAt(S.x).angle * D2R;
        const fric = braking ? CONFIG.brakeFriction : CONFIG.outrunFriction;
        const a = CONFIG.gravity * Math.sin(th) - fric * CONFIG.gravity * Math.cos(th) - 0.002 * S.v * S.v;
        S.v = Math.max(0, S.v + a * dt);
        S.x += S.v * Math.cos(th) * dt;
        if (S.x > 440) S.v = 0;              // Sicherheitsnetz am Kartenrand
        const g2 = Hill.groundAt(S.x);
        S.y = g2.y;
        S.body = -g2.angle;
        // nach dem Telemark aufrichten, dann Bremshaltung, im Stand aufrecht
        if (this.outrunTimer > 1.1 && S.poseB === 'telemark') this.setPose('landed', 0.45);
        if (braking && S.v > 2) {
          if (S.poseB === 'landed') this.setPose('brake', 0.35);
          if (Math.random() < dt * 55) this.spray(1);
        }
        if (S.v < 0.4 && S.poseB !== 'gate') this.setPose('gate', 0.5);
        if (S.v > 6 && Math.random() < dt * 40) this.dust();
        // Ergebnis direkt nach der Landung – wie im echten Skispringen
        if (this.state === 'OUTRUN' && this.outrunTimer > 0.7) this.showResult();
      }
      // Jury-Noten nacheinander einblenden (mit Klick-Sound), dann der Button
      if (this.state === 'RESULT') {
        const shown = clamp(Math.floor((this.outrunTimer - 1.0) / 0.35) + 1, 0, 5);
        if (shown > this.notesShown) { this.notesShown = shown; Sound.click(); }
        if (!this.buttonShown && this.outrunTimer > 3.6) { this.buttonShown = true; show(nextBtn); }
      }
    }

    // Pose-Überblendung fortschreiben
    if (S.poseT < 1) S.poseT = Math.min(1, S.poseT + dt / S.poseDur);

    // Partikel
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy -= 6 * dt; p.life -= dt;
      if (p.life <= 0) this.particles.splice(i, 1);
    }
    // abgelaufene Effekte entfernen
    for (let i = this.fx.length - 1; i >= 0; i--)
      if (this.time - this.fx[i].t0 > 0.6) this.fx.splice(i, 1);
  },

  // Über die Tischkante gleiten (ohne Absprung an der Kante – der Sprung selbst
  // passiert direkt beim Tap, egal wo). lateWindow erlaubt noch einen Luftsprung.
  startFlight() {
    const S = this.skier, T = this.takeoff;
    const ta = -CONFIG.tableAngle * D2R;
    S.x = 0; S.y = 0;
    S.vx = S.v * Math.cos(ta); S.vy = S.v * Math.sin(ta);
    S.body = -CONFIG.tableAngle;   // kontinuierlich zur Tischneigung – kein Winkel-Sprung
    S.alphaCtl = CONFIG.initAlpha + (Math.random() * 2 - 1) * CONFIG.initAlphaSpread;
    this.state = 'FLIGHT';
    // ohne Tap bleibt der Springer sichtbar in der Hocke (lateWindow läuft im Flug)
  },

  applyTakeoffImpulse(q, late) {
    const S = this.skier, ta = CONFIG.tableAngle * D2R;
    const imp = CONFIG.takeoffImpulse * (CONFIG.impulseBase + (1 - CONFIG.impulseBase) * q) * (late ? 0.8 : 1);
    S.vx += imp * Math.sin(ta) * 0.25;
    S.vy += imp * Math.cos(ta);
  },

  rateTakeoff(q, kind) {
    if (kind === 'keiner')      this.showMsg('Absprung verschlafen!', '#ff7a7a');
    else if (q >= 0.93)         this.showMsg('PERFEKTER ABSPRUNG!', '#5cffa8');
    else if (q >= 0.7)          this.showMsg('Guter Absprung', '#b9f6ca');
    else if (kind === 'spät')   this.showMsg('Zu spät!', '#ffb74d');
    else                        this.showMsg('Zu früh!', '#ffb74d');
  },

  touchdown(g) {
    const S = this.skier;
    const th = g.angle * D2R;
    // Aufprallgeschwindigkeit senkrecht zum Hang (Hangnormale n = (sinθ, cosθ))
    const vNormal = -(S.vx * Math.sin(th) + S.vy * Math.cos(th));
    // DSJ-Regel: ohne Landeposition = Sturz; Position rechtzeitig stehen = Telemark
    const F0 = this.flight;
    const stanceDur = F0.stance ? this.time - F0.stanceT : -1;
    let landing, crashed = false, wobble = false, earlyPenalty = 0;
    if (!F0.stance)                                   { landing = 'STURZ!';           crashed = true; }
    else if (stanceDur < CONFIG.stanceCrashTime)      { landing = 'STURZ – zu spät!'; crashed = true; }
    else if (stanceDur < CONFIG.stanceWobbleTime)     { landing = 'Wacklige Landung'; wobble = true; }
    else {
      landing = 'Telemark!';
      // zu früh eingeleitete Landung: sicher, aber die Jury zieht Punkte ab
      // (bewertet nach der Restflugzeit im Moment des Einnehmens)
      const early = (F0.stanceTta || stanceDur) - CONFIG.stanceEarlyTime;
      if (early > 0) earlyPenalty = Math.min(early * CONFIG.earlyNotePenalty, 2.5);
    }
    if (vNormal > CONFIG.crashSpeed)                  { landing = 'STURZ – zu hart!'; crashed = true; }

    const dist = Math.round(g.s * 2) / 2;
    // Weitenpunkte (FIS): 60 am K-Punkt ± meterValue pro Meter
    const distPts = Math.max(0, CONFIG.basePoints + (dist - CONFIG.kPoint) * CONFIG.meterValue);

    // Haltungsnoten (FIS): 5 Wertungsrichter je 0–20 in 0,5er-Schritten,
    // höchste und niedrigste Note gestrichen → maximal 60 Punkte
    const styleFrac = F0.time > 0 ? F0.corridorTime / F0.time : 0;
    // Smoothness: mittlere Fehlerbewegung pro Sekunde. Böen erzeugen ohnehin
    // ein paar Grad/s – erst hektisches Überkorrigieren kostet richtig.
    const tvPerSec = F0.time > 0.3 ? F0.tv / F0.time : 14;
    const smooth = clamp(1 - (tvPerSec - 10) / 25, 0, 1);
    const tq = this.takeoff.quality;                       // Absprung zählt mit
    let base = 13.2 + styleFrac * 2 + smooth * 2.6 + (tq - 0.5) * 3.4;
    if (landing === 'Telemark!') base += 1;
    else if (!crashed) base -= 2;                          // wacklige Landung
    base -= earlyPenalty;                                  // zu früh in die Landeposition
    if (crashed) base = 7.5 + styleFrac * 2.5 + tq * 1.5;  // Sturz
    const notes = [];
    for (let i = 0; i < 5; i++)
      notes.push(clamp(Math.round((base + (Math.random() - 0.5) * 1.4) * 2) / 2, 0, 20));
    const sorted = [...notes].sort((a, b) => a - b);
    const stylePts = sorted[1] + sorted[2] + sorted[3];

    // Windpunkte (FIS-Kompensation): Rückenwind/Abwind wird gutgeschrieben,
    // Gegenwind-/Aufwind-Vorteil abgezogen (vertikal wirkt stärker pro m/s)
    const windEff = this.wind - this.windV * (CONFIG.windStrength / CONFIG.windVertical) * 0.8;
    const windPts = Math.round(windEff * CONFIG.windFactor * 10) / 10;

    const total = Math.max(0, distPts + stylePts + windPts);
    this.result = { dist, distPts, stylePts, windPts, notes, total, landing, crashed, wind: this.wind };
    if (!crashed && dist > this.record) {
      const hadRecord = this.record > 0;
      this.record = dist;
      store.set(this.recordKey, String(dist));
      this.result.isRecord = true;
      if (hadRecord) {
        this.showMsg('SCHANZENREKORD!', '#ffd35c', 2.4);
        this.confetti(); this.confetti();
        Sound.telemark(); Sound.perfect();
      } else {
        this.showMsg('Erste Tagesbestmarke!', '#5cffa8', 1.8);
        this.confetti();
      }
    }
    if (!crashed && (!this.best || total > this.best.total)) {
      this.best = { dist, total };
      store.set('alpenflug_stunt_best', JSON.stringify(this.best));
    }

    // Weiten-Popup in der Welt
    this.popup = { text: dist.toFixed(1).replace('.', ',') + ' m', x: S.x, y: S.y + 2.5, t0: this.time, crashed };

    this.state = 'OUTRUN';
    this.outrunTimer = 0;
    S.crash = crashed;
    if (crashed) {
      Ragdoll.start(S);          // echter Ragdoll-Sturz
      S.y = g.y;
      cam.shake = 1.2;
      this.showMsg('STURZ!', '#ff5252', 1.8);
      Sound.crash();
    } else {
      const vTang = S.vx * Math.cos(th) - S.vy * Math.sin(th);
      S.v = Math.max(3, vTang);
      S.y = g.y;
      this.setPose(landing === 'Telemark!' ? 'telemark' : 'landed', 0.15);
      if (wobble) cam.shake = 0.55;
      this.showMsg(landing, landing === 'Telemark!' ? '#5cffa8' : '#ffb74d', 1.4);
      if (landing === 'Telemark!') Sound.telemark(); else Sound.landOk();
    }
    this.spray(crashed ? 40 : 18);
  },

  // aktuelle Höhe eines Hindernisses (Schweber pendeln auf und ab)
  obstacleY(o) {
    const g = Hill.groundAt(o.x);
    return g.y + o.h + (o.float ? Math.sin(this.time * o.bobSpd + o.phase) * o.bob : 0);
  },

  // Kollision mit einem Sägeblatt: Abpraller + Ragdoll (FlatOut-Style, unblutig)
  hitObstacle(o) {
    const S = this.skier;
    const notes = [4.5, 5, 4.5, 5.5, 5].map(n => n + Math.round(Math.random() * 2) * 0.5);
    const sorted = [...notes].sort((a, b) => a - b);
    const g = Hill.groundAt(S.x);
    const dist = Math.round(g.s * 2) / 2;
    this.result = { dist, distPts: 0, stylePts: sorted[1] + sorted[2] + sorted[3], windPts: 0,
                    notes, total: 0, landing: 'Vom Sägeblatt erwischt!', crashed: true, wind: this.wind };
    // kein Popup hier – die Weite zählt erst dort, wo die Ragdoll-Puppe liegen bleibt
    S.vx *= 0.35;
    S.vy = Math.max(S.vy, 2.5);
    this.state = 'OUTRUN';
    this.outrunTimer = 0;
    S.crash = true;
    Ragdoll.start(S);
    cam.shake = 1.4;
    this.showMsg('GETROFFEN!', '#ff5252', 1.6);
    Sound.crash();
    this.spray(24);
  },

  // Sturz durch Aufkommen auf der Anlaufspur (zu früher Sprung)
  crashOnRamp() {
    const S = this.skier;
    // gleiches Format wie bei touchdown(), sonst stolpert das Ergebnis-Board
    const notes = [4.5, 5, 4.5, 5.5, 5].map(n => n + Math.round(Math.random() * 2) * 0.5);
    const sorted = [...notes].sort((a, b) => a - b);
    const stylePts = sorted[1] + sorted[2] + sorted[3];
    this.result = { dist: 0, distPts: 0, stylePts, windPts: 0, notes, total: 0,
                    landing: 'Sturz im Anlauf', crashed: true, wind: this.wind };
    this.popup = null;
    this.state = 'OUTRUN';
    this.outrunTimer = 0;
    S.crash = true;
    Ragdoll.start(S);
    cam.shake = 1.2;
    this.showMsg('STURZ!', '#ff5252', 1.6);
    Sound.crash();
    this.spray(28);
  },

  spray(n) {
    const S = this.skier;
    for (let i = 0; i < n; i++)
      this.particles.push({
        x: S.x, y: S.y + 0.2, life: 0.4 + Math.random() * 0.5,
        vx: -2 - Math.random() * 5, vy: 1 + Math.random() * 4,
      });
  },

  dust() {
    const S = this.skier;
    this.particles.push({
      x: S.x - 0.8, y: S.y + 0.1, life: 0.25 + Math.random() * 0.2,
      vx: -1 - Math.random() * 2, vy: 0.5 + Math.random() * 1.5,
    });
  },

  // Ergebnis läuft live auf dem Canvas unter dem Springer (kein Popup):
  // Noten erscheinen nacheinander, dann Punkte + Platzierung, dann der Button.
  showResult() {
    this.state = 'RESULT';
    Tutorial.finish();
    const r = this.result;
    this.roundTotals[this.round - 1] = r.total;
    r.rank = this.placement();
    // Streichresultate markieren (höchste + niedrigste Note)
    if (!Array.isArray(r.notes) || r.notes.length !== 5) r.notes = [5, 5, 5, 5, 5];
    const min = Math.min(...r.notes), max = Math.max(...r.notes);
    r.dropA = r.notes.indexOf(min);
    r.dropB = r.notes.lastIndexOf(max);
    if (r.dropA === r.dropB) r.dropB = (r.dropA + 1) % 5;
    if (this.round === 2) {
      r.sum = (this.roundTotals[0] || 0) + r.total;
      if (r.sum > this.bestComp) {
        this.bestComp = r.sum;
        store.set('alpenflug_stunt_best_comp', String(r.sum));
        r.record = true;
      }
    }
    this.notesShown = 0;
    this.buttonShown = false;
    nextBtn.textContent = this.mode === 'train' ? 'Nächster Sprung'
      : this.round === 1 ? '2. Durchgang'
      : (r.rank <= 3 ? 'Zur Siegerehrung' : 'Neuer Wettkampf');
    // Konfetti aus dem Publikum bei Sprüngen über Hillsize
    if (!r.crashed && r.dist >= CONFIG.hillSize) this.confetti();
  },

  confetti() {
    const S = this.skier;
    for (let i = 0; i < 60; i++)
      this.particles.push({
        x: S.x + (Math.random() - 0.5) * 8, y: S.y + 1 + Math.random() * 4,
        vx: (Math.random() - 0.5) * 7, vy: 2 + Math.random() * 6,
        life: 1.2 + Math.random() * 0.9,
        color: CROWD_COLORS[i % CROWD_COLORS.length],
      });
  },

  // Weiter nach dem Ergebnis: Durchgang 2, neuer Wettkampf oder Trainingssprung
  advance() {
    if (this.mode === 'train') {
      if (!this.theme) this.newCompetition();
    } else if (this.state === 'RESULT' && this.round === 1 && this.roundTotals[0] != null) {
      this.round = 2;
    } else {
      this.newCompetition();
    }
    this.newJump();
  },
};
