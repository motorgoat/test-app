// Richtung des Windvektors (horizontal + vertikal) als Text, 8 Sektoren
function windLabel(w, wv) {
  const mag = Math.hypot(w, wv);
  if (mag < 0.15) return 'windstill';
  const names = ['Rückenwind', 'Rücken-/Aufwind', 'Aufwind', 'Gegen-/Aufwind',
                 'Gegenwind', 'Gegen-/Abwind', 'Abwind', 'Rücken-/Abwind'];
  // Winkel 0 = Rückenwind (+x), 90° = Aufwind; vertikal auf gleiche Skala normiert
  const a = Math.atan2(wv / CONFIG.windVertical, w / CONFIG.windStrength);
  const sec = ((Math.round(a / (Math.PI / 4)) % 8) + 8) % 8;
  return `${mag.toFixed(1).replace('.', ',')} m/s ${names[sec]}`;
}

// ------------------------------------------------------------------ Render
// Zwei Ebenen: Welt in niedriger Auflösung (Pixel-Look), HUD scharf darüber.
// Alle Zeichenfunktionen nutzen die globale `ctx`, die pro Phase umgeschaltet wird.
const canvas = document.getElementById('game');
const wctx = canvas.getContext('2d');
const hudCanvas = document.getElementById('hud');
const hctx = hudCanvas.getContext('2d');
let ctx = wctx;
let W = 0, H = 0, DPR = 1, vignette = null;

// Farbwelten: Tag und Abendlicht (pro Wettkampf ausgelost)
const THEMES = {
  day: {
    skyTop: '#2a6cb8', skyMid: '#5b9fda', skyLow: '#d4ecfb',
    sun: '#ffe9a8', halo: '255,244,200',
    ridge1: '#a8c4dd', ridge2: '#7fa3c4', ridge3: '#597e9f', forest: '#37536e',
    snowBody: '#d9e8f6', snowShade: '#c3d9ee', band: '#fdfeff',
    cloudTop: '#ffffff', cloudBot: '#b9d9f2',
  },
  dusk: {
    skyTop: '#2b2f6e', skyMid: '#8a5f9e', skyLow: '#f7b26e',
    sun: '#ffcf7d', halo: '255,190,120',
    ridge1: '#bb9db6', ridge2: '#8d7398', ridge3: '#5f5378', forest: '#3a3355',
    snowBody: '#e5dbee', snowShade: '#d1c4e0', band: '#fbf5fb',
    cloudTop: '#ffe9d9', cloudBot: '#d8a98f',
  },
};
const TH = () => Game.theme || THEMES.day;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2); // Cap 2: volle Schärfe, halbe Füllrate
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  wctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  hudCanvas.width = Math.round(W * DPR);
  hudCanvas.height = Math.round(H * DPR);
  hctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  vignette = hctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.45, W / 2, H / 2, Math.max(W, H) * 0.75);
  vignette.addColorStop(0, 'rgba(8,20,36,0)');
  vignette.addColorStop(1, 'rgba(8,20,36,0.30)');
}
window.addEventListener('resize', resize);
resize();

// Kamera: Weltkoordinaten (m) → Bildschirm (CSS-px)
const cam = { x: -55, y: 22, ppm: 14 };
function worldToScreen(wx, wy) {
  return { x: (wx - cam.x - (cam.ox || 0)) * cam.ppm + W * 0.5,
           y: H * 0.46 - (wy - cam.y - (cam.oy || 0)) * cam.ppm };
}

function updateCamera(dt) {
  const S = Game.skier;
  let vw, tx, ty;
  if (Game.state === 'MENU' || Game.state === 'GATE') {
    vw = CONFIG.camGateView; tx = S.x + 5; ty = S.y - 2;
  } else if (Game.state === 'INRUN') {
    vw = CONFIG.camInrunView; tx = S.x + 10; ty = S.y - 4;
  } else if (Game.state === 'FLIGHT') {
    const surfY = S.x < 0 ? Hill.inrunAtX(S.x).y : Hill.groundAt(S.x).y;
    const hAbove = S.y - surfY;
    vw = clamp(hAbove * 1.05 + 14, CONFIG.camFlightMin, CONFIG.camFlightMax);
    tx = S.x + S.vx * 0.34; ty = S.y - hAbove * 0.42;
  } else {
    vw = CONFIG.camOutrunView; tx = S.x + 5; ty = S.y + 2;
  }
  const targetPpm = Math.min(W / vw, H / (vw * 0.82));
  cam.ppm = damp(cam.ppm, targetPpm, 3, dt);
  cam.x = damp(cam.x, tx, 5.5, dt);
  cam.y = damp(cam.y, ty, 5.5, dt);
  // Sturz-Shake klingt aus
  cam.shake = Math.max(0, (cam.shake || 0) - dt * 1.4);
  const sm = cam.shake * cam.shake * 0.4;
  cam.ox = Math.sin(Game.time * 43) * sm;
  cam.oy = Math.cos(Game.time * 53) * sm * 0.7;
}

// --- Hintergrund: Himmel, Sonne, Wolken, Parallax-Bergketten mit Wald ---
// Fester Parallax-Pixelfaktor (px pro Weltmeter): entkoppelt den Hintergrund vom
// Kamera-Zoom, sonst "schwimmen" die Berge bei jeder Zoomänderung.
const PAR_PX = 7;
function ridgeY(x, seed) {
  return Math.sin(x * 0.011 + seed) * 14 + Math.sin(x * 0.031 + seed * 2.3) * 6 + Math.sin(x * 0.005 + seed * 0.7) * 20;
}
// Himmelsverlauf cachen (Neubau nur bei Resize/Themenwechsel – Performance)
let skyCache = { grad: null, h: 0, theme: null };
function drawBackground() {
  const T = TH();
  if (!skyCache.grad || skyCache.h !== H || skyCache.theme !== T) {
    const g = wctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, T.skyTop); g.addColorStop(0.5, T.skyMid); g.addColorStop(1, T.skyLow);
    skyCache = { grad: g, h: H, theme: T };
  }
  ctx.fillStyle = skyCache.grad; ctx.fillRect(0, 0, W, H);

  // Flat-Sonne: Kern + zwei flache Halo-Ringe
  const sx = W * 0.76, sy = H * 0.15, sr = Math.min(W, H) * 0.055;
  ctx.fillStyle = `rgba(${T.halo},0.10)`;
  ctx.beginPath(); ctx.arc(sx, sy, sr * 2.6, 0, 7); ctx.fill();
  ctx.fillStyle = `rgba(${T.halo},0.16)`;
  ctx.beginPath(); ctx.arc(sx, sy, sr * 1.7, 0, 7); ctx.fill();
  ctx.fillStyle = T.sun;
  ctx.beginPath(); ctx.arc(sx, sy, sr, 0, 7); ctx.fill();

  // Vögel: kleine animierte Schwingen-Silhouetten
  ctx.strokeStyle = 'rgba(20,45,70,0.55)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  for (const b of [[0.2, 0.20, 0], [0.28, 0.24, 2.1], [0.62, 0.12, 4.2]]) {
    const bx = ((b[0] * W + Game.time * 9 - cam.x * PAR_PX * 0.05) % (W + 80) + W + 80) % (W + 80) - 40;
    const by = b[1] * H + Math.sin(Game.time * 0.8 + b[2]) * 6;
    const flap = Math.abs(Math.sin(Game.time * 5 + b[2])) * 4 + 1;
    ctx.beginPath();
    ctx.moveTo(bx - 6, by - flap * 0.5);
    ctx.quadraticCurveTo(bx, by + flap * 0.5, bx, by);
    ctx.quadraticCurveTo(bx, by + flap * 0.5, bx + 6, by - flap * 0.5);
    ctx.stroke();
  }

  // Flat-Wolken: weiße Oberseite + hellblaue flache Unterseite
  for (const c of [[0.14, 0.16, 1.3], [0.48, 0.10, 0.9], [0.85, 0.26, 1.1], [0.32, 0.32, 0.7]]) {
    const cx = ((c[0] * W - cam.x * PAR_PX * 0.06) % (W + 300) + W + 300) % (W + 300) - 150;
    const cy = c[1] * H, cw = c[2] * clamp(Math.min(W, H) / 400, 0.95, 1.6);
    const r1 = 20 * cw, r2 = 15 * cw, r3 = 12 * cw;
    // Unterseite (flacher Schattenton)
    ctx.fillStyle = T.cloudBot;
    ctx.beginPath();
    ctx.ellipse(cx, cy + 5 * cw, 48 * cw, 9 * cw, 0, 0, 7);
    ctx.fill();
    // Oberseite aus runden Kuppen
    ctx.fillStyle = T.cloudTop;
    ctx.beginPath();
    ctx.arc(cx - 22 * cw, cy, r3, 0, 7);
    ctx.arc(cx - 4 * cw, cy - 8 * cw, r1, 0, 7);
    ctx.arc(cx + 18 * cw, cy - 2 * cw, r2, 0, 7);
    ctx.rect(cx - 30 * cw, cy - 1 * cw, 58 * cw, 7 * cw);
    ctx.fill();
  }

  // drei Bergketten: hinten hell/dunstig, vorn kräftiger + Waldsilhouette
  const layers = [
    { par: 0.06, base: 0.38, color: T.ridge1, seed: 3 },
    { par: 0.14, base: 0.47, color: T.ridge2, seed: 8 },
    { par: 0.26, base: 0.58, color: T.ridge3, seed: 13 },
  ];
  for (const l of layers) {
    ctx.fillStyle = l.color;
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let px = 0; px <= W; px += 10) {
      const wx = px + cam.x * PAR_PX * l.par;
      ctx.lineTo(px, H * l.base - ridgeY(wx, l.seed) - cam.y * PAR_PX * l.par * 0.3);
    }
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
  }
  // Waldband auf der vordersten Kette – Zacken als stetige Dreieckswelle in
  // WELT-Koordinaten (screen-quantisierte Zacken flackern bei Kamerafahrt)
  const l = layers[2];
  ctx.fillStyle = T.forest;
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let px = 0; px <= W; px += 4) {
    const wx = px + cam.x * PAR_PX * l.par;
    const baseY = H * l.base - ridgeY(wx, l.seed) - cam.y * PAR_PX * l.par * 0.3 + 14;
    const tooth = Math.abs(((wx % 13) + 13) % 13 - 6.5) / 6.5;          // 0..1 Dreieckswelle
    const spikeH = 5 + (Math.sin(wx * 0.23) * 0.5 + 0.5) * 9;           // Baumhöhe variiert
    ctx.lineTo(px, baseY - tooth * spikeH);
  }
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();

  drawSnowfall();
}

// Leiser Schneefall über der ganzen Szene
const FLAKES = [];
for (let i = 0; i < 42; i++)
  FLAKES.push({ x: Math.random(), y: Math.random(), s: 0.4 + Math.random() * 0.8, r: 1 + Math.random() * 1.6 });
function drawSnowfall() {
  ctx.fillStyle = 'rgba(255,255,255,0.65)';
  const drift = Game.wind * 14;
  for (const f of FLAKES) {
    const x = ((f.x * W + Game.time * (drift + 6) * f.s - cam.x * PAR_PX * 0.12) % (W + 16) + W + 16) % (W + 16) - 8;
    const y = ((f.y * H + Game.time * 26 * f.s) % (H + 16) + H + 16) % (H + 16) - 8;
    ctx.beginPath(); ctx.arc(x, y, f.r, 0, 7); ctx.fill();
  }
}

// 2.5D: Tiefenversatz der Schneeoberfläche (Weltmeter, nach hinten-oben)
const DEPTH = { x: 1.85, y: 1.08 };
// Der Springer (und alles, was zu ihm gehört) wird MITTIG AUF dem
// Oberflächenband gerendert – sonst wirkt es, als lande er vor der Piste.
const REN = { x: 0.8, y: 0.47 };
const renToScreen = (wx, wy) => worldToScreen(wx + REN.x, wy + REN.y);

function drawHill() {
  // Sichtbaren Profilbereich bestimmen – nur dieser wird gezeichnet (Performance)
  const xLo = cam.x - (W * 0.5 + 80) / cam.ppm;
  const xHi = cam.x + (W * 0.5 + 80) / cam.ppm;
  // WICHTIG: i0/i1 auf GERADE Indizes einrasten. Die Schleifen zeichnen jeden
  // 2. Punkt – wechselt die Parität beim Scrollen, springt das ganze Band
  // zwischen zwei Vertex-Sätzen hin und her ("Zucken" nach dem Tisch).
  const i0 = clamp(Math.floor(xLo / 0.5), 0, Hill.prof.length - 4) & ~1;
  const i1 = Math.min((clamp(Math.ceil(xHi / 0.5) + 2, i0 + 2, Hill.prof.length - 1)) & ~1 || (i0 + 2), Hill.prof.length - 1 - ((Hill.prof.length - 1) & 1));
  const P = Hill.prof;
  if (xHi > 0) {
  // --- Aufsprunghang: Schneekörper (Querschnitt) ---
  const first = worldToScreen(P[i0].x, P[i0].y);
  const last = worldToScreen(P[i1].x, P[i1].y);
  ctx.beginPath();
  ctx.moveTo(first.x, first.y);
  for (let i = i0; i <= i1; i += 2) { const s = worldToScreen(P[i].x, P[i].y); ctx.lineTo(s.x, s.y); }
  ctx.lineTo(last.x, H + 60); ctx.lineTo(first.x, H + 60); ctx.closePath();
  ctx.fillStyle = TH().snowBody; ctx.fill();   // flacher Schneekörper
  // flacher Schattenstreifen direkt unter der Oberflächenkante
  ctx.beginPath();
  ctx.moveTo(first.x, first.y);
  for (let i = i0; i <= i1; i += 2) { const s = worldToScreen(P[i].x, P[i].y); ctx.lineTo(s.x, s.y); }
  for (let i = i1; i >= i0; i -= 2) {
    const s = worldToScreen(P[i].x, P[i].y - 1.4);
    ctx.lineTo(s.x, s.y);
  }
  ctx.closePath();
  ctx.fillStyle = TH().snowShade; ctx.fill();

  // --- 2.5D-Oberflächenband: helle Schneefläche zwischen Nah- und Fernkante ---
  ctx.beginPath();
  ctx.moveTo(first.x, first.y);
  for (let i = i0; i <= i1; i += 2) { const s = worldToScreen(P[i].x, P[i].y); ctx.lineTo(s.x, s.y); }
  for (let i = i1; i >= i0; i -= 2) {
    const s = worldToScreen(P[i].x + DEPTH.x, P[i].y + DEPTH.y);
    ctx.lineTo(s.x, s.y);
  }
  ctx.closePath();
  ctx.fillStyle = TH().band; ctx.fill();
  // Fernkante fein, Nahkante kräftig
  ctx.strokeStyle = 'rgba(160,195,225,0.8)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = i0; i <= i1; i += 2) { const s = worldToScreen(P[i].x + DEPTH.x, P[i].y + DEPTH.y); ctx.lineTo(s.x, s.y); }
  ctx.stroke();
  ctx.strokeStyle = 'rgba(120,160,200,0.75)'; ctx.lineWidth = 1.8;
  ctx.beginPath();
  for (let i = i0; i <= i1; i += 2) { const s = worldToScreen(P[i].x, P[i].y); ctx.lineTo(s.x, s.y); }
  ctx.stroke();
  }

  // Weitenmarken: Linien liegen quer AUF der Schneefläche
  // (die Beschriftungen zeichnet drawHillLabels() scharf aufs HUD)
  for (let d = 40; d <= 440; d += 40) {
    const x = Hill.xAtDistance(d);
    if (x < xLo - 3 || x > xHi + 3) continue;
    const g = Hill.groundAt(x);
    const a = worldToScreen(x, g.y);
    const b = worldToScreen(x + DEPTH.x, g.y + DEPTH.y);
    const isK = d === CONFIG.kPoint, isHS = d === CONFIG.hillSize;
    ctx.strokeStyle = isK ? '#ff3d55' : isHS ? '#35d0ff' : 'rgba(110,140,170,0.5)';
    ctx.lineWidth = isK || isHS ? Math.max(2.5, cam.ppm * 0.18) : Math.max(1.2, cam.ppm * 0.08);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }

  // Rekordlinie (grün gestrichelt quer über die Fläche)
  if (Game.record > 0) {
    const rx = Hill.xAtDistance(Game.record);
    if (rx > xLo - 3 && rx < xHi + 3) {
      const g = Hill.groundAt(rx);
      const a = worldToScreen(rx, g.y);
      const b = worldToScreen(rx + DEPTH.x, g.y + DEPTH.y);
      ctx.strokeStyle = '#2ecc71'; ctx.lineWidth = Math.max(2, cam.ppm * 0.14);
      ctx.setLineDash([6, 5]);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // --- Anlaufturm: schlanke Stahl-Optik mit Akzentlinie ---
  const ir = Hill.inrun;
  if (xLo > 2) return; // Anlauf ist links außerhalb des Bildes
  const top = worldToScreen(ir[0].x, ir[0].y);
  const edge = worldToScreen(0, 0);
  // Deckband unter der Spur (1,8 m stark), darunter Stützpfeiler
  ctx.fillStyle = '#16283c';
  ctx.beginPath();
  ctx.moveTo(top.x, top.y);
  for (const p of ir) { const s = worldToScreen(p.x, p.y); ctx.lineTo(s.x, s.y); }
  for (let i = ir.length - 1; i >= 0; i -= 4) {
    const s = worldToScreen(ir[i].x, ir[i].y - 1.8);
    ctx.lineTo(s.x, s.y);
  }
  ctx.closePath(); ctx.fill();
  // Stützpfeiler
  ctx.strokeStyle = '#16283c'; ctx.lineWidth = Math.max(3, cam.ppm * 0.5);
  for (const fs of [0.12, 0.4, 0.68, 0.92]) {
    const p = ir[Math.floor(ir.length * fs)];
    const s0 = worldToScreen(p.x, p.y - 1.5);
    ctx.beginPath(); ctx.moveTo(s0.x, s0.y); ctx.lineTo(s0.x, Math.min(H + 20, s0.y + 60 * cam.ppm)); ctx.stroke();
  }
  // Akzentlinie an der Unterkante des Deckbands
  ctx.strokeStyle = '#35d0ff'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (const p of ir) { const s = worldToScreen(p.x, p.y - 1.8); ctx.lineTo(s.x, s.y); }
  ctx.stroke();
  // Anlaufspur als 2.5D-Band mit Mittelrille
  const IR_DEPTH = { x: 1.35, y: 0.79 }; // breit genug, dass die Ski AUF der Bahn stehen
  ctx.beginPath();
  ctx.moveTo(worldToScreen(ir[0].x, ir[0].y).x, worldToScreen(ir[0].x, ir[0].y).y);
  for (const p of ir) { const s = worldToScreen(p.x, p.y); ctx.lineTo(s.x, s.y); }
  for (let i = ir.length - 1; i >= 0; i -= 2) {
    const s = worldToScreen(ir[i].x + IR_DEPTH.x, ir[i].y + IR_DEPTH.y);
    ctx.lineTo(s.x, s.y);
  }
  ctx.closePath();
  ctx.fillStyle = '#f4f9fd'; ctx.fill();
  ctx.strokeStyle = 'rgba(120,160,200,0.7)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (const p of ir) { const s = worldToScreen(p.x, p.y); ctx.lineTo(s.x, s.y); }
  ctx.stroke();
  ctx.strokeStyle = 'rgba(150,185,215,0.7)'; ctx.lineWidth = Math.max(1, cam.ppm * 0.05);
  ctx.beginPath();
  for (const p of ir) { const s = worldToScreen(p.x + IR_DEPTH.x * 0.5, p.y + IR_DEPTH.y * 0.5); ctx.lineTo(s.x, s.y); }
  ctx.stroke();
  drawStartBar('back');
  // Tischkante: rote Linie quer über die Spur + Markierung nach unten
  const e2 = worldToScreen(IR_DEPTH.x, IR_DEPTH.y);
  ctx.strokeStyle = '#ff3d55'; ctx.lineWidth = Math.max(3, cam.ppm * 0.2);
  ctx.beginPath();
  ctx.moveTo(edge.x, edge.y); ctx.lineTo(e2.x, e2.y);
  ctx.moveTo(edge.x, edge.y); ctx.lineTo(edge.x, edge.y + cam.ppm * 1.1);
  ctx.stroke();
}

// --- Startbank in zwei Ebenen: Pfosten HINTER dem Springer, Sitzfläche als
// vordere Schiene NACH dem Springer gezeichnet – so liegen die Ski sichtbar
// hinter der Bank und nichts ragt durch.
function drawStartBar(stage) {
  const gpos = Hill.inrunAt(CONFIG.gateOffset);
  const th = gpos.angle * D2R;
  const p = renToScreen(gpos.x + 0.06, gpos.y + 0.54);
  ctx.save();
  ctx.translate(p.x, p.y); ctx.rotate(th);
  const bw = 0.46 * cam.ppm;
  if (stage === 'back') {
    // Pfosten + Sitzfläche (hinter dem Springer)
    ctx.fillStyle = '#3a5470';
    ctx.fillRect(-bw * 0.55, 0, bw, 0.85 * cam.ppm);
    ctx.strokeStyle = '#12212f'; ctx.lineWidth = Math.max(1, cam.ppm * 0.045);
    ctx.strokeRect(-bw * 0.55, 0, bw, 0.85 * cam.ppm);
    const sw = bw * 1.5;
    ctx.fillStyle = '#ff3d55';
    ctx.fillRect(-sw * 0.55, -0.12 * cam.ppm, sw, 0.15 * cam.ppm);
    ctx.strokeRect(-sw * 0.55, -0.12 * cam.ppm, sw, 0.15 * cam.ppm);
  } else {
    // untere Pfostenhälfte NACH dem Springer: verdeckt das Ski-Heck,
    // das die Bank kreuzt – die Ski liegen damit sichtbar HINTER der Bank
    ctx.fillStyle = '#3a5470';
    ctx.fillRect(-bw * 0.55, 0.38 * cam.ppm, bw, 0.47 * cam.ppm);
    ctx.strokeStyle = '#12212f'; ctx.lineWidth = Math.max(1, cam.ppm * 0.045);
    ctx.strokeRect(-bw * 0.55, 0.38 * cam.ppm, bw, 0.47 * cam.ppm);
  }
  ctx.restore();
}

// --- Weitenbeschriftungen (scharf auf dem HUD-Canvas) ---
function drawHillLabels() {
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  for (let d = 40; d <= 440; d += 40) {
    const isK = d === CONFIG.kPoint, isHS = d === CONFIG.hillSize;
    if (cam.ppm <= 5 && !isK && !isHS) continue;
    const x = Hill.xAtDistance(d);
    const g = Hill.groundAt(x);
    const b = worldToScreen(x + DEPTH.x, g.y + DEPTH.y);
    if (b.x < -60 || b.x > W + 60 || b.y < -30 || b.y > H + 30) continue;
    ctx.fillStyle = isK ? '#ff3d55' : isHS ? '#35d0ff' : 'rgba(70,100,130,0.8)';
    ctx.font = `${isK || isHS ? '800' : '600'} ${Math.max(10, cam.ppm * 1.05)}px system-ui`;
    ctx.fillText(isK ? 'K ' + d : isHS ? 'HS ' + d : d, b.x + 5, b.y - 3);
  }
  // Rekord-Label
  if (Game.record > 0) {
    const rx = Hill.xAtDistance(Game.record);
    const g = Hill.groundAt(rx);
    const b = worldToScreen(rx + DEPTH.x, g.y + DEPTH.y);
    if (b.x > -80 && b.x < W + 80 && b.y > -30 && b.y < H + 30) {
      ctx.fillStyle = '#2ecc71';
      ctx.font = `800 ${Math.max(10, cam.ppm * 0.95)}px system-ui`;
      ctx.fillText('Rekord ' + Game.record.toFixed(1).replace('.', ','), b.x + 5, b.y - 3);
    }
  }
}

// --- Deko: Bäume, Publikum und Fahnen machen die Szene lebendig ---
const TREE_XS = [114, 123, 131, 142, 154, 167, 181, 196];
function drawTrees() {
  for (let i = 0; i < TREE_XS.length; i++) {
    const tx = TREE_XS[i];
    const g = Hill.groundAt(tx);
    const p = worldToScreen(tx + DEPTH.x, g.y + DEPTH.y);
    if (p.x < -60 || p.x > W + 60) continue;
    const h = (3 + (i % 3)) * cam.ppm;          // Baumhöhe 3–5 m
    ctx.fillStyle = '#5b4232';
    ctx.fillRect(p.x - cam.ppm * 0.08, p.y - h * 0.18, cam.ppm * 0.16, h * 0.2);
    ctx.fillStyle = i % 2 ? '#1e4d3b' : '#265c46';
    for (let l = 0; l < 3; l++) {                // drei gestapelte Nadel-Ebenen
      const ly = p.y - h * (0.15 + l * 0.28);
      const lw = h * (0.42 - l * 0.11);
      ctx.beginPath();
      ctx.moveTo(p.x, ly - h * 0.34);
      ctx.lineTo(p.x - lw, ly);
      ctx.lineTo(p.x + lw, ly);
      ctx.closePath(); ctx.fill();
    }
    // Schneehaube
    ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = Math.max(1.5, cam.ppm * 0.1);
    ctx.beginPath();
    ctx.moveTo(p.x - h * 0.12, p.y - h * 0.92);
    ctx.lineTo(p.x, p.y - h * 1.02);
    ctx.lineTo(p.x + h * 0.12, p.y - h * 0.92);
    ctx.stroke();
  }
}

// Kampfrichterturm + Starthäuschen: flache, detailreiche Bauten
function drawBuildings() {
  // --- Kampfrichterturm neben dem Aufsprunghang (x ≈ 68) ---
  {
    const g = Hill.groundAt(68);
    const p = worldToScreen(68 + DEPTH.x * 1.2, g.y + DEPTH.y * 1.2);
    if (p.x > -80 && p.x < W + 80) {
      const u = cam.ppm;
      // Stelzen
      ctx.strokeStyle = '#26374a'; ctx.lineWidth = Math.max(2, u * 0.16);
      ctx.beginPath();
      ctx.moveTo(p.x - u * 1.0, p.y); ctx.lineTo(p.x - u * 1.0, p.y - u * 2.6);
      ctx.moveTo(p.x + u * 1.0, p.y); ctx.lineTo(p.x + u * 1.0, p.y - u * 2.6);
      ctx.stroke();
      // Kanzel (zwei Etagen, flat)
      ctx.fillStyle = '#31445c';
      ctx.fillRect(p.x - u * 1.5, p.y - u * 5.6, u * 3, u * 3.1);
      ctx.fillStyle = '#26374a';
      ctx.fillRect(p.x - u * 1.5, p.y - u * 4.1, u * 3, u * 0.25);
      // Fenster (Richterkabinen)
      ctx.fillStyle = '#9fd8ff';
      for (let i = 0; i < 3; i++)
        ctx.fillRect(p.x - u * 1.2 + i * u * 1.0, p.y - u * 5.25, u * 0.75, u * 0.8);
      ctx.fillRect(p.x - u * 1.2, p.y - u * 3.8, u * 2.65, u * 0.7);
      // Dach + Antenne + Fahne
      ctx.fillStyle = '#1d2c3d';
      ctx.fillRect(p.x - u * 1.7, p.y - u * 5.95, u * 3.4, u * 0.4);
      ctx.strokeStyle = '#1d2c3d'; ctx.lineWidth = Math.max(1.5, u * 0.08);
      ctx.beginPath(); ctx.moveTo(p.x + u * 1.3, p.y - u * 5.95); ctx.lineTo(p.x + u * 1.3, p.y - u * 7.2); ctx.stroke();
      const flap = Math.sin(Game.time * 5) * u * 0.12;
      ctx.fillStyle = '#ff3d55';
      ctx.beginPath();
      ctx.moveTo(p.x + u * 1.3, p.y - u * 7.2);
      ctx.lineTo(p.x + u * 2.1, p.y - u * 7.0 + flap);
      ctx.lineTo(p.x + u * 1.3, p.y - u * 6.75);

  // --- Starthäuschen am Anlauf-Beginn ---
  {

    const p = worldToScreen(top.x - 0.4, top.y);
    if (p.x > -80 && p.x < W + 80) {

      ctx.fillStyle = '#31445c';
      ctx.fillRect(p.x - u * 2.4, p.y - u * 2.6, u * 2.4, u * 2.6);

      ctx.fillRect(p.x - u * 1.9, p.y - u * 2.1, u * 1.1, u * 0.9);

const CROWD_COLORS = ['#e94f64', '#3aa0e8', '#f2b134', '#7bc96f', '#b087e8', '#ff8a5c'];
function drawCrowd() {
  if (cam.ppm < 3.2) return;
  const comp = Game.mode === 'comp';
  // Jubel: nach einem gestandenen Sprung hüpfen die Fans und schwenken Fahnen
  const cheer = (Game.state === 'OUTRUN' || Game.state === 'RESULT') && Game.result && !Game.result.crashed;
  const X0 = 355, X1 = 435, BD = 1.02; // Banden-Tiefe (nahe Seite des Auslaufs)

  // --- Werbebanden entlang des Auslaufs ---
  const top = [], bot = [];
  for (let x = X0; x <= X1; x += 2.6) {
    const g = Hill.groundAt(x);
    top.push(worldToScreen(x + DEPTH.x * BD, g.y + DEPTH.y * BD + 0.95));
    bot.push(worldToScreen(x + DEPTH.x * BD, g.y + DEPTH.y * BD - 0.05));
  }
  if (top[top.length - 1].x > -40 && top[0].x < W + 40) {
    ctx.beginPath();
    ctx.moveTo(top[0].x, top[0].y);
    for (const p of top) ctx.lineTo(p.x, p.y);
    for (let i = bot.length - 1; i >= 0; i--) ctx.lineTo(bot[i].x, bot[i].y);
    ctx.closePath();
    ctx.fillStyle = '#f2f7fb'; ctx.fill();
    ctx.strokeStyle = '#22354a'; ctx.lineWidth = Math.max(1, cam.ppm * 0.05); ctx.stroke();
    // Schriftzug auf der Bande, dem Gelände folgend
    ctx.fillStyle = '#2b6cb8';
    ctx.font = `900 ${Math.max(6, cam.ppm * 0.52)}px system-ui`;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    for (let x = X0 + 2; x < X1 - 6; x += 12) {
      const g0 = Hill.groundAt(x), g1 = Hill.groundAt(x + 3);
      const a = worldToScreen(x + DEPTH.x * BD, g0.y + DEPTH.y * BD + 0.45);
      const b = worldToScreen(x + 3 + DEPTH.x * BD, g1.y + DEPTH.y * BD + 0.45);
      if (a.x < -80 || a.x > W + 20) continue;
      ctx.save();
      ctx.translate(a.x, a.y);
      ctx.rotate(Math.atan2(b.y - a.y, b.x - a.x));
      ctx.fillText('ALPENFLUG K90', 0, 0);
      ctx.restore();
    }
  }

  // --- Fans: Reihen VOR der Bande (Rücken zur Kamera), unten im Auslauf ---
  const fan = (px, py, seed, r) => {
    const n = CROWD_COLORS.length;
    const jacket = CROWD_COLORS[Math.floor(seed * 7.31) % n];
    const hat = CROWD_COLORS[(Math.floor(seed * 3.77) + 3) % n];
    const ph = seed * 2.7;
    const bob = cheer
      ? Math.abs(Math.sin(Game.time * 7.5 + ph)) * r * 0.55
      : Math.sin(Game.time * 2.4 + ph) * r * 0.07;
    const hy = py - bob;
    // Arme: beim Jubel hoch und winkend
    if (cheer) {
      const wig = Math.sin(Game.time * 9 + ph) * r * 0.25;
      ctx.strokeStyle = jacket; ctx.lineWidth = r * 0.26; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(px - r * 0.5, hy - r * 1.15);
      ctx.lineTo(px - r * 0.95 + wig, hy - r * 1.95);
      ctx.moveTo(px + r * 0.5, hy - r * 1.15);
      ctx.lineTo(px + r * 0.95 + wig, hy - r * 1.95);
      ctx.stroke();
    }
    // Körper (Jacke)
    ctx.fillStyle = jacket;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(px - r * 0.62, hy - r * 1.42, r * 1.24, r * 1.5, r * 0.45)
                  : ctx.rect(px - r * 0.62, hy - r * 1.42, r * 1.24, r * 1.5);
    ctx.fill();
    ctx.strokeStyle = 'rgba(18,33,47,0.5)'; ctx.lineWidth = Math.max(0.8, r * 0.07); ctx.stroke();
    // Kopf + Mütze mit Bommel
    ctx.fillStyle = '#f5d7c0';
    ctx.beginPath(); ctx.arc(px, hy - r * 1.72, r * 0.4, 0, 7); ctx.fill();
    ctx.fillStyle = hat;
    ctx.beginPath(); ctx.arc(px, hy - r * 1.78, r * 0.41, Math.PI, 0); ctx.fill();
    ctx.beginPath(); ctx.arc(px, hy - r * 2.2, r * 0.15, 0, 7); ctx.fill();
    // Fähnchen bei manchen Fans
    if (Math.floor(seed * 5.13) % 4 === 0) {
      const wave = Math.sin(Game.time * (cheer ? 9 : 3.5) + ph) * r * 0.3;
      ctx.strokeStyle = 'rgba(40,60,80,0.85)'; ctx.lineWidth = Math.max(0.8, r * 0.07);
      ctx.beginPath(); ctx.moveTo(px + r * 0.55, hy - r * 1.4); ctx.lineTo(px + r * 0.85 + wave, hy - r * 2.6); ctx.stroke();
      ctx.fillStyle = CROWD_COLORS[(Math.floor(seed * 9.1) + 1) % n];
      ctx.beginPath();
      ctx.moveTo(px + r * 0.85 + wave, hy - r * 2.6);
      ctx.lineTo(px + r * 1.75 + wave, hy - r * 2.35);
      ctx.lineTo(px + r * 0.85 + wave, hy - r * 2.1);
      ctx.closePath(); ctx.fill();
    }
  };

  // hintere Reihe (näher an der Bande), im Wettkampf zusätzlich vordere Reihe
  for (let x = X0 + 1.2; x <= X1 - 1; x += 1.55) {
    const g = Hill.groundAt(x);
    const p = worldToScreen(x + DEPTH.x * 1.32, g.y + DEPTH.y * 1.32 + 0.15);
    if (p.x < -25 || p.x > W + 25) continue;
    fan(p.x, p.y, x, cam.ppm * 0.32);
  }
  if (comp) {
    for (let x = X0 + 2.0, k = 0; x <= X1 - 1; x += 1.8, k++) {
      const g = Hill.groundAt(x);
      const p = worldToScreen(x + DEPTH.x * 1.62, g.y + DEPTH.y * 1.62 + 0.15);
      if (p.x < -25 || p.x > W + 25) continue;
      fan(p.x, p.y, x * 1.71, cam.ppm * 0.37);
    }
  }
}

// --- Sägeblätter: rotierende Scheibe mit Zähnen, auf Mast oder schwebend ---
function drawObstacles() {
  for (const o of Game.obstacles) {
    const g = Hill.groundAt(o.x);
    const oy = Game.obstacleY(o);
    const p = renToScreen(o.x, oy);
    const rr = o.r * cam.ppm;
    if (p.x < -rr - 40 || p.x > W + rr + 40) continue;
    if (!o.float) {
      const b = renToScreen(o.x, g.y);
      ctx.strokeStyle = '#22354a'; ctx.lineWidth = Math.max(2, cam.ppm * 0.14);
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(Game.time * o.spin + o.phase);
    ctx.fillStyle = '#8fa0b0';
    const teeth = 10;
    ctx.beginPath();
    for (let i = 0; i < teeth; i++) {
      const a0 = (i / teeth) * Math.PI * 2, a1 = a0 + 0.28, am = a0 + 0.14;
      ctx.moveTo(Math.cos(a0) * rr * 0.86, Math.sin(a0) * rr * 0.86);
      ctx.lineTo(Math.cos(am) * rr * 1.06, Math.sin(am) * rr * 1.06);
      ctx.lineTo(Math.cos(a1) * rr * 0.86, Math.sin(a1) * rr * 0.86);
    }
    ctx.fill();
    ctx.beginPath(); ctx.arc(0, 0, rr * 0.88, 0, 7);
    ctx.fillStyle = '#c3cfda'; ctx.fill();
    ctx.strokeStyle = '#12212f'; ctx.lineWidth = Math.max(1.5, cam.ppm * 0.06); ctx.stroke();
    ctx.strokeStyle = 'rgba(70,90,110,0.55)'; ctx.lineWidth = Math.max(1.5, rr * 0.09);
    for (let i = 0; i < 3; i++) {
      const a = i * Math.PI * 2 / 3;
      ctx.beginPath(); ctx.arc(0, 0, rr * 0.52, a, a + 0.9); ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(0, 0, rr * 0.2, 0, 7);
    ctx.fillStyle = '#ff3d55'; ctx.fill();
    ctx.strokeStyle = '#12212f'; ctx.lineWidth = Math.max(1, cam.ppm * 0.045); ctx.stroke();
    ctx.restore();
  }
}

function drawFlag(x, color) {
  const g = Hill.groundAt(x);
  const p = worldToScreen(x + DEPTH.x, g.y + DEPTH.y);
  if (p.x < -40 || p.x > W + 40) return;
  const h = cam.ppm * 2.2;
  ctx.strokeStyle = '#37474f'; ctx.lineWidth = Math.max(1.5, cam.ppm * 0.07);
  ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x, p.y - h); ctx.stroke();
  const flap = Math.sin(Game.time * 5 + x) * cam.ppm * 0.15;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(p.x, p.y - h);
  ctx.lineTo(p.x + cam.ppm * 0.95, p.y - h + cam.ppm * 0.28 + flap);
  ctx.lineTo(p.x, p.y - h + cam.ppm * 0.55);
  ctx.closePath(); ctx.fill();
}

// --- Flugspur: verblassende Punkte hinter dem Springer ---
function drawTrail() {
  for (const t of Game.trail) {
    const age = Game.time - t.t;
    if (age > 1.5) continue;
    const p = renToScreen(t.x, t.y);
    ctx.globalAlpha = (1 - age / 1.5) * 0.3;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(1.2, cam.ppm * 0.07), 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// --- Schatten: senkrechte Projektion auf den Hang (Lande-Orientierung!) ---
function drawShadow() {
  const S = Game.skier;
  // Im Flug UND beim Ragdoll-Sturz: Schatten senkrecht auf die Fläche projizieren
  // (sonst klebt der Kontaktschatten am trudelnden Körper)
  if (Game.state === 'FLIGHT' || S.crash) {
    const g = S.x < 0 ? Hill.inrunAtX(S.x) : Hill.groundAt(S.x);
    const h = clamp(S.y - g.y, 0, 40);
    const fade = clamp(1 - h / 34, 0.18, 1);
    // exakt senkrecht unter dem Springer: der Abstand Springer↔Schatten
    // schließt sich genau beim Aufsetzen – das ist das Lande-Timing-Signal
    const p = renToScreen(S.x, g.y + 0.05);
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(g.angle * D2R);
    ctx.scale(cam.ppm, cam.ppm);
    ctx.fillStyle = `rgba(35,60,95,${(0.34 * fade + 0.04).toFixed(3)})`;
    ctx.beginPath();
    ctx.ellipse(0, 0, 0.5 + 0.85 * fade, 0.13 + 0.1 * fade, 0, 0, 7);
    ctx.fill();
    ctx.restore();
  } else if (Game.state !== 'MENU') {
    // Kontaktschatten unter den Skiern
    const p = renToScreen(S.x, S.y);
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(-S.body * D2R);
    ctx.scale(cam.ppm, cam.ppm);
    ctx.fillStyle = 'rgba(35,60,95,0.3)';
    ctx.beginPath();
    ctx.ellipse(0.1, 0.18, 1.15, 0.16, 0, 0, 7);
    ctx.fill();
    ctx.restore();
  }
}

// --- Landepunkt-Vorhersage: Flugbahn mit aktueller Lage vorausrechnen ---
function predictLanding() {
  if (Game.state !== 'FLIGHT') return null;
  const S = Game.skier;
  let x = S.x, y = S.y, vx = S.vx, vy = S.vy;
  const alpha = S.alphaCtl; // Annahme: aktueller Anstellwinkel wird gehalten
  const dt = 1 / 40;
  for (let t = 0; t < 9; t += dt) {
    const wl = Game.windLocalAt(Math.max(x, 0));
    const w = wl.w * CONFIG.windAeroFactor, wv = wl.wv * CONFIG.windAeroFactor;
    const rvx = vx - w, rvy = vy - wv;
    const rv = Math.hypot(rvx, rvy);
    const dNorm = (alpha - CONFIG.optimalAngle) / CONFIG.angleTolerance;
    const liftF = Math.exp(-dNorm * dNorm);
    const aPos = Math.max(0, alpha) / 30;
    const dragF = 1 + (CONFIG.dragAngleFactor / CONFIG.dragCoefficient) * aPos * aPos;
    const st = Game.flight.stance;
    const lift = CONFIG.liftCoefficient * rv * rv * liftF * (st ? CONFIG.stanceLift : 1);
    const drag = CONFIG.dragCoefficient * rv * rv * dragF * (st ? CONFIG.stanceDrag : 1);
    const ux = rvx / rv, uy = rvy / rv;
    vx += (-drag * ux - lift * uy) * dt;
    vy += (-drag * uy + lift * ux - CONFIG.gravity) * dt;
    x += vx * dt; y += vy * dt;
    const g = Hill.groundAt(x);
    if (y <= g.y) return { x, s: g.s };
  }
  return null;
}

function drawPrediction() {
  if (Game.skier.x < 0) return; // während des Hüpfers über der Spur nicht sinnvoll
  const pred = predictLanding();
  if (!pred) return;
  const g = Hill.groundAt(pred.x);
  const a = worldToScreen(pred.x, g.y);
  const b = worldToScreen(pred.x + DEPTH.x, g.y + DEPTH.y);
  const pulse = 0.55 + Math.sin(Game.time * 7) * 0.3;
  // Landepunkt noch außerhalb des Bildes → Pfeil am Bildrand mit Meterangabe
  if (a.x > W - 20) {
    const ey = clamp(a.y, H * 0.2, H * 0.9);
    ctx.globalAlpha = pulse;
    ctx.fillStyle = '#35d0ff';
    ctx.beginPath();
    ctx.moveTo(W - 10, ey);
    ctx.lineTo(W - 30, ey - 11);
    ctx.lineTo(W - 30, ey + 11);
    ctx.closePath(); ctx.fill();
    ctx.font = '800 13px system-ui';
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText(`${pred.s.toFixed(0)} m`, W - 36, ey);
    ctx.globalAlpha = 1;
    return;
  }
  // Linie quer über die Schneefläche
  ctx.globalAlpha = pulse;
  ctx.strokeStyle = '#35d0ff';
  ctx.lineWidth = Math.max(2, cam.ppm * 0.14);
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  // Chevron darüber
  const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
  const ch = Math.max(6, cam.ppm * 0.5);
  ctx.fillStyle = '#35d0ff';
  ctx.beginPath();
  ctx.moveTo(cx, cy - ch * 0.6);
  ctx.lineTo(cx - ch * 0.55, cy - ch * 1.5);
  ctx.lineTo(cx + ch * 0.55, cy - ch * 1.5);
  ctx.closePath(); ctx.fill();
  // voraussichtliche Weite, solange die Landung nicht unmittelbar bevorsteht
  if (Game.landingTap.tta > 0.6) {
    ctx.font = `800 ${Math.max(11, cam.ppm * 0.9)}px system-ui`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(`${pred.s.toFixed(0)} m`, cx, cy - ch * 1.9);
  }
  ctx.globalAlpha = 1;
}

  },
  extend: {
    legF: [0.05, -0.08, 0.18, -0.3, 0.32, -0.58], legB: [0.05, -0.08, 0.18, -0.3, 0.32, -0.58],
    torso: [0.32, -0.58, 0.9, -0.76],
    arm1: [0.72, -0.7, 0.1, -0.48], arm2: [0.7, -0.68, 0.08, -0.46],
    head: [1.05, -0.83], skiV: 0.3, gaze: 4,
  },
  flight: { // tief gebeugter V-Stil: Hüfte oben, Brust und Kopf tauchen weit
    // nach vorn-unten – fast zwischen die aufgebogenen Skispitzen
    legF: [0.06, -0.1, 0.32, -0.28, 0.55, -0.42], legB: [0.06, -0.1, 0.32, -0.28, 0.55, -0.42],
    torso: [0.55, -0.42, 1.12, -0.28],
    arm1: [0.85, -0.32, 0.2, -0.15], arm2: [0.83, -0.29, 0.18, -0.12],
    head: [1.3, -0.22], skiV: 1, gaze: 16,
  },
  telemark: { // Ausfallschritt: vorderer Ski deutlich vor, hinterer zurück
    legF: [0.42, 0, 0.46, -0.36, 0.08, -0.58], legB: [-0.5, 0, -0.32, -0.26, 0.08, -0.58],
    torso: [0.08, -0.58, 0.14, -1.08],
    arm1: [0.12, -1.0, 0.58, -0.82], arm2: [0.12, -1.0, -0.4, -0.86],
    head: [0.17, -1.27], skiV: 0, skiSplit: 1, gaze: 4,
  },
  landed: {
    legF: [0.08, 0, 0.0, -0.35, 0.02, -0.6], legB: [0.08, 0, 0.0, -0.35, 0.02, -0.6],
    torso: [0.02, -0.6, 0.16, -1.05],
    arm1: [0.14, -1.0, 0.5, -0.72], arm2: [0.14, -1.0, -0.2, -0.75],
    head: [0.22, -1.25], skiV: 0, gaze: 2,
  },
  brake: { // Schneepflug: tief, Arme vor dem Körper, leicht zurückgelehnt
    legF: [0.18, 0, 0.28, -0.28, -0.08, -0.5], legB: [-0.12, 0, 0.0, -0.26, -0.08, -0.5],
    torso: [-0.08, -0.5, 0.12, -0.92],
    arm1: [0.1, -0.86, 0.48, -0.62], arm2: [0.08, -0.84, 0.4, -0.58],
    head: [0.2, -1.1], skiV: 0, gaze: 6,
  },
};
const mixArr = (a, b, t) => a.map((v, i) => lerp(v, b[i], t));

function drawSkier() {
  const S = Game.skier;
  if (S.crash && Ragdoll.active) { drawRagdoll(); return; }
  const p = renToScreen(S.x, S.y);

  // Speedlines im Flug
  if (Game.state === 'FLIGHT') {
    const v = Math.hypot(S.vx, S.vy);
    if (v > 18) {
      ctx.strokeStyle = 'rgba(255,255,255,0.16)'; ctx.lineWidth = 2;
      const ux = S.vx / v, uy = S.vy / v;
      for (const o of [-0.9, 0.2, 1.1]) {
        const ox = p.x - uy * o * cam.ppm, oy = p.y - ux * o * cam.ppm;
        ctx.beginPath();
        ctx.moveTo(ox - ux * cam.ppm * 1.6, oy + uy * cam.ppm * 1.6);
        ctx.lineTo(ox - ux * cam.ppm * 3.4, oy + uy * cam.ppm * 3.4);
        ctx.stroke();
      }
    }
  }

  // Turbulenz-Zittern: außerhalb des Winkel-Korridors flattert die Figur –
  // das ERSETZT den Regler als Feedback für die Fluglage.
  let jitter = 0;
  if (Game.state === 'FLIGHT' && !Game.flight.stance && Game.flight.time > 0.3) {
    const dev = Math.abs(S.alphaCtl - CONFIG.optimalAngle) / CONFIG.angleTolerance;
    if (dev > 1) jitter = Math.min(dev - 1, 1.6) * 2.2 * Math.sin(Game.time * 34);
    // Wind-Rütteln: Böen, die an der Haltung reißen, schütteln die Figur sichtbar
    const push = Math.abs(Game.flight.windPush || 0);
    if (push > CONFIG.windShakeMin) {
      jitter += Math.min((push - CONFIG.windShakeMin) / 6, 1) * 1.7 * Math.sin(Game.time * 47);
    }
  }

  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(-(S.body + jitter) * D2R);
  ctx.scale(cam.ppm * 1.24, cam.ppm * 1.24); // Figur deutlich größer (Shop-Details!)
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  const O = OUTFIT;
  const SUIT = O.suit, SUIT_D = O.suitDark, LEGS = O.legs,
        SKI = O.ski, SKI_D = O.skiDark, OUT = '#12212f';
  // Konisch zulaufende, gefüllte Kapsel mit Kontur – ergibt echte
  // Körperformen statt Strichfigur (Oberschenkel dicker als Knöchel usw.)
  const capsule = (x1, y1, x2, y2, w1, w2, color) => {
    const a = Math.atan2(y2 - y1, x2 - x1);
    ctx.beginPath();
    ctx.arc(x1, y1, w1, a + Math.PI / 2, a - Math.PI / 2);
    ctx.arc(x2, y2, w2, a - Math.PI / 2, a + Math.PI / 2);
    ctx.closePath();
    ctx.fillStyle = color; ctx.fill();
    ctx.strokeStyle = OUT; ctx.lineWidth = 0.05; ctx.stroke();
  };
  const head = (hx, hy, gz) => {
    // Aero-Helm: laengliche Form mit Nase in Blickrichtung, Visier, Kinn
    ctx.save(); ctx.translate(hx, hy); ctx.rotate((gz || 0) * D2R);
    ctx.beginPath();
    ctx.moveTo(-0.16, 0.1);
    ctx.quadraticCurveTo(-0.27, 0.02, -0.22, -0.1);
    ctx.quadraticCurveTo(-0.14, -0.23, 0.05, -0.225);
    ctx.quadraticCurveTo(0.24, -0.22, 0.295, -0.05);   // lange Aero-Kuppel
    ctx.quadraticCurveTo(0.3, 0.04, 0.2, 0.07);
    ctx.quadraticCurveTo(0.02, 0.12, -0.16, 0.1);
    ctx.closePath();
    ctx.fillStyle = O.helmet; ctx.fill();
    ctx.strokeStyle = OUT; ctx.lineWidth = 0.05; ctx.stroke();
    // Visier
    ctx.beginPath();
    ctx.moveTo(0.06, -0.1);
    ctx.quadraticCurveTo(0.25, -0.12, 0.27, -0.02);
    ctx.quadraticCurveTo(0.2, 0.05, 0.08, 0.04);
    ctx.closePath();
    ctx.fillStyle = O.visor; ctx.fill();
    ctx.strokeStyle = 'rgba(18,33,47,0.45)'; ctx.lineWidth = 0.025; ctx.stroke();
    // Kinn/Gesicht unter dem Visier
    ctx.fillStyle = '#f5d7c0';
    ctx.beginPath(); ctx.arc(0.1, 0.085, 0.05, 0, 7); ctx.fill();
    // Helmstreifen (Shop-Slot)
    ctx.strokeStyle = O.helmetStripe; ctx.lineWidth = 0.05;
    ctx.beginPath(); ctx.moveTo(-0.17, -0.06); ctx.quadraticCurveTo(0.0, -0.19, 0.17, -0.15); ctx.stroke();
    ctx.restore();
  };
  const ski = (yOff, tipUp, color, xOff = 0) => { // Bindung hinter der Mitte, Fuß etwas weiter vorn
    const ty = yOff - tipUp * 0.42;
    ctx.beginPath();
    ctx.moveTo(-0.97 + xOff, yOff);
    ctx.lineTo(1.56 + xOff, ty);
    ctx.quadraticCurveTo(1.8 + xOff, ty - 0.02, 1.9 + xOff, ty - 0.17);
    ctx.strokeStyle = OUT; ctx.lineWidth = 0.21; ctx.stroke();
    ctx.strokeStyle = color; ctx.lineWidth = 0.14; ctx.stroke();
    // farbige Skispitze (Shop-Slot O.skiTip)
    ctx.beginPath();
    ctx.moveTo(1.45 + xOff, ty + 0.005);
    ctx.quadraticCurveTo(1.8 + xOff, ty - 0.02, 1.9 + xOff, ty - 0.17);
    ctx.strokeStyle = O.skiTip; ctx.lineWidth = 0.13; ctx.stroke();
    // feiner Belagstreifen
    ctx.beginPath();
    ctx.moveTo(-0.9 + xOff, yOff + 0.015);
    ctx.lineTo(1.4 + xOff, ty + 0.015);
    ctx.strokeStyle = 'rgba(18,33,47,0.28)'; ctx.lineWidth = 0.028; ctx.stroke();
  };
  const boot = (bx, by, dark = false) => {
    // Bindung unter dem Schuh
    ctx.fillStyle = O.binding;
    ctx.fillRect(bx - 0.14, by - 0.035, 0.36, 0.05);
    // Schuhkoerper
    ctx.fillStyle = dark ? '#142434' : O.boots;
    ctx.strokeStyle = OUT; ctx.lineWidth = 0.04;
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(bx - 0.11, by - 0.16, 0.3, 0.17, 0.045) : ctx.rect(bx - 0.11, by - 0.16, 0.3, 0.17);
    ctx.fill(); ctx.stroke();
    // Schnallen (Shop-Slot O.bootClasp)
    ctx.strokeStyle = O.bootClasp; ctx.lineWidth = 0.028;
    ctx.beginPath();
    ctx.moveTo(bx - 0.04, by - 0.13); ctx.lineTo(bx + 0.1, by - 0.115);
    ctx.moveTo(bx - 0.05, by - 0.07); ctx.lineTo(bx + 0.11, by - 0.055);
    ctx.stroke();
  };

  {
    // Ease-out für knackige Streckung beim Absprung
    const t = 1 - Math.pow(1 - S.poseT, 3);
    const A = POSES[S.poseA], B = POSES[S.poseB];
    const legF = mixArr(A.legF, B.legF, t), legB = mixArr(A.legB, B.legB, t);
    const torso = mixArr(A.torso, B.torso, t);
    const arm1 = mixArr(A.arm1, B.arm1, t), arm2 = mixArr(A.arm2, B.arm2, t);
    const hd = mixArr(A.head, B.head, t);
    let skiV = lerp(A.skiV, B.skiV, t);
    const gaze = lerp(A.gaze || 0, B.gaze || 0, t);
    const split = lerp(A.skiSplit || 0, B.skiSplit || 0, t);

    // Haltungs-Morph: die Figur zeigt den Anstellwinkel deutlich –
    // hoher alpha = aufgerichtet + Ski-V weit offen, niedriger = flacher Vorwärtsdruck
    if (Game.state === 'FLIGHT' && S.poseB === 'flight') {
      const dev = clamp((S.alphaCtl - CONFIG.optimalAngle) / 10, -1, 1) * t;
      torso[3] -= dev * 0.38;
      hd[1] -= dev * 0.46; hd[0] -= Math.max(0, dev) * 0.26;
      arm1[1] -= dev * 0.28; arm2[1] -= dev * 0.26;
      legF[5] -= dev * 0.16; legB[5] -= dev * 0.16;
      skiV = clamp(skiV + dev * 0.9, -0.3, 1.8);
    }

    ski(0.12, skiV * 0.07, SKI_D, -split * 0.34); // hinterer Ski zurück
    ski(0.0, skiV * 0.32, SKI, split * 0.52);     // vorderer Ski nach vorn
    boot(legB[0] - split * 0.3 + 0.02, 0.11, true); // hinterer Schuh (dunkler)
    boot(legF[0] + split * 0.4 + 0.02, 0.0);        // vorderer Schuh
    // hinteres Bein (dunkler, wirkt weiter weg): Knöchel→Knie→Hüfte
    capsule(legB[0], legB[1] - 0.04, legB[2], legB[3], 0.075, 0.09, '#182a3d');
    capsule(legB[2], legB[3], legB[4], legB[5], 0.09, 0.115, '#182a3d');
    // vorderes Bein
    capsule(legF[0], legF[1] - 0.04, legF[2], legF[3], 0.08, 0.10, LEGS);
    capsule(legF[2], legF[3], legF[4], legF[5], 0.10, 0.125, LEGS);
    // hinterer Arm + Handschuh
    capsule(arm2[0], arm2[1], arm2[2], arm2[3], 0.065, 0.055, SUIT_D);
    ctx.fillStyle = O.gloves;
    ctx.beginPath(); ctx.arc(arm2[2], arm2[3], 0.07, 0, 7); ctx.fill();
    // Torso: an der Brust breiter als an der Hüfte
    capsule(torso[0], torso[1], torso[2], torso[3], 0.115, 0.15, SUIT);
    // Anzug-Akzent: dunkleres Panel über der Hüftpartie
    capsule(torso[0], torso[1],
            lerp(torso[0], torso[2], 0.42), lerp(torso[1], torso[3], 0.42),
            0.1, 0.12, SUIT_D);
    // Zierstreifen (Shop-Slot O.trim) längs über den Rücken
    ctx.globalAlpha = 0.75;
    ctx.strokeStyle = O.trim; ctx.lineWidth = 0.045;
    ctx.beginPath();
    ctx.moveTo(lerp(torso[0], torso[2], 0.1), lerp(torso[1], torso[3], 0.1) - 0.1);
    ctx.quadraticCurveTo(lerp(torso[0], torso[2], 0.55), lerp(torso[1], torso[3], 0.55) - 0.16,
                         lerp(torso[0], torso[2], 0.95), lerp(torso[1], torso[3], 0.95) - 0.12);
    ctx.stroke();
    ctx.globalAlpha = 1;
    // vorderer Arm + Handschuh
    capsule(arm1[0], arm1[1], arm1[2], arm1[3], 0.07, 0.06, SUIT_D);
    ctx.fillStyle = O.gloves;
    ctx.beginPath(); ctx.arc(arm1[2], arm1[3], 0.08, 0, 7); ctx.fill();
    head(hd[0], hd[1], gaze);
  }
  ctx.restore();
}

// --- Ragdoll zeichnen (ersetzt die Figur bei Stürzen) ---
function drawRagdoll() {
  const P = Ragdoll.pts, K = Ragdoll.skiPts;
  const w2s = p => renToScreen(p.x, p.y);
  const OUT = '#12212f';
  const line = (a, b, color, w) => { // mit dunkler Kontur wie das Spielermodell
    const A = w2s(a), B = w2s(b);
    ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y);
    ctx.strokeStyle = OUT; ctx.lineWidth = Math.max(3, (w + 0.07) * cam.ppm); ctx.stroke();
    ctx.strokeStyle = color; ctx.lineWidth = Math.max(2, w * cam.ppm); ctx.stroke();
  };
  ctx.lineCap = 'round';
  // Ski (frei fliegend)
  line(K[0], K[1], OUTFIT.ski, 0.14);
  line(K[2], K[3], OUTFIT.skiDark, 0.14);
  // Beine, Torso, Arm
  line(P[0], P[3], OUTFIT.legs, 0.17);
  line(P[0], P[4], OUTFIT.legs, 0.15);
  line(P[0], P[1], OUTFIT.suit, 0.25);
  line(P[1], P[5], OUTFIT.suitDark, 0.11);
  // Schuhe an den Füßen
  ctx.fillStyle = OUT;
  for (const f of [P[3], P[4]]) {
    const b = w2s(f);
    ctx.beginPath(); ctx.arc(b.x, b.y, Math.max(2.5, 0.11 * cam.ppm), 0, 7); ctx.fill();
  }
  // Helm mit Visier
  const h = w2s(P[2]);
  const r = Math.max(3, 0.2 * cam.ppm * 1.12);
  ctx.fillStyle = OUTFIT.helmet;
  ctx.beginPath(); ctx.arc(h.x, h.y, r, 0, 7); ctx.fill();
  ctx.strokeStyle = OUT; ctx.lineWidth = Math.max(1.5, 0.05 * cam.ppm); ctx.stroke();
  ctx.fillStyle = OUTFIT.visor;
  ctx.beginPath(); ctx.arc(h.x + r * 0.35, h.y, r * 0.45, -0.9, 0.9); ctx.fill();
}

// --- Effektringe (Absprung) ---
function drawFX() {
  for (const f of Game.fx) {
    const age = Game.time - f.t0;
    if (age < 0 || age > 0.6) continue;
    const p = renToScreen(f.x, f.y);
    ctx.globalAlpha = (1 - age / 0.6) * 0.9;
    ctx.strokeStyle = f.color;
    ctx.lineWidth = 3.5 * (1 - age / 0.6) + 1;
    ctx.beginPath();
    ctx.arc(p.x, p.y, (0.5 + age * 9) * cam.ppm, 0, 7);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawParticles() {
  for (const p of Game.particles) {
    const s = renToScreen(p.x, p.y);
    ctx.globalAlpha = clamp(p.life * 2, 0, 0.85);
    ctx.fillStyle = p.color || '#ffffff';
    ctx.beginPath(); ctx.arc(s.x, s.y, Math.max(1.5, cam.ppm * 0.11), 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// --- HUD ---
function pillRect(x, y, w, h) {
  ctx.fillStyle = 'rgba(10,22,38,0.6)';
  roundRect(x, y, w, h, h / 2);
  ctx.strokeStyle = 'rgba(160,220,255,0.28)'; ctx.lineWidth = 1;
  ctx.stroke();
}

function drawHUD() {
  const S = Game.skier;
  const ui = clamp(Math.min(W, H) / 370, 0.95, 1.6);
  const pad = 14 * ui, ph = 30 * ui;

  // --- Wind-Pill (oben links): frei rotierender Pfeil + Wert ---
  // Der Pfeil zeigt die Richtung der Luftbewegung im Kreis:
  // ← Gegenwind, → Rückenwind, ↑ Aufwind, ↓ Abwind und alle Zwischenlagen.
  const wl = Game.windLocalAt(Game.state === 'FLIGHT' ? Math.max(Game.skier.x, 0) : 0);
  const w = wl.w, wv = wl.wv;
  const wmag = Math.hypot(w, wv);
  const windW = 186 * ui;
  pillRect(pad, pad, windW, ph);
  // Farbe nach Nutzen: Gegenwind/Aufwind hilft (grün), Rücken-/Abwind schadet (rot)
  const help = -w / CONFIG.windStrength + wv / CONFIG.windVertical;
  const windCol = wmag < 0.15 ? '#9fb8cc' : (help > 0.12 ? '#5cffa8' : help < -0.12 ? '#ff7a7a' : '#ffd35c');
  const ax = pad + 18 * ui, ay = pad + ph / 2;
  // Bildschirm: +x rechts (Rückenwind), +y unten → Aufwind zeigt nach oben
  const wa = Math.atan2(-(wv / CONFIG.windVertical), w / CONFIG.windStrength);
  const alen = (5 + Math.min(wmag / CONFIG.windStrength, 1.2) * 8) * ui;
  ctx.save();
  ctx.translate(ax, ay); ctx.rotate(wa);
  ctx.strokeStyle = windCol; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-alen, 0); ctx.lineTo(alen, 0);
  ctx.moveTo(alen - 5 * ui, -4 * ui); ctx.lineTo(alen, 0); ctx.lineTo(alen - 5 * ui, 4 * ui);
  ctx.stroke();
  ctx.restore();
  ctx.fillStyle = '#fff';
  ctx.font = `700 ${13 * ui}px system-ui`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(windLabel(w, wv), ax + 16 * ui, ay + 0.5);

  // --- Windampel am Start: 3 Messpunkte, damit man auf guten Wind warten kann ---
  if (Game.state === 'GATE') {
    const rows = [['Absprung', 0], ['Hang', 1], ['Aufsprung', 2]];
    const py = pad + ph + 6 * ui, rw = 186 * ui, rh = 20 * ui;
    pillRect(pad, py, rw, rows.length * rh + 10 * ui);
    ctx.font = `600 ${10.5 * ui}px system-ui`;
    ctx.textBaseline = 'middle';
    rows.forEach(([name, k], i) => {
      const yy = py + 5 * ui + rh * i + rh / 2;
      const s = Game.windAtPoint(k);
      const mag = Math.hypot(s.w, s.wv);
      const hlp = -s.w / CONFIG.windStrength + s.wv / CONFIG.windVertical;
      const col = mag < 0.15 ? '#9fb8cc' : (hlp > 0.12 ? '#5cffa8' : hlp < -0.12 ? '#ff7a7a' : '#ffd35c');
      ctx.fillStyle = '#7ea8c9'; ctx.textAlign = 'left';
      ctx.fillText(name, pad + 10 * ui, yy);
      // rotierender Pfeil
      const axx = pad + 92 * ui;
      const ang = Math.atan2(-(s.wv / CONFIG.windVertical), s.w / CONFIG.windStrength);
      const al = (4 + Math.min(mag / CONFIG.windStrength, 1.2) * 6) * ui;
      ctx.save(); ctx.translate(axx, yy); ctx.rotate(ang);
      ctx.strokeStyle = col; ctx.lineWidth = 2 * ui; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-al, 0); ctx.lineTo(al, 0);
      ctx.moveTo(al - 3.5 * ui, -3 * ui); ctx.lineTo(al, 0); ctx.lineTo(al - 3.5 * ui, 3 * ui);
      ctx.stroke(); ctx.restore();
      ctx.fillStyle = col; ctx.textAlign = 'right';
      ctx.fillText(`${mag.toFixed(1).replace('.', ',')} m/s`, pad + rw - 10 * ui, yy);
    });
    // Startuhr: Ampel-Lampe + 10-Sekunden-Fenster (FIS-Regel)
    const cy2 = py + rows.length * rh + 10 * ui + 6 * ui;
    const tGreen = Game.gateTimer - CONFIG.gateGreenDelay;
    const left = CONFIG.startWindow - Math.max(0, tGreen);
    const on = tGreen > 0, urgent = on && left < 3;
    pillRect(pad, cy2, 118 * ui, 24 * ui);
    const lampCol = !on ? '#ff5252' : urgent ? '#ffd35c' : '#5cffa8';
    if (!urgent || Math.sin(Game.time * 10) > 0) {
      ctx.fillStyle = lampCol;
      ctx.beginPath(); ctx.arc(pad + 14 * ui, cy2 + 12 * ui, 5 * ui, 0, 7); ctx.fill();
    }
    ctx.fillStyle = '#fff';
    ctx.font = `700 ${12 * ui}px system-ui`;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(on ? `Start: ${Math.max(0, left).toFixed(1).replace('.', ',')} s` : 'Gleich Grün…', pad + 26 * ui, cy2 + 12 * ui + 0.5);
  }

  // --- Tempo-Pill (zweite Zeile links – kollidiert nie mit der Best-Pill) ---
  if (Game.state === 'INRUN' || Game.state === 'FLIGHT' || Game.state === 'OUTRUN') {
    const spd = Game.state === 'FLIGHT' ? Math.hypot(S.vx, S.vy) : S.v;
    const px = pad, pw = 86 * ui, py = pad + ph + 6 * ui;
    pillRect(px, py, pw, 24 * ui);
    ctx.fillStyle = '#9be8ff';
    ctx.font = `800 ${12 * ui}px system-ui`;
    ctx.textAlign = 'center';
    ctx.fillText(`${(spd * 3.6).toFixed(0)} km/h`, px + pw / 2, py + 12 * ui + 0.5);
  }

  // --- Best-Pill (oben rechts) + Durchgangs-Anzeige darunter ---
  if (Game.best) {
    const bw = 112 * ui;
    pillRect(W - bw - pad, pad, bw, ph);
    ctx.fillStyle = '#ffd35c';
    ctx.font = `700 ${13 * ui}px system-ui`;
    ctx.textAlign = 'center';
    ctx.fillText(`★ ${Game.best.dist.toFixed(1).replace('.', ',')} m`, W - bw / 2 - pad, pad + ph / 2 + 0.5);
  }
  if (Game.mode === 'comp') {
    const rw = 74 * ui, ry = pad + ph + 6 * ui;
    pillRect(W - rw - pad, ry, rw, 24 * ui);
    ctx.fillStyle = '#9be8ff';
    ctx.font = `800 ${11 * ui}px system-ui`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(`DG ${Game.round}/2`, W - rw / 2 - pad, ry + 12 * ui + 0.5);
  }

  // --- zentrale Meldung mit Pop ---
  if (Game.time < Game.message.until) {
    const m = Game.message;
    const alpha = clamp((m.until - Game.time) / 0.3, 0, 1);
    const popT = clamp((Game.time - m.start) / 0.18, 0, 1);
    const scale = 1 + 0.35 * (1 - smoothstep(popT));
    ctx.save();
    ctx.translate(W / 2, H * 0.24);
    ctx.scale(scale, scale);
    ctx.globalAlpha = alpha;
    ctx.font = `900 ${30 * ui}px system-ui`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.strokeStyle = 'rgba(5,15,30,0.5)'; ctx.lineWidth = 5;
    ctx.strokeText(m.text, 0, 0);
    ctx.fillStyle = m.color;
    ctx.fillText(m.text, 0, 0);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // --- Weiten-Popup: schwebt über dem Springer ---
  if (Game.popup) {
    const age = Game.time - Game.popup.t0;
    if (age < 2.2) {
      const p = renToScreen(S.x, S.y + 3 + age * 1.2);
      ctx.globalAlpha = clamp(2.2 - age, 0, 1) * clamp(age * 6, 0, 1);
      ctx.font = `900 ${34 * ui}px system-ui`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.strokeStyle = 'rgba(5,15,30,0.55)'; ctx.lineWidth = 6;
      ctx.strokeText(Game.popup.text, p.x, p.y);
      ctx.fillStyle = Game.popup.crashed ? '#ff7a7a' : '#ffffff';
      ctx.fillText(Game.popup.text, p.x, p.y);
      ctx.globalAlpha = 1;
    }
  }

  // --- Start-Hinweis am Gate ---
  if (Game.state === 'GATE' && !Tutorial.active) {
    ctx.globalAlpha = 0.65 + Math.sin(Game.time * 4) * 0.35;
    ctx.fillStyle = '#fff';
    ctx.font = `800 ${19 * ui}px system-ui`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('TIPPEN ZUM START', W / 2, H * 0.72);
    ctx.globalAlpha = 1;
  }

  // (Kein Fluglagen-Regler mehr: die Haltung des Springers selbst zeigt den
  //  Winkel – bei falscher Lage zittert die Figur sichtbar in der Anströmung.)

  // --- Live-Ergebnis unter dem Springer, während er ausfährt ---
  // (während der Siegerehrung ausgeblendet, damit nichts durchscheint)
  if ((Game.state === 'RESULT' || Game.state === 'OUTRUN') && Game.result && Game.outrunTimer > 0.9 && !Podium.active) {
    const r = Game.result, ot = Game.outrunTimer;
    const sp = renToScreen(S.x, S.y);
    const cx = clamp(sp.x, 130 * ui, W - 130 * ui);
    let y = clamp(sp.y + 60 * ui, 76 * ui, H - 190 * ui);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    // 0) Weite – sofort und dauerhaft sichtbar
    ctx.font = `900 ${30 * ui}px system-ui`;
    ctx.strokeStyle = 'rgba(5,15,30,0.55)'; ctx.lineWidth = 5;
    const dTxt = r.dist.toFixed(1).replace('.', ',') + ' m';
    ctx.strokeText(dTxt, cx, y - 14 * ui);
    ctx.fillStyle = r.crashed ? '#ff8a8a' : '#ffffff';
    ctx.fillText(dTxt, cx, y - 14 * ui);
    y += 22 * ui;
    // 1) Jury-Noten nacheinander (Streichresultate werden dann abgedunkelt)
    const cardW = 42 * ui, cardH = 27 * ui, gap = 5 * ui;
    const row = 5 * cardW + 4 * gap;
    const allShown = ot > 1.0 + 4 * 0.35 + 0.35;
    for (let i = 0; i < 5; i++) {
      const a = ot - (1.0 + i * 0.35);
      if (a < 0) continue;
      const pop = 1 + 0.35 * Math.max(0, 1 - a / 0.15);
      const dropped = allShown && (i === r.dropA || i === r.dropB);
      const x0 = cx - row / 2 + i * (cardW + gap) + cardW / 2;
      ctx.save();
      ctx.translate(x0, y + cardH / 2);
      ctx.scale(pop, pop);
      ctx.globalAlpha = dropped ? 0.35 : 1;
      ctx.fillStyle = 'rgba(10,22,38,0.78)';
      roundRect(-cardW / 2, -cardH / 2, cardW, cardH, 6 * ui);
      ctx.strokeStyle = 'rgba(160,220,255,0.3)'; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = dropped ? '#8fa8bf' : '#ffffff';
      ctx.font = `800 ${13 * ui}px system-ui`;
      ctx.fillText(r.notes[i].toFixed(1).replace('.', ','), 0, 0.5);
      if (dropped) {
        ctx.strokeStyle = '#ff7a7a'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(-cardW * 0.32, 0); ctx.lineTo(cardW * 0.32, 0); ctx.stroke();
      }
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    // 2) Punkte + Platzierung
    if (ot > 2.9) {
      const fade = clamp((ot - 2.9) / 0.3, 0, 1);
      ctx.globalAlpha = fade;
      y += cardH + 26 * ui;
      ctx.font = `900 ${24 * ui}px system-ui`;
      ctx.strokeStyle = 'rgba(5,15,30,0.55)'; ctx.lineWidth = 4;
      const ptsTxt = `${r.total.toFixed(1).replace('.', ',')} PUNKTE`;
      ctx.strokeText(ptsTxt, cx, y);
      ctx.fillStyle = '#ffffff';
      ctx.fillText(ptsTxt, cx, y);
      y += 26 * ui;
      if (Game.mode === 'comp') {
        ctx.font = `800 ${16 * ui}px system-ui`;
        const placeTxt = `${Game.round === 2 ? 'Endstand' : 'Zwischenstand'}: Platz ${r.rank} von ${CONFIG.fieldSize}`;
        ctx.strokeText(placeTxt, cx, y);
        ctx.fillStyle = '#ffd35c';
        ctx.fillText(placeTxt, cx, y);
      }
      if (Game.round === 2 && r.sum != null) {
        y += 22 * ui;
        ctx.font = `700 ${13 * ui}px system-ui`;
        const sumTxt = `Gesamt: ${r.sum.toFixed(1).replace('.', ',')} Punkte${r.record ? ' · NEUER REKORD!' : ''}`;
        ctx.strokeText(sumTxt, cx, y);
        ctx.fillStyle = r.record ? '#5cffa8' : '#cfe6f8';
        ctx.fillText(sumTxt, cx, y);
      }
      ctx.globalAlpha = 1;
    }
  }

  // --- Debug (Taste D) ---
  if (Game.debug) {
    const g = Hill.groundAt(S.x);
    const spd = Game.state === 'FLIGHT' ? Math.hypot(S.vx, S.vy) : S.v;
    const lines = [
      `state: ${Game.state}  tut: ${Tutorial.active ? Tutorial.step : '-'}`,
      `v: ${spd.toFixed(1)} m/s (${(spd * 3.6).toFixed(0)} km/h)`,
      `pos: ${S.x.toFixed(1)} / ${S.y.toFixed(1)}   h: ${(S.y - g.y).toFixed(1)} m`,
      `alpha: ${Game.flight.alpha.toFixed(1)}°   body: ${S.body.toFixed(1)}°`,
      `lift: ${Game.flight.lift.toFixed(2)}   drag: ${Game.flight.drag.toFixed(2)}`,
      `wind: ${Game.currentWind().toFixed(2)} m/s   tta: ${Game.landingTap.tta.toFixed(2)} s`,
      `korridor: ${(Game.flight.time ? Game.flight.corridorTime / Game.flight.time * 100 : 0).toFixed(0)} %  ppm: ${cam.ppm.toFixed(1)}`,
    ];
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    roundRect(10, H - 26 - lines.length * 16, 320, lines.length * 16 + 12, 6);
    ctx.fillStyle = '#b2ff59';
    ctx.font = '12px ui-monospace, monospace';
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    lines.forEach((l, i) => ctx.fillText(l, 18, H - 20 - (lines.length - 1 - i) * 16));
  }
  ctx.textBaseline = 'alphabetic';
}

function roundRect(x, y, w, h, r) {
  r = Math.min(r, h / 2, w / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath(); ctx.fill();
}

// --- Retro-Finish: Bayer-Dithering mit begrenzter Palette über die Welt.
// Aus weichen Verläufen werden klassisch gerasterte Farbbänder – echter Pixel-Art-Look.
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
function posterizeWorld() {
  if (!CONFIG.pixelLevels) return;
  const w = canvas.width, h = canvas.height;
  const img = wctx.getImageData(0, 0, w, h);
  const d = img.data;
  const step = 255 / (CONFIG.pixelLevels - 1);
  const amp = step * CONFIG.ditherAmount; // schmale Dither-Zonen statt Vollflächen-Rauschen
  for (let y = 0; y < h; y++) {
    const by = (y & 3) << 2;
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) << 2;
      const t = (BAYER[by | (x & 3)] / 16 - 0.5) * amp;
      d[i]     = Math.max(0, Math.min(255, Math.round((d[i]     + t) / step) * step));
      d[i + 1] = Math.max(0, Math.min(255, Math.round((d[i + 1] + t) / step) * step));
      d[i + 2] = Math.max(0, Math.min(255, Math.round((d[i + 2] + t) / step) * step));
    }
  }
  wctx.putImageData(img, 0, 0);
}

// ------------------------------------------------------------------ Siegerehrung
// Screen-Space-Overlay nach Durchgang 2 (Top 3): Podest, Medaille, Konfettiregen.
const Podium = {
  active: false, rank: 1, sum: 0, t0: 0, lastNow: 0, conf: [], btnShown: false,
  start(rank, sum) {
    this.active = true; this.rank = rank; this.sum = sum || 0;
    this.t0 = this.lastNow = performance.now() / 1000;
    this.conf = []; this.btnShown = false;
    hide(nextBtn);
    Sound.perfect(); Sound.telemark();
  },
  stop() { this.active = false; },
};

function drawPodium() {
  const now = performance.now() / 1000;
  const dt = Math.min(now - Podium.lastNow, 0.05); Podium.lastNow = now;
  const t = now - Podium.t0;
  const ui = clamp(Math.min(W, H) / 370, 0.95, 1.6);

  // Abdunkeln + Buehne
  ctx.fillStyle = 'rgba(6,14,26,0.93)'; ctx.fillRect(0, 0, W, H);

  const cx = W / 2, baseY = H * 0.66;
  const bw = Math.min(W * 0.26, 150), bh = Math.min(H * 0.16, 120);
  // Bloecke: [2., 1., 3.] – Einflug der Bloecke
  const rise = t < 0.5 ? 1 - Math.pow(1 - clamp(t / 0.5, 0, 1), 3) : 1;
  const steps = [
    { rank: 2, x: cx - bw, h: bh * 0.72 },
    { rank: 1, x: cx,      h: bh * 1.0 },
    { rank: 3, x: cx + bw, h: bh * 0.55 },
  ];
  const medalCol = { 1: '#ffd35c', 2: '#cfd8e3', 3: '#d9975a' };
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const s of steps) {
    const h = s.h * rise;
    ctx.fillStyle = '#16283c';
    ctx.fillRect(s.x - bw / 2 + 2, baseY - h, bw - 4, h);
    ctx.fillStyle = 'rgba(127,227,255,0.14)';
    ctx.fillRect(s.x - bw / 2 + 2, baseY - h, bw - 4, 8 * ui);
    ctx.fillStyle = medalCol[s.rank];
    ctx.font = `800 ${26 * ui}px system-ui`;
    ctx.fillText(String(s.rank), s.x, baseY - h / 2 + 4 * ui);
  }

  // Figuren: Spieler (rot) auf seinem Platz, zwei KI-Springer daneben
  const others = ['#38bdf8', '#a78bfa'];
  let oi = 0;
  for (const s of steps) {
    const isMe = s.rank === Podium.rank;
    const suit = isMe ? '#ff4757' : others[oi++ % 2];
    const fs = (isMe ? 1.12 : 1.0) * ui;
    const fy = baseY - s.h * rise;             // Standflaeche
    const jump = isMe && t > 1.7 ? Math.abs(Math.sin((t - 1.7) * 5.2)) * 10 * ui * Math.max(0, 1 - (t - 1.7) / 4) : 0;
    drawPodiumFig(s.x, fy - jump, fs, suit, isMe, isMe ? clamp((t - 1.55) * 3, 0, 1) : 0);
    // Medaille faellt auf die Brust des Spielers
    if (isMe && t > 0.7) {
      const drop = 1 - Math.pow(1 - clamp((t - 0.7) / 0.7, 0, 1), 3);
      const my = lerp(-40 * ui, fy - jump - 26 * fs, drop);
      const r = 13 * ui;
      // Band
      ctx.strokeStyle = '#d63447'; ctx.lineWidth = 4 * ui;
      ctx.beginPath(); ctx.moveTo(s.x - r * 0.7, my - r * 1.4); ctx.lineTo(s.x, my); ctx.lineTo(s.x + r * 0.7, my - r * 1.4); ctx.stroke();
      ctx.fillStyle = medalCol[Podium.rank];
      ctx.beginPath(); ctx.arc(s.x, my, r, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(18,33,47,0.55)'; ctx.lineWidth = 2 * ui; ctx.stroke();
      ctx.fillStyle = 'rgba(18,33,47,0.75)';
      ctx.font = `800 ${13 * ui}px system-ui`;
      ctx.fillText(String(Podium.rank), s.x, my + 1);
      // Glitzern nach dem Aufsetzen
      if (drop >= 1) {
        for (let i = 0; i < 3; i++) {
          const ga = t * 3 + i * 2.1, gr = r * (1.5 + Math.sin(t * 5 + i) * 0.3);
          ctx.fillStyle = `rgba(255,240,180,${0.35 + 0.3 * Math.sin(t * 7 + i * 2)})`;
          ctx.beginPath(); ctx.arc(s.x + Math.cos(ga) * gr, my + Math.sin(ga) * gr, 1.6 * ui, 0, 7); ctx.fill();
        }
      }
    }
  }

  // Titel + Ergebnis
  ctx.fillStyle = '#9be8ff';
  ctx.font = `800 ${11 * ui}px system-ui`;
  ctx.fillText('S I E G E R E H R U N G', cx, H * 0.18);
  ctx.fillStyle = medalCol[Podium.rank];
  ctx.font = `900 ${44 * ui}px system-ui`;
  ctx.fillText(`PLATZ ${Podium.rank}`, cx, H * 0.25);
  ctx.fillStyle = '#eef6ff';
  ctx.font = `700 ${15 * ui}px system-ui`;
  ctx.fillText(`${Podium.sum.toFixed(1).replace('.', ',')} Punkte gesamt`, cx, H * 0.31);

  // Konfettiregen (Screen-Space)
  if (t < 7 && Podium.conf.length < 140 && Math.random() < dt * 90) {
    Podium.conf.push({ x: Math.random() * W, y: -10, vx: (Math.random() - 0.5) * 40,
                       vy: 60 + Math.random() * 90, rot: Math.random() * 7, vr: (Math.random() - 0.5) * 9,
                       c: CROWD_COLORS[(Math.random() * CROWD_COLORS.length) | 0], s: (3 + Math.random() * 4) * ui });
  }
  for (let i = Podium.conf.length - 1; i >= 0; i--) {
    const p = Podium.conf[i];
    p.x += (p.vx + Math.sin(p.y * 0.02 + p.rot) * 30) * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    if (p.y > H + 20) { Podium.conf.splice(i, 1); continue; }
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
    ctx.restore();
  }

  // Weiter-Button nach kurzem Genuss
  if (!Podium.btnShown && t > 2.6) {
    Podium.btnShown = true;
    nextBtn.textContent = 'Neuer Wettkampf';
    show(nextBtn);
  }
}

// Mini-Figur fuer das Podest: steht frontal, Spieler reisst die Arme hoch
function drawPodiumFig(x, footY, s, suit, isMe, armUp) {
  ctx.lineCap = 'round';
  const lw = 5 * s;
  // Beine
  ctx.strokeStyle = '#22354a'; ctx.lineWidth = lw;
  ctx.beginPath();
  ctx.moveTo(x - 5 * s, footY); ctx.lineTo(x - 4 * s, footY - 16 * s);
  ctx.moveTo(x + 5 * s, footY); ctx.lineTo(x + 4 * s, footY - 16 * s);
  ctx.stroke();
  // Torso
  ctx.strokeStyle = suit; ctx.lineWidth = lw * 1.5;
  ctx.beginPath(); ctx.moveTo(x, footY - 15 * s); ctx.lineTo(x, footY - 34 * s); ctx.stroke();
  // Arme (armUp 0..1: von unten nach V-Jubel)
  const ay = footY - 31 * s;
  const spread = lerp(10 * s, 13 * s, armUp), lift = lerp(8 * s, -14 * s, armUp);
  ctx.strokeStyle = suit; ctx.lineWidth = lw;
  ctx.beginPath();
  ctx.moveTo(x - 2 * s, ay); ctx.lineTo(x - spread, ay + lift);
  ctx.moveTo(x + 2 * s, ay); ctx.lineTo(x + spread, ay + lift);
  ctx.stroke();
  // Kopf mit Helm
  ctx.fillStyle = '#f8fafc';
  ctx.beginPath(); ctx.arc(x, footY - 41 * s, 6.5 * s, 0, 7); ctx.fill();
  ctx.strokeStyle = '#12212f'; ctx.lineWidth = 1.4 * s; ctx.stroke();
}

// ------------------------------------------------------------------ Loop
let last = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now;
  dt = Math.min(dt, 0.25);
  acc += dt;
  while (acc >= CONFIG.timestep) {
    Game.update(CONFIG.timestep);
    Tutorial.update();
    acc -= CONFIG.timestep;
  }
  updateCamera(dt);
  // Wind-Sound: Pegel und Frequenz folgen Tempo und Phase
  {
    const S = Game.skier;
    let lvl = 0.02, frq = 400;
    if (Game.state === 'FLIGHT') {
      const spd = Math.hypot(S.vx, S.vy);
      lvl = clamp((spd - 10) / 45, 0, 1) * 0.32;
      frq = 380 + spd * 9;
    } else if (Game.state === 'INRUN' || Game.state === 'OUTRUN') {
      lvl = clamp(S.v / 26, 0, 1) * 0.18;
      frq = 280 + S.v * 7;
    }
    Sound.wind(lvl, frq);
  }
  // Zeichnen abgesichert: eine Exception mitten im Frame darf keine
  // save()/clip()-Reste hinterlassen (das zerschoss früher dauerhaft das HUD)
  try {
    // Welt-Ebene: niedrig aufgelöst, pixelig
    ctx = wctx;
    drawBackground();
    drawHill();
    drawTrees();
    drawBuildings();
    drawCrowd();
    drawObstacles();
    drawFlag(Hill.xAtDistance(CONFIG.kPoint), '#ff3d55');
    drawFlag(Hill.xAtDistance(CONFIG.hillSize), '#35d0ff');
    drawShadow();
    drawTrail();
    drawParticles();
    drawFX();
      drawSkier();
    if (Game.state === 'MENU' || Game.state === 'GATE'
        || (Game.state === 'INRUN' && Game.skier.s < CONFIG.gateOffset + 6)) drawStartBar('front');
    posterizeWorld();
    // HUD-Ebene: volle Auflösung, scharfe Texte und Anzeigen
    ctx = hctx;
    ctx.clearRect(0, 0, W, H);
    drawHillLabels();
    drawPrediction();
    ctx.fillStyle = vignette; ctx.fillRect(0, 0, W, H);
    drawHUD();
    if (Podium.active) drawPodium();
  } catch (e) {
    // Notbremse: Save-Stack beider Kontexte komplett leeren (restore über
    // die Stacktiefe hinaus ist ein No-Op) und Basistransform wiederherstellen
    for (let i = 0; i < 40; i++) { wctx.restore(); hctx.restore(); }
    wctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    hctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (!frame.err) { frame.err = true; console.error('Renderfehler:', e); }
  }
}

// ------------------------------------------------------------------ UI-Verdrahtung
const startPanel = document.getElementById('startPanel');
const tutCard = document.getElementById('tutCard');
const tutStep = document.getElementById('tutStep');
const tutText = document.getElementById('tutText');
const tutGo = document.getElementById('tutGo');
const tutAnim = document.getElementById('tutAnim');
const tutLbl = document.getElementById('tutLbl');
const show = el => el.classList.remove('hidden');
const hide = el => el.classList.add('hidden');

const nextBtn = document.getElementById('nextBtn');
const muteBtn = document.getElementById('muteBtn');
const homeBtn = document.getElementById('homeBtn');
function goMenu() {
  Podium.stop();
  updateStartPanel();
  Game.state = 'MENU';
  Game.result = null; Game.popup = null;
  Game.trail.length = 0; Game.particles.length = 0;
  Ragdoll.active = false;
  Tutorial.paused = false; tutCard.classList.add('hidden');
  hide(nextBtn); hide(homeBtn); show(startPanel);
  const start = Hill.inrunAt(CONFIG.gateOffset);
  Object.assign(Game.skier, { x: start.x, y: start.y, vx: 0, vy: 0, v: 0, s: CONFIG.gateOffset,
    body: -start.angle, poseA: 'gate', poseB: 'gate', poseT: 1, crash: false });
}
function startRun(mode) {
  Sound.init(); Sound.click();
  Game.mode = mode;
  Game.newCompetition();
  Game.newJump();
  show(homeBtn);
}
document.getElementById('startBtn').addEventListener('click', () => startRun('comp'));
document.getElementById('trainBtn').addEventListener('click', () => startRun('train'));
document.getElementById('tutBtn').addEventListener('click', () => {
  try { localStorage.removeItem('alpenflug_tut_v1'); } catch (e) {}
  Tutorial.active = true; Tutorial.step = 0; Tutorial.paused = false;
  startRun('train');
});
homeBtn.addEventListener('click', () => { Sound.click(); goMenu(); });
nextBtn.addEventListener('click', () => {
  Sound.init(); Sound.click();
  if (Podium.active) { Podium.stop(); Game.advance(); show(homeBtn); return; }
  if (Game.mode === 'comp' && Game.round === 2 && Game.state === 'RESULT'
      && Game.result && Game.result.rank <= 3) {
    Podium.start(Game.result.rank, Game.result.sum || Game.result.total);
    return;
  }
  Game.advance(); show(homeBtn);
});
muteBtn.addEventListener('click', () => {
  Sound.init();
  muteBtn.textContent = Sound.toggle() ? '🔊' : '🔇';
});
window.addEventListener('keydown', e => {
  if ((e.key === ' ' || e.key === 'Enter') && Game.state === 'MENU') {
    e.preventDefault();
    startRun('comp');
  } else if ((e.key === ' ' || e.key === 'Enter') && Game.state === 'RESULT') {
    e.preventDefault();
    Game.advance();
  }
});
function updateStartPanel() {
  document.getElementById('startBest').textContent =
    (Game.record > 0
      ? `Schanzenrekord heute: ${Game.record.toFixed(1).replace('.', ',')} m`
      : 'Heute noch kein Schanzenrekord – setz die erste Marke!') +
    (Game.best ? ` · Deine Bestweite: ${Game.best.dist.toFixed(1).replace('.', ',')} m` : '');
}
updateStartPanel();

// Springer für den Startbildschirm ans Gate setzen
{
  const start = Hill.inrunAt(CONFIG.gateOffset);
  Object.assign(Game.skier, { x: start.x, y: start.y, body: -start.angle, poseA: 'gate', poseB: 'gate', poseT: 1 });
  cam.x = start.x + 5; cam.y = start.y - 2;
  cam.ppm = Math.min(W / CONFIG.camGateView, H / (CONFIG.camGateView * 0.82));
}

// Alten Service-Worker (aus früherem Projekt auf dieser Domain) entfernen,
// damit keine gecachte Fremd-Version ausgeliefert wird.
if ('serviceWorker' in navigator)
  navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});

requestAnimationFrame(frame);
