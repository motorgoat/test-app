<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #0b1020; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; touch-action: none;
         -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
         overscroll-behavior: none; }
  #c { display: block; width: 100%; height: 100%; touch-action: none; }

  .hud { position: fixed; pointer-events: none; color: #fff; z-index: 5; }
  #alt { top: max(8px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center;
         font-size: 62px; font-weight: 900; letter-spacing: -2px; color: #fff;

         -webkit-text-stroke: 7px #1A1030; paint-order: stroke fill;

  #alt small { font-size: 24px; font-weight: 900; letter-spacing: 0; margin-left: 3px;
               -webkit-text-stroke: 5px #1A1030; paint-order: stroke fill; }
  #topbar { top: max(74px, calc(env(safe-area-inset-top) + 64px)); left: 12px; display: flex; gap: 6px; flex-direction: column; align-items: flex-start; }
  #topbar .chip { background: #1A2A6B; border: 3px solid #0E1740; border-bottom-width: 5px;
                  border-radius: 999px; padding: 5px 13px; font-size: 15px; font-weight: 900;
                  color: #fff; box-shadow: 0 2px 0 rgba(0,0,0,.25); }
  #btns { position: fixed; top: max(12px, env(safe-area-inset-top)); right: 12px; display: flex; gap: 8px; z-index: 6; }
  .iconbtn { width: 50px; height: 50px; border-radius: 50%; border: 3px solid #0E1740;
             border-bottom-width: 6px; background: linear-gradient(180deg,#3A57C8,#22368F);
             color: #fff; font-size: 21px; display: flex; align-items: center; justify-content: center;
             box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .iconbtn:active { transform: translateY(3px); border-bottom-width: 3px; }

  #hint { bottom: 13vh; left: 0; right: 0; text-align: center; animation: pulse 1.4s ease-in-out infinite; }
  #hint span { display: inline-block; padding: 14px 34px; border-radius: 999px;
               font-size: 24px; font-weight: 900; letter-spacing: 6px; color: #3A1F00;
               background: linear-gradient(180deg, #FFD84D, #FFA412);
               border: 4px solid #0B1130; border-bottom-width: 7px;
               box-shadow: 0 8px 30px rgba(4,8,24,.35); }
  #subhint { bottom: calc(13vh - 38px); left: 0; right: 0; text-align: center; font-size: 14px; opacity: .9;
             font-weight: 600; text-shadow: 0 1px 8px rgba(4,8,24,.6); }
  @keyframes pulse { 0%,100% { opacity: .72; transform: translateY(2px); } 50% { opacity: 1; transform: translateY(-2px); } }

  #toast { top: 24%; left: 0; right: 0; text-align: center; opacity: 0; transition: opacity .25s; }
  #toast span { display: inline-block; padding: 10px 20px; border-radius: 999px; font-size: 18px; font-weight: 900;
                background: #16205A; border: 3px solid #0B1130; border-bottom-width: 5px; color: #fff;
                box-shadow: 0 8px 26px rgba(0,0,0,.4); }

  .panel { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
           background: #16205A; color: #eef2ff;
           border-radius: 28px; padding: 18px 18px 16px; width: min(92vw, 380px); text-align: center; z-index: 20;
           box-shadow: 0 18px 60px rgba(0,0,0,.55), inset 0 0 0 3px #2E44A8;
           border: 4px solid #0B1130; }
  .panel h1 { font-size: 28px; letter-spacing: 1px; }
  .panel .stamp { display: inline-block; margin: 6px 0 2px; padding: 7px 16px; border: 4px solid #FF2E4D;
                  color: #fff; border-radius: 14px; font-weight: 900; font-size: 16px; letter-spacing: 1px;
                  transform: rotate(-3deg); background: #C0182F; }
  .panel .big { font-size: 52px; font-weight: 900; margin: 6px 0 0; font-variant-numeric: tabular-nums;
                color: #fff; -webkit-text-stroke: 6px #0B1130; paint-order: stroke fill; }
  .panel .best { color: #FFD84D; font-weight: 900; font-size: 17px; margin-bottom: 4px; min-height: 22px; }
  .panel .sub { color: #9fb0d8; font-size: 13px; margin: 5px 0 9px; line-height: 1.45; }
  .panel .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 4px; }
  .panel button { border: 0; border-bottom: 5px solid #142055; border-radius: 20px;
                  min-height: 52px; padding: 8px 14px; font-size: 16px; font-weight: 900;
                  background: linear-gradient(180deg, #3A57C8, #22368F); color: #fff; min-width: 92px;
                  letter-spacing: .2px; }
  .panel button.primary { background: linear-gradient(180deg, #FFD84D, #FFA412);
                          border-bottom-color: #B85C00; color: #3A1F00; }
  .panel button:active { transform: translateY(3px); border-bottom-width: 2px; }
  .panel .tapline { margin-top: 12px; font-size: 12px; color: #7f8fb8; }
  .panel .unlock { color: #7dffb2; font-weight: 800; font-size: 14px; min-height: 18px; margin-top: 2px; }
  .hidden { display: none !important; }

  #dailyGrid { font-size: 26px; letter-spacing: 3px; margin: 6px 0; min-height: 32px; }
  #dailyPanel .target { font-size: 14px; color: #cfd9f5; }
  #dailyPanel .streak { color: #ffab5e; font-weight: 800; min-height: 20px; }

<script>
'use strict';
/* ============================================================
   RUNG — Die höchste Leiter der Welt.
   Single-File HTML5 Mobile Game. Kein Framework, keine Assets.
   Physik: deterministischer 60-Hz-Timestep (Accumulator) für
   plattformübergreifende Ghost-Replays via URL-Hash.
   ============================================================ */

// ------------------------------------------------ Tuning ----
const CFG = {
  dt: 1/60,
  baseLen: 4,               // virtuelle Pendellänge am Boden (m)
  grav: 22,                 // Pendel-"Gravitation"
  gravRampH: 25,            // bis hier skaliert die Instabilität ein (Bodennähe = gutmütig)
  gravFloor: 0.32,
  ctrl: 80,                 // Lean-Autorität, geteilt durch (10 + h*0.35)
  braceCtrl: 1.6,           // Kontroll-Bonus beim Abstützen (Daumen nach unten)
  damp: 0.35,               // Winkeldämpfung
  fallAngle: 0.62,          // rad -> Sturz
  climbSpeed: 3.1,          // m/s
  climbBob: 0.22,           // Schritt-Wackeln beim Klettern
  dragRange: 120,           // px Daumenweg für vollen Lean
  braceDy: 34,              // px nach unten = Abstützen
  idleRatchet: 0.55,        // "Der Wind findet dich": Aufschaukeln pro Sekunde Stillstand
  idleMax: 2.6,
  gustWarn: 1.0,            // s Vorwarnung
  geraldMinH: 35,
  flagBandsBase: [25, 50, 75, 100],
  flagEvery: 50,            // danach alle 50 m
  flagHold: 0.6,            // s Abstützen im Band startet Pflanzen
  flagPlant: 2.0,           // s eingefroren beim Pflanzen
  dailyTarget: 60,
  dailyTries: 5,
  maxRecFrames: 30*240,     // 240 s Aufnahme-Limit (30 Hz)
};
const LANDMARKS = { 25:'DÄCHER', 50:'WOLKEN', 75:'JETSTREAM', 100:'WELTRAUM' };
const UNLOCKS = [
  { at: 30,  id: 'helm',  label: '⛑️ Helm für Gerald' },
  { at: 70,  id: 'scarf', label: '🧣 Roter Schal' },
  { at: 140, id: 'gold',  label: '✨ Goldene Leiter' },
];
const DAILY_EPOCH = Date.UTC(2026, 0, 1);

// ------------------------------------------------ Utils ----
const clamp = (v,a,b)=> v<a?a : v>b?b : v;
const lerp = (a,b,t)=> a+(b-a)*t;
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function b64uEnc(bytes){ let s=''; for(const b of bytes) s+=String.fromCharCode(b);
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64uDec(str){ str=str.replace(/-/g,'+').replace(/_/g,'/'); while(str.length%4) str+='=';
  const s=atob(str), out=new Uint8Array(s.length); for(let i=0;i<s.length;i++) out[i]=s.charCodeAt(i); return out; }
function rleEnc(arr){ const out=[]; let i=0; while(i<arr.length){ let j=i; while(j<arr.length-1 && arr[j+1]===arr[i] && j-i<254) j++;
  out.push(arr[i], j-i+1); i=j+1; } return out; }
function rleDec(arr){ const out=[]; for(let i=0;i<arr.length;i+=2){ for(let k=0;k<arr[i+1];k++) out.push(arr[i]); } return out; }
function todayKey(offsetDays=0){ const d=new Date(Date.now()-offsetDays*864e5);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dailyNum(key){ const [y,m,d]=key.split('-').map(Number); return Math.round((Date.UTC(y,m-1,d)-DAILY_EPOCH)/864e5)+1; }

// ------------------------------------------------ Save ----
const SAVE_KEY = 'rung_save_v1';
let SAVE;
function loadSave(){
  try { SAVE = JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; } catch(e){ SAVE = {}; }
  SAVE = Object.assign({ v:1, pb:0, feathers:0, flags:{}, streak:0, lastDailyWin:'', daily:null, dailyAlt:null,
    geraldKills:0, sessions:0, sound:true, unlocked:{} }, SAVE);
}
function save(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch(e){} }
loadSave();
SAVE.sessions++; save();

// ------------------------------------------------ Audio ----
/* Signalkette:
     Stimmen ─> sfxBus ─┐
                        ├─> trim ─> Hochpass 55 Hz ─> Limiter ─> Softclip ─> master ─> Ausgang
     Wind ─> ambBus ────┘                                                     (Mute/Lautstärke)

   - Hüllkurven starten und enden auf 0 (klickfrei), Attack wird gegen dur geklemmt.
   - Rauschen kommt aus EINEM vorgerechneten Puffer (keine Allokation pro Ton).
     Achtung: der Puffer ist bewusst nicht normalisiert (Spitzen ~ +6 dB), die
     Gain-Werte von noise() und tone() sind daher NICHT in derselben Einheit.
   - Stimmenbudget mit Priorität: unwichtige Salven (Sprossen) fallen zuerst weg.
   - Lauter SFX duckt die Wind-Ambience kurz weg.
   - Wichtig für Handy-Lautsprecher: jeder tiefe Sound hat eine Mittenschicht,
     sonst ist er auf dem Zielgerät praktisch unhörbar. Der Hochpass entfernt
     Sub-Anteile, die ohnehin nur Headroom kosten.
   - Pegel offline gemessen (ITU-R BS.1770-4, K-weighted, gated) — Zielwerte im
     Testprotokoll: Spielmix ~-16,5 LUFS, Worst Case Sample-Peak <= -3 dBFS. */
const AudioEngine = {
  ctx: null, master: null, limiter: null, clip: null, hp: null,
  sfxBus: null, ambBus: null, trim: null, panL: null, panR: null,
  windFilter: null, windLow: null, windGain: null, windMod: null,
  muted: !SAVE.sound, voices: 0, maxVoices: 32, noiseBuf: null,
  rungStep: 0, rungDeg: null, lastRung: 0, wTarget: -1, wHeight: -1,
  MASTER: 1.0,                  // Nutzerlautstärke/Mute – sitzt NACH dem Limiter
  TRIM: 7.0,                    // trägt die gesamte Pegelkalibrierung
  PENTA: [0, 2, 4, 7, 9],       // Dur-Pentatonik: klingt beim Klettern immer "richtig"

  init(){
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ctx = new AC({ latencyHint: 'interactive' }); } catch(e){ this.ctx = new AC(); }
    const c = this.ctx;

    // Nutzerlautstärke ganz am Ende: Mute ist damit garantiert echte Stille
    this.master = c.createGain();
    this.master.gain.value = this.muted ? 0 : this.MASTER;
    this.master.connect(c.destination);

    // Softclip mit 4-fachem Oversampling: begrenzt auch Zwischenwert-Spitzen
    // (das kann ein DynamicsCompressor mangels Vorausschau nicht)
    const n = 4096, curve = new Float32Array(n), K = 0.5, CEIL = 0.708; // 0.708 = -3 dBFS
    for (let i = 0; i < n; i++){
      const x = (i/(n-1))*2 - 1, a = Math.abs(x);
      curve[i] = Math.sign(x) * (a <= K ? a : K + (CEIL-K)*Math.tanh((a-K)/(CEIL-K)));
    }
    this.clip = c.createWaveShaper();
    this.clip.curve = curve; this.clip.oversample = '4x';
    this.clip.connect(this.master);

    this.limiter = c.createDynamicsCompressor();
    this.limiter.threshold.value = -6;
    this.limiter.knee.value = 4;
    this.limiter.ratio.value = 20;
    this.limiter.attack.value = 0.003;
    this.limiter.release.value = 0.12;
    this.limiter.connect(this.clip);

    // Sub unter 55 Hz raus: auf Handys unhörbar, kostet aber Headroom
    this.hp = c.createBiquadFilter();
    this.hp.type = 'highpass'; this.hp.frequency.value = 55; this.hp.Q.value = 0.7;
    this.hp.connect(this.limiter);

    this.trim = c.createGain(); this.trim.gain.value = this.TRIM; this.trim.connect(this.hp);
    this.sfxBus = c.createGain(); this.sfxBus.gain.value = 1; this.sfxBus.connect(this.trim);
    this.ambBus = c.createGain(); this.ambBus.gain.value = 1; this.ambBus.connect(this.trim);

    // Feste Panorama-Busse für die Sprossen (spart Knoten im heißen Pfad).
    // Der Vorverstärker gleicht den Leistungsverlust des Panners aus.
    if (c.createStereoPanner){
      const mk = p => {
        const g = c.createGain(); g.gain.value = Math.SQRT2;
        const sp = c.createStereoPanner(); sp.pan.value = p;
        g.connect(sp); sp.connect(this.sfxBus);
        return g;
      };
      this.panL = mk(-0.18); this.panR = mk(0.18);
    }

    // Ein Rauschpuffer für alles (3 s, wird an zufälliger Stelle angespielt)
    const len = c.sampleRate * 3;
    this.noiseBuf = c.createBuffer(1, len, c.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    let b0=0, b1=0, b2=0;
    for (let i=0;i<len;i++){
      const w = Math.random()*2-1;                 // leicht rosa gefärbt: weicher
      b0 = 0.99765*b0 + w*0.0990460;
      b1 = 0.96300*b1 + w*0.2965164;
      b2 = 0.57000*b2 + w*1.0526913;
      d[i] = (b0+b1+b2+w*0.1848) * 0.28;
    }

    // Wind-Ambience: zwei Filterschichten + zwei langsame, teilerfremde LFOs,
    // damit sie atmet und nie hörbar loopt (Schwebung ~2,3 min)
    const src = c.createBufferSource(); src.buffer = this.noiseBuf; src.loop = true;
    this.windLow = c.createBiquadFilter();
    this.windLow.type = 'lowpass'; this.windLow.frequency.value = 900; this.windLow.Q.value = 0.7;
    this.windFilter = c.createBiquadFilter();
    this.windFilter.type = 'bandpass'; this.windFilter.frequency.value = 420; this.windFilter.Q.value = 0.8;
    this.windGain = c.createGain(); this.windGain.gain.value = 0;
    this.windMod = c.createGain(); this.windMod.gain.value = 1;
    src.connect(this.windLow); this.windLow.connect(this.windFilter);
    this.windFilter.connect(this.windGain); this.windGain.connect(this.windMod);
    this.windMod.connect(this.ambBus);
    src.start();
    const lf1 = c.createOscillator(); lf1.frequency.value = 0.071;
    const lg1 = c.createGain(); lg1.gain.value = 0.38;          // Pegel atmet ±38 %
    lf1.connect(lg1); lg1.connect(this.windMod.gain); lf1.start();
    const lf2 = c.createOscillator(); lf2.frequency.value = 0.113;
    const lg2 = c.createGain(); lg2.gain.value = 190;           // Bandpass wandert ±190 Hz
    lf2.connect(lg2); lg2.connect(this.windFilter.frequency); lf2.start();

    // iOS: nach Anruf/Unterbrechung landet der Kontext in 'interrupted'
    c.addEventListener('statechange', () => {
      if (c.state === 'interrupted' || (c.state === 'suspended' && !document.hidden))
        c.resume().catch(()=>{});
    });
  },
  resume(){ if (this.ctx && this.ctx.state !== 'running') this.ctx.resume().catch(()=>{}); },
  setMuted(m){
    this.muted = m;
    if (this.master) this.master.gain.setTargetAtTime(m ? 0 : this.MASTER, this.ctx.currentTime, 0.02);
  },
  ok(){ return this.ctx && !this.muted; },
  // Stimmenbudget: wichtige Sounds (prio) dürfen es überschreiten,
  // Salven wie Sprossen fallen zuerst weg
  take(prio){ if (this.voices >= this.maxVoices && !prio) return false; this.voices++; return true; },
  free(node, when, tail){
    let id = 0, done = false;
    const rel = () => {
      if (done) return;
      done = true;
      clearTimeout(id);
      try { node.disconnect(); if (tail && tail !== node) tail.disconnect(); } catch(e){}
      this.voices = Math.max(0, this.voices - 1);
      node.onended = null;
    };
    node.onended = rel;
    id = setTimeout(rel, Math.max(50, (when - this.ctx.currentTime + 0.4) * 1000));
  },
  // Klickfreie Hüllkurve: von 0 hoch, exponentiell runter, sauber auf 0 beenden
  env(g, t, peak, attack, dur){
    if (!(peak > 0.0002)){ g.gain.setValueAtTime(0, t); return; }
    attack = Math.min(attack, dur*0.5);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    g.gain.setValueAtTime(0, t + dur + 0.005);
  },
  // Anschwellende Hüllkurve: Höhepunkt am ENDE (für Warn-Riser)
  envRise(g, t, peak, rise, rel){
    if (!(peak > 0.0002)){ g.gain.setValueAtTime(0, t); return; }
    rise = Math.max(0.001, rise); rel = Math.max(0.02, rel);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + rise);
    g.gain.exponentialRampToValueAtTime(0.0001, t + rise + rel);
    g.gain.setValueAtTime(0, t + rise + rel + 0.005);
  },
  shape(g, t, o){
    if (o.rise) this.envRise(g, t, o.gain, Math.min(o.rise, o.dur*0.9), Math.max(0.02, o.dur - Math.min(o.rise, o.dur*0.9)));
    else this.env(g, t, o.gain, o.attack || 0.006, o.dur);
  },
  // Panner kostet 3 dB Leistung -> Vorverstärkung gleicht das aus
  pan(node, p){
    if (!p || !this.ctx.createStereoPanner) return node;
    const comp = this.ctx.createGain(); comp.gain.value = Math.SQRT2;
    const sp = this.ctx.createStereoPanner(); sp.pan.value = clamp(p, -1, 1);
    node.connect(comp); comp.connect(sp);
    return sp;
  },
  // Grundbaustein Ton
  tone(o){
    if (!this.ok() || !this.take(o.prio)) return;
    const c = this.ctx, t = c.currentTime + (o.delay||0);
    const osc = c.createOscillator();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.freq, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.to), t + (o.bendDur || o.dur));
    const g = c.createGain();
    this.shape(g, t, o);
    let node = osc; node.connect(g); node = g;
    if (o.filter){
      const f = c.createBiquadFilter();
      f.type = o.filter; f.frequency.value = o.fc || 1200; f.Q.value = o.q || 0.7;
      node.connect(f); node = f;
    }
    if (o.vib){
      const lfo = c.createOscillator(), lg = c.createGain();
      lfo.frequency.value = o.vibRate || 6; lg.gain.value = o.vib;
      lfo.connect(lg); lg.connect(osc.frequency); lfo.start(t); lfo.stop(t + o.dur + 0.05);
    }
    const tail = this.pan(node, o.p);
    tail.connect(o.bus || this.sfxBus);
    osc.start(t); osc.stop(t + o.dur + 0.02);
    this.free(osc, t + o.dur, tail);
  },
  // Grundbaustein Rauschen
  noise(o){
    if (!this.ok() || !this.take(o.prio)) return;
    const c = this.ctx, t = c.currentTime + (o.delay||0);
    const s = c.createBufferSource();
    s.buffer = this.noiseBuf;
    s.playbackRate.value = o.rate || 1;
    const f = c.createBiquadFilter();
    f.type = o.filter || 'bandpass';
    f.frequency.setValueAtTime(o.fc || 900, t);
    if (o.fcTo) f.frequency.exponentialRampToValueAtTime(Math.max(40, o.fcTo), t + o.dur);
    f.Q.value = o.q || 0.9;
    const g = c.createGain();
    this.shape(g, t, o);
    s.connect(f); f.connect(g);
    const tail = this.pan(g, o.p);
    tail.connect(o.bus || this.sfxBus);
    // Startpunkt so wählen, dass der Puffer nicht mitten im Ton endet
    const room = Math.max(0, this.noiseBuf.duration - (o.dur + 0.08));
    s.start(t, Math.random()*room, o.dur + 0.05);
    this.free(s, t + o.dur, tail);
  },
  // Ambience kurz wegdrücken, damit wichtige Signale durchkommen
  duck(amount = 0.45, hold = 0.12){
    if (!this.ok() || !this.ambBus) return;
    const t = this.ctx.currentTime, g = this.ambBus.gain;
    g.cancelScheduledValues(t);
    g.setTargetAtTime(1 - amount, t, 0.02);
    g.setTargetAtTime(1, t + hold, 0.18);
  },

  // -------- Spielereignisse --------
  // Sprosse: läuft ~6×/s und darf deshalb nie nerven. Statt fester Tonleiter
  // ein begrenzter Zufallslauf, dessen Zentrum mit der Höhe steigt; Register
  // gedeckelt (sonst wird es schrill), Pegel je Oktave kompensiert, dazu
  // leichte Ton- und Pegelstreuung gegen den Maschinengewehr-Effekt.
  rung(h){
    const now = this.ctx ? this.ctx.currentTime : 0;
    if (now - this.lastRung < 0.055) return;
    this.lastRung = now;
    const i = this.rungStep++;
    const center = Math.min(9, (h/12)|0);
    if (this.rungDeg === null) this.rungDeg = center;
    // Am Fensterrand spiegeln statt klemmen: Klemmen erzeugt Tonwiederholungen
    const dir = Math.random() < 0.5 ? -1 : 1;
    let next = this.rungDeg + dir;
    if (next < center-2 || next > center+3) next = this.rungDeg - dir;
    this.rungDeg = clamp(next, center-2, center+3);
    const deg = this.rungDeg;
    const semi = this.PENTA[((deg%5)+5)%5] + 12*Math.floor(deg/5);
    const f = 196 * Math.pow(2, semi/12) * (1 + (Math.random()-0.5)*0.03);
    const oct = Math.max(0, Math.floor(semi/12));
    const bus = (i%2 ? this.panR : this.panL) || this.sfxBus;
    this.tone({ freq: f, dur: 0.075, type: 'triangle', attack: 0.003, bus,
      gain: 0.105 * Math.pow(0.74, oct) * (0.85 + Math.random()*0.3) });
    // Holzkontakt: konstanter Anker genau dort, wo Handylautsprecher stark sind
    this.noise({ dur: 0.04, fc: 1400 + Math.random()*600, q: 1.3, gain: 0.062, bus });
  },
  // Böenwarnung: gerichteter Riser, dessen Höhepunkt mit dem Einsetzen der Böe
  // zusammenfällt – sonst warnt er 0,75 s zu früh
  gustWarn(dir = 1){
    this.duck(0.4, 0.9);
    this.noise({ dur: 1.0, rise: 0.92, filter: 'bandpass', fc: 240, fcTo: 1800, q: 1.1,
      gain: 0.05, p: dir*0.85, prio: 1 });
    this.tone({ freq: 165, to: 330, dur: 1.0, rise: 0.92, bendDur: 0.95, type: 'triangle',
      gain: 0.026, filter: 'lowpass', fc: 1100, p: dir*0.6, prio: 1 });
  },
  gust(dir = 1){
    this.noise({ dur: 0.7, filter: 'bandpass', fc: 1100, fcTo: 300, q: 0.8, gain: 0.075,
      attack: 0.09, p: dir*0.55, prio: 1 });
  },
  // Holzknarzen: im Mittenband, wo es auf jedem Gerät zu hören ist
  creak(){
    this.duck(0.2, 0.1);
    const f = 240 + Math.random()*180;
    this.tone({ freq: f, to: f*0.82, dur: 0.3, type: 'sawtooth', gain: 0.12, attack: 0.03,
      filter: 'bandpass', fc: f*2.2, q: 6, vib: f*0.06, vibRate: 15 + Math.random()*12 });
    this.noise({ dur: 0.3, filter: 'bandpass', fc: 800 + Math.random()*300, q: 8,
      gain: 0.088, attack: 0.05 });
  },
  // Taube: drei Silben mit betonter Mitte statt zwei gleichlangen Tönen
  coo(){
    const s = (fr, to, dur, g, d) => this.tone({ freq: fr, to, dur, type: 'triangle', gain: g,
      delay: d, filter: 'lowpass', fc: 1200, vib: 8, vibRate: 10 });
    s(430, 400, 0.12, 0.028, 0);
    s(400, 470, 0.26, 0.034, 0.14);
    s(455, 380, 0.2, 0.024, 0.44);
  },
  flap(){
    for (let i = 0; i < 3; i++)
      this.noise({ dur: 0.09, filter: 'bandpass', fc: 520 - i*60, fcTo: 900 - i*60, q: 0.7,
        gain: 0.075 - i*0.016, delay: i*0.11 + Math.random()*0.05, attack: 0.012 });
  },
  flagStart(){
    this.noise({ dur: 0.05, fc: 2400, q: 2, gain: 0.13 });
    this.tone({ freq: 330, to: 494, dur: 0.14, type: 'triangle', gain: 0.14, filter: 'lowpass', fc: 2200 });
  },
  // Belohnung: aufsteigende Pentatonik mit Glockenanteil
  flagDone(){
    this.duck(0.5, 0.4);
    [0, 4, 7, 12].forEach((s, i) => {
      const f = 392 * Math.pow(2, s/12);
      this.tone({ freq: f, dur: 0.3, type: 'triangle', gain: 0.06, delay: i*0.085,
        filter: 'lowpass', fc: 4000, prio: 1 });
      this.tone({ freq: f*2, dur: 0.18, type: 'sine', gain: 0.024, delay: i*0.085, prio: 1 });
    });
  },
  // Herzschlag "lub-dub": Dreieck statt Sinus, damit Obertöne auf dem
  // Handylautsprecher ankommen, plus perkussiver Mitten-Knock
  heartbeat(period = 0.62){
    this.duck(0.55, 0.15);
    const beat = (d, g0) => {
      this.tone({ freq: 110, to: 58, dur: 0.16, type: 'triangle', gain: g0, attack: 0.006,
        delay: d, filter: 'lowpass', fc: 460, prio: 1 });
      // Der Knock ist der einzige Teil, der einen Handylautsprecher erreicht
      this.noise({ dur: 0.08, filter: 'bandpass', fc: 700, fcTo: 420, q: 1.2,
        gain: g0*1.2, attack: 0.004, delay: d, prio: 1 });
    };
    // Systole rückt mit steigendem Puls näher, wie bei einem echten Herzschlag
    beat(0, 0.105); beat(Math.min(0.19, period*0.42), 0.076);
  },
  // "Der Wind findet dich": anschwellende Warnung beim Zögern
  idleWarn(){
    this.duck(0.35, 0.7);
    this.noise({ dur: 1.1, rise: 0.8, filter: 'bandpass', fc: 300, fcTo: 1000, q: 1.4, gain: 0.075 });
    this.tone({ freq: 210, to: 158, dur: 0.8, type: 'triangle', gain: 0.05, attack: 0.06,
      filter: 'lowpass', fc: 700, vib: 5, vibRate: 4.5 });
  },
  grab(){
    this.noise({ dur: 0.09, fc: 1300, q: 1.2, gain: 0.235 });
    this.tone({ freq: 150, to: 95, dur: 0.12, type: 'triangle', gain: 0.05, attack: 0.004,
      filter: 'lowpass', fc: 600 });
  },
  fall(){
    this.duck(0.6, 0.9);
    this.tone({ freq: 520, to: 120, dur: 1.1, type: 'triangle', gain: 0.072, attack: 0.02,
      filter: 'lowpass', fc: 2200, prio: 1 });
    this.noise({ dur: 1.1, filter: 'lowpass', fc: 1400, fcTo: 300, q: 0.6, gain: 0.048,
      attack: 0.08, prio: 1 });
  },
  letGo(){
    this.tone({ freq: 700, to: 240, dur: 0.42, type: 'sine', gain: 0.08, filter: 'lowpass', fc: 2400 });
  },
  // Leiter schlägt auf: Sub + Mittenkörper + Holzgeklapper
  thud(){
    this.duck(0.7, 0.35);
    this.tone({ freq: 96, to: 55, dur: 0.3, type: 'sine', gain: 0.17, attack: 0.004, prio: 1 });
    this.tone({ freq: 190, to: 90, dur: 0.22, type: 'triangle', gain: 0.14, attack: 0.003,
      filter: 'lowpass', fc: 700, prio: 1 });
    this.noise({ dur: 0.18, filter: 'bandpass', fc: 420, fcTo: 170, q: 0.9, gain: 0.16,
      attack: 0.003, prio: 1 });
    for (let i = 0; i < 4; i++)
      this.noise({ dur: 0.05, fc: 1100 + Math.random()*900, q: 3, gain: 0.085,
        delay: 0.05 + i*0.06 + Math.random()*0.03 });
  },
  // Ragdoll landet: dumpfer Aufprall mit Comic-Boing
  bodyThud(){
    this.duck(0.45, 0.25);
    this.tone({ freq: 130, to: 62, dur: 0.22, type: 'triangle', gain: 0.16, attack: 0.004,
      filter: 'lowpass', fc: 520, prio: 1 });
    this.noise({ dur: 0.14, filter: 'bandpass', fc: 380, fcTo: 180, q: 0.8, gain: 0.12, attack: 0.003 });
    this.tone({ freq: 300, to: 150, dur: 0.24, type: 'triangle', gain: 0.05, delay: 0.05,
      filter: 'lowpass', fc: 1200, vib: 26, vibRate: 13 });
  },
  newBest(){
    this.duck(0.55, 0.6);
    [0, 4, 7, 12, 16].forEach((s, i) => {
      const f = 523.25 * Math.pow(2, s/12);
      this.tone({ freq: f, dur: 0.42, type: 'triangle', gain: 0.055, delay: i*0.075,
        filter: 'lowpass', fc: 5000, prio: 1 });
      this.tone({ freq: f*2.01, dur: 0.3, type: 'sine', gain: 0.019, delay: i*0.075, prio: 1 });
    });
  },
  // Freischaltung: wird hinter die Rekord-Fanfare gelegt statt daraufgestapelt
  unlock(delay = 0){
    this.duck(0.4, 0.4 + delay);
    [0, 7, 12, 19].forEach((s, i) =>
      this.tone({ freq: 659.25*Math.pow(2, s/12), dur: 0.3, type: 'sine', gain: 0.05,
        delay: delay + i*0.06, prio: 1 }));
  },
  uiTap(){ this.tone({ freq: 480, to: 660, dur: 0.06, type: 'sine', gain: 0.115 }); },
  // Wind-Ambience geglättet setzen; nur bei relevanter Änderung neu automatisieren
  setWind(intensity, h){
    if (!this.windGain) return;
    // Deckel bewusst niedrig: bei 0.28 hielt die Ambience allein den Limiter
    // dauerhaft in Regelung und verdeckte jedes Spielsignal.
    const target = this.muted ? 0 : Math.min(0.12, 0.03 + intensity*0.34);
    if (Math.abs(target - this.wTarget) < 0.004 && Math.abs(h - this.wHeight) < 2) return;
    this.wTarget = target; this.wHeight = h;
    const t = this.ctx.currentTime;
    this.windGain.gain.setTargetAtTime(target, t, 0.12);
    this.windFilter.frequency.setTargetAtTime(340 + Math.min(600, h*3.2), t, 0.3);
    this.windLow.frequency.setTargetAtTime(700 + Math.min(1600, h*8), t, 0.3);
  },
  // Rückwärtskompatible Helfer
  beep(freq, dur=0.08, type='sine', gain=0.25, slideTo=0, delay=0){
    this.tone({ freq, dur, type, gain: gain*0.55, to: slideTo, delay });
  },
  noiseBurst(dur=0.15, freq=900, gain=0.3, delay=0){
    this.noise({ dur, fc: freq, gain: gain*0.5, delay });
  },
};
// Kontext bei Hintergrund pausieren (Akku + iOS-Regeln).
// Bekannte Plattformgrenze: auf iOS schaltet der Stummschalter am Gerät reine
// WebAudio-Ausgabe komplett ab – dafür gibt es keinen sauberen Workaround.
document.addEventListener('visibilitychange', () => {
  if (!AudioEngine.ctx) return;
  if (document.hidden) AudioEngine.ctx.suspend().catch(()=>{});
  else AudioEngine.resume();
});
function vibrate(pat){ try { if (navigator.vibrate) navigator.vibrate(pat); } catch(e){} }

// ------------------------------------------------ Input ----
const Input = {
  touching: false, startX: 0, startY: 0, x: 0, y: 0, id: null,
  keyLean: 0, keyDown: false, keyBrace: false,
  lean(){ // -1..1, relativ zum Aufsetzpunkt (Daumen-Okklusions-Fix)
    if (this.touching) return clamp((this.x - this.startX) / CFG.dragRange, -1, 1);
    return this.keyDown ? this.keyLean : 0;
  },
  brace(){
    if (this.touching){
      // Nur bei klar dominanter Abwärtsbewegung, sonst greift es beim Quer-Lenken
      const dy = this.y - this.startY;
      return dy > CFG.braceDy && dy > Math.abs(this.x - this.startX) * 0.7;
    }
    return this.keyDown && this.keyBrace;
  },
  held(){ return this.touching || this.keyDown; },
};
const cvs = document.getElementById('c');
function onDown(x, y, id){
  if (Input.touching) return;
  Input.touching = true; Input.id = id;
  Input.startX = Input.x = x; Input.startY = Input.y = y;
  AudioEngine.init(); AudioEngine.resume();
  Game.onPress();
}
function onMove(x, y, id){
  if (!Input.touching || id !== Input.id) return;
  Input.x = x; Input.y = y;
  // Driftender Anker: am Bildschirmrand bleibt voller Ausschlag erreichbar,
  // Richtungswechsel wirken sofort
  if (x - Input.startX > CFG.dragRange) Input.startX = x - CFG.dragRange;
  else if (x - Input.startX < -CFG.dragRange) Input.startX = x + CFG.dragRange;
  if (y - Input.startY > CFG.braceDy*3) Input.startY = y - CFG.braceDy*3;
  else if (y - Input.startY < -CFG.braceDy) Input.startY = y + CFG.braceDy;
}
function onUp(id){ if (Input.touching && id === Input.id){ Input.touching = false; Input.id = null; } }
cvs.addEventListener('pointerdown', e => { e.preventDefault(); onDown(e.clientX, e.clientY, e.pointerId); }, {passive:false});
window.addEventListener('pointermove', e => onMove(e.clientX, e.clientY, e.pointerId), {passive:true});
window.addEventListener('pointerup', e => onUp(e.pointerId));
window.addEventListener('pointercancel', e => onUp(e.pointerId));
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.code === 'Space' || e.code === 'ArrowUp'){ Input.keyDown = true; AudioEngine.init(); AudioEngine.resume(); Game.onPress(); }
  if (e.code === 'ArrowLeft') Input.keyLean = -1;
  if (e.code === 'ArrowRight') Input.keyLean = 1;
  if (e.code === 'ArrowDown') Input.keyBrace = true;
});
window.addEventListener('keyup', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') Input.keyDown = false;
  if (e.code === 'ArrowLeft' && Input.keyLean < 0) Input.keyLean = 0;
  if (e.code === 'ArrowRight' && Input.keyLean > 0) Input.keyLean = 0;
  if (e.code === 'ArrowDown') Input.keyBrace = false;
});

// ------------------------------------------------ Sim ----
/* Deterministischer Kern. Input pro 2 Frames (30 Hz) als Byte:
   Bits 0-3: Lean quantisiert (0..14, 7 = neutral), Bit 4: gehalten, Bit 5: Abstützen.
   Grobe Quantisierung => RLE komprimiert gut => kurze Ghost-URLs.
   Player-Sim zeichnet auf, Ghost-Sim spielt ab. */
class Sim {
  constructor(seed, opts = {}){
    this.seed = seed >>> 0;
    this.rng = mulberry32(this.seed);
    this.assist = opts.assist || 0;
    this.playback = opts.playback || null;
    this.record = !opts.playback;
    this.track = [];
    this.frame = 0;
    this.theta = 0; this.omega = 0;
    this.h = 0; this.climbPhase = 0;
    this.alive = true; this.deathCause = null;
    this.idleT = 0; this.idleAmp = 0;
    // Wind
    this.windAmb = 0; this.gust = null; this.nextGustAt = 4 + this.rng()*2;
    this.gustWarnLeft = 0; this.warned = false;
    this.pendingDir = 1; this.pendingMag = 0;
    this.time = 0;
    // Gerald
    this.gerald = null; this.nextGeraldAt = 20 + this.rng()*14; this.geraldWasRecent = 0;
    // Flaggen
    this.flagsPlanted = []; this.planting = 0; this.braceT = 0; this.flagBand = null; this.lastBand = null;
    this.braceEdgeInBand = false; this.idleWarned = false; this.capH = null;
    // abgeleitete Werte für Renderer / Events für Sound
    this.curU = 0; this.curHeld = false; this.curBrace = false;
    this.events = [];
  }
  landmarkAt(h){
    for (const b of CFG.flagBandsBase) if (Math.abs(h-b) <= 2) return b;
    if (h > 102){ const n = Math.round(h/CFG.flagEvery)*CFG.flagEvery;
      if (n > 100 && Math.abs(h-n) <= 2) return n; }
    return null;
  }
  inputByte(){
    if (this.playback) return (this.frame>>1) < this.playback.length ? this.playback[this.frame>>1] : 7;
    const q = clamp(Math.round(Input.lean()*7)+7, 0, 14);
    return q | (Input.held()?16:0) | (Input.brace()?32:0);
  }
  step(){
    const dt = CFG.dt;
    if (!this.alive) return;
    // Input nur jeden 2. Frame neu lesen (30 Hz, deterministisch, quantisiert)
    if (this.frame % 2 === 0){
      const b = this.inputByte();
      if (this.record){
        if (this.track.length < CFG.maxRecFrames) this.track.push(b);
        else if (this.capH === null) this.capH = this.h; // Ghost endet hier
      }
      const nb = !!(b & 32);
      // Flagge nur nach FRISCHEM Runterziehen im Band (kein verschleppter Brace)
      if (nb && !this.curBrace) this.braceEdgeInBand = this.landmarkAt(this.h) !== null;
      else if (!nb) this.braceEdgeInBand = false;
      this.curU = ((b & 15) - 7) / 7;
      this.curHeld = !!(b & 16);
      this.curBrace = nb;
    }
    this.frame++; this.time += dt;
    const h = this.h, held = this.curHeld;
    const brace = this.curBrace && held;
    const planting = this.planting > 0;

    // --- Klettern
    const climbing = held && !brace && !planting;
    if (climbing){
      const prev = this.h;
      this.h += CFG.climbSpeed * dt;
      this.climbPhase += CFG.climbSpeed * dt * 2.2;
      if (((prev*2)|0) !== ((this.h*2)|0)) this.events.push({t:'rung'});
    }
    // --- Stillstands-Ratchet ("der Wind findet dich")
    if (!climbing && !planting){
      this.idleT += dt;
      if (this.idleT > 0.6){
        // wächst nach dem Cap langsam weiter: Dauer-Campen kippt IMMER irgendwann
        this.idleAmp = this.idleAmp < CFG.idleMax
          ? Math.min(CFG.idleMax, this.idleAmp + CFG.idleRatchet*dt)
          : this.idleAmp + 0.08*dt;
        if (!this.idleWarned && this.idleAmp > 0.5){ this.idleWarned = true; this.events.push({t:'idlewarn'}); }
      }
    } else { this.idleT = 0; this.idleAmp = Math.max(0, this.idleAmp - 2.5*dt);
      if (this.idleAmp === 0) this.idleWarned = false; }

    // --- Wind: Ambient + Turbulenz + geplante Böen (alles aus dem Seed)
    this.windAmb = Math.sin(this.time*0.7 + this.seed%10) * (0.05 + h*0.0016);
    if (h > 40) // Turbulenz in der Höhe: mehrere überlagerte Frequenzen
      this.windAmb += (Math.sin(this.time*2.3 + this.seed%7) + Math.sin(this.time*3.7)) * Math.min(0.09, (h-40)*0.0011);
    if (!this.gust && !this.warned && this.time >= this.nextGustAt - CFG.gustWarn){
      this.warned = true; this.gustWarnLeft = CFG.gustWarn;
      this.pendingDir = this.rng() < 0.5 ? -1 : 1;
      this.pendingMag = (0.16 + Math.min(0.55, h*0.005) + this.rng()*0.12) * (1 - this.assist*0.45);
      this.events.push({t:'gustwarn', dir: this.pendingDir});
    }
    if (this.warned && !this.gust){
      this.gustWarnLeft -= dt;
      if (this.gustWarnLeft <= 0){
        this.gust = { dir: this.pendingDir, mag: this.pendingMag, left: 1.2 + this.rng()*1.4 };
        this.events.push({t:'gust'});
      }
    }
    let windTq = this.windAmb * (1 + this.idleAmp);
    if (this.gust){
      windTq += this.gust.dir * this.gust.mag;
      this.gust.left -= dt;
      if (this.gust.left <= 0){ this.gust = null; this.warned = false;
        // Böen rücken mit der Höhe enger zusammen
        const spacing = clamp(1 - h/220, 0.4, 1);
        this.nextGustAt = this.time + (3.2 + this.rng()*4.2) * spacing; }
    }
    if (this.idleAmp > 0) windTq += Math.sin(this.time*5.3) * this.idleAmp * 0.14;

    // --- Gerald 🕊️
    if (!this.gerald && h >= CFG.geraldMinH && this.time >= this.nextGeraldAt){
      this.gerald = { phase:'approach', t:0, dir: this.rng()<0.5?-1:1, shake:0 };
      this.events.push({t:'geraldIn', dir:this.gerald.dir});
    }
    if (this.gerald){
      const g = this.gerald; g.t += dt;
      if (g.phase === 'approach'){ if (g.t > 1.2){ g.phase='landed'; g.t=0; this.events.push({t:'geraldLand'}); } }
      else if (g.phase === 'landed'){
        windTq += g.dir * 0.30;
        this.geraldWasRecent = 1.0;
        // Gegenlehnen schüttelt ihn ab
        if (this.curU * g.dir < -0.45) g.shake += dt; else g.shake = Math.max(0, g.shake - dt*0.5);
        if (g.shake > 0.4 || g.t > 3.5){ g.phase='leave'; g.t=0; this.events.push({t:'geraldOut'}); }
      }
      else if (g.phase === 'leave'){ if (g.t > 0.8){ this.gerald = null;
        this.nextGeraldAt = this.time + 14 + this.rng()*16; } }
    }
    this.geraldWasRecent = Math.max(0, this.geraldWasRecent - dt);

    // --- Flaggen-Banking (Abstützen im Landmark-Band startet Pflanzen)
    this.flagBand = this.landmarkAt(h);
    const bandFree = this.flagBand !== null && !this.flagsPlanted.includes(this.flagBand);
    if (planting){
      this.planting -= dt;
      if (this.planting <= 0){
        this.flagsPlanted.push(this.lastBand);
        this.events.push({t:'flagDone', at: this.lastBand});
      }
    } else if (bandFree && brace && this.braceEdgeInBand){
      this.braceT += dt;
      if (this.braceT >= CFG.flagHold){
        this.planting = CFG.flagPlant; this.lastBand = this.flagBand;
        this.braceT = 0; this.events.push({t:'flagStart'});
      }
    } else this.braceT = 0;

    // --- Pendel (invertiert; L wächst mit der Höhe -> träger, Wind wird stärker)
    const L = CFG.baseLen + h;
    const gravScale = (CFG.gravFloor + (1-CFG.gravFloor)*Math.min(1, h/CFG.gravRampH))
      * (1 + Math.min(1, h/150)) * (1 - this.assist*0.35);
    let alpha = (CFG.grav / L) * Math.sin(this.theta) * gravScale + windTq;
    if (climbing) alpha += Math.sin(this.climbPhase*3.1) * CFG.climbBob / Math.sqrt(L);
    if (planting) alpha *= 1.5;                 // beide Hände an der Flagge
    else if (held){
      const auth = CFG.ctrl / (10 + h*0.35) * (brace ? CFG.braceCtrl : 1);
      this.omega -= this.curU * auth * dt;
    }
    this.omega += alpha * dt;
    this.omega -= this.omega * CFG.damp * dt;
    this.omega = clamp(this.omega, -3, 3);
    this.theta += this.omega * dt;

    // --- Sturz
    if (Math.abs(this.theta) > CFG.fallAngle){
      this.alive = false;
      this.deathCause = planting ? 'flag'
        : this.geraldWasRecent > 0 ? 'gerald'
        : this.idleAmp > 1 ? 'idle'
        : (this.gust || this.warned) ? 'wind' : 'balance';
      this.events.push({t:'fall'});
    }
  }
  takeEvents(){ const e = this.events; this.events = []; return e; }
}

// ------------------------------------------------ Ghost-Link ----
function encodeGhost(d){
  const rle = rleEnc(d.track);
  // Bei gekappter Aufnahme nur die tatsächlich replaybare Höhe versprechen
  const hEff = (d.capH !== null && d.capH !== undefined) ? Math.min(d.h, d.capH) : d.h;
  const h10 = Math.round(hEff*10);
  const bytes = [1, d.mode === 'daily' ? 1 : 0,
    d.seed & 255, (d.seed>>>8)&255, (d.seed>>>16)&255, (d.seed>>>24)&255,
    h10 & 255, (h10>>>8)&255,
    Math.round((d.assist||0)*100)];
  return b64uEnc(bytes.concat(rle));
}
function decodeGhost(str){
  try {
    const b = b64uDec(str);
    if (b[0] !== 1) return null;
    const seed = (b[2] | b[3]<<8 | b[4]<<16 | b[5]<<24) >>> 0;
    const height = (b[6] | b[7]<<8) / 10;
    const assist = clamp(b[8]/100, 0, 1);
    const track = rleDec(Array.from(b.slice(9)));
    return { seed, height, assist, track, daily: b[1]===1 };
  } catch(e){ return null; }
}

/* ---- Farb- und Formsprache ----
   Nach Recherche der Mobile-Charts (Block Blast, Subway Surfers, Royal Match,
   Voodoo-Titel): kräftige Sättigung auf der Spielebene, ruhiger Hintergrund,
   EINE durchgehende dunkle Kontur, dicke runde Formen. Nie reines Schwarz. */
const PAL = {
  ink:      '#241209',   // warme Kontur für alle Spielobjekte
  inkSoft:  '#3A1F0E',
  rail:     '#D97012',   // Leiter Grundton
  railLit:  '#FFB13D',   // Lichtseite
  rung:     '#FFC96B',
  railGold: '#FFD84D', railGoldLit: '#FFA412',
  suit:     '#FF5A1F', suitDark: '#C7350A',
  skin:     '#FFD2A6',
  helmet:   '#FFFFFF', helmetStripe: '#FF2D55',
  safe:     '#22E06B', warn: '#FFB020', danger: '#FF2E4D',
  gold:     '#FFD84D',
  ghost:    '#B7A6FF', ghostDark: '#6B57C4',
};
// Eine Kontur-Breite für alles: uneinheitliche Strichstärken sind laut
// Recherche das häufigste Erkennungsmerkmal von Amateur-2D-Grafik.
const ow = s => Math.max(2.5, 3*s);

// Partikel-Pool (harte Obergrenze -> 60 fps auf Mid-Range)
const POOL_N = 420;
const pool = Array.from({length:POOL_N}, ()=>({on:false,x:0,y:0,vx:0,vy:0,life:0,max:1,
  size:2,col:'#fff',grav:0,shape:0,rot:0,spin:0,drag:0}));
let poolIdx = 0;
function spawnP(x,y,vx,vy,life,size,col,grav=0,shape=0,drag=0){
  const p = pool[poolIdx]; poolIdx = (poolIdx+1)%POOL_N;
  p.on=true; p.x=x; p.y=y; p.vx=vx; p.vy=vy; p.life=life; p.max=life; p.size=size; p.col=col;
  p.grav=grav; p.shape=shape; p.rot=Math.random()*6.28; p.spin=(Math.random()-0.5)*10; p.drag=drag;
}
function stepDrawParticles(dt){
  for (const p of pool){ if (!p.on) continue;
    p.life -= dt; if (p.life<=0){ p.on=false; continue; }
    if (p.drag){ const f = Math.max(0, 1 - p.drag*dt); p.vx *= f; p.vy *= f; }
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += p.grav*dt; p.rot += p.spin*dt;
    ctx.globalAlpha = Math.min(1, p.life/p.max*1.6);
    ctx.fillStyle = p.col;
    const s = p.size * Math.min(1, 0.35 + p.life/p.max);
    if (p.shape === 0){                       // Kreis
      ctx.beginPath(); ctx.arc(p.x, p.y, s*0.5, 0, 7); ctx.fill();
    } else if (p.shape === 1){                // Vierzack-Stern
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.beginPath();
      for (let i=0;i<8;i++){ const r = i%2 ? s*0.22 : s*0.6, a = i*Math.PI/4;
        i ? ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r) : ctx.moveTo(Math.cos(a)*r, Math.sin(a)*r); }
      ctx.closePath(); ctx.fill(); ctx.restore();
    } else {                                  // Splitter / Feder
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillRect(-s*0.5, -s*0.18, s, s*0.36); ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
}
// Bündel aus Rückmeldungen: laut Recherche feuern Chart-Titel 5-8 Reaktionen
// innerhalb von ~100 ms (Blitz, Shake, Hit-Stop, Partikel, Ton, Haptik).
const FX = { flash: 0, flashCol: '#fff', hitStop: 0, shake: 0, shakeT: 0, shakeMax: 0 };
function punch(o){
  if (o.flash){ FX.flash = o.flashT || 0.08; FX.flashA = o.flash; FX.flashCol = o.flashCol || '#fff'; }
  if (o.shake){ FX.shake = o.shake; FX.shakeT = o.shakeDur || 0.09; FX.shakeMax = o.shakeDur || 0.09; }
  if (o.hitStop) FX.hitStop = o.hitStop;
}

// Deko (Gebäude, Wolken, Sterne) – rein visuell, eigener RNG
const visRng = mulberry32(1337);
const farCity = Array.from({length:22}, (_,i)=>({ x:(i-11)*46 + visRng()*30, w:26+visRng()*36, h:14+visRng()*46 }));
const buildings = Array.from({length:14}, (_,i)=>({ x:(i-7)*74 + visRng()*40, w:44+visRng()*52, h:26+visRng()*84, c:visRng(), tone:visRng(), ant:visRng()<0.35 }));
const clouds = Array.from({length:14}, ()=>({ wx:(visRng()-0.5)*24, wy:26+visRng()*52, s:30+visRng()*50, sp:3+visRng()*7 }));
const cloudsFar = Array.from({length:10}, ()=>({ wx:(visRng()-0.5)*24, wy:30+visRng()*48, s:46+visRng()*60, sp:1+visRng()*2.5 }));
const stars = Array.from({length:110}, ()=>({ x:visRng(), y:visRng(), s:0.5+visRng()*1.8, tw:visRng()*6 }));
let vigCache = { key:'', cvs:null };
function vignette(){
  const key = W+'_'+H;
  if (vigCache.key !== key){
    const oc = document.createElement('canvas'); oc.width = W; oc.height = H;
    const c = oc.getContext('2d');
    // Dezent: eine starke Vignette entsättigt das ganze Bild
    const r = c.createRadialGradient(W/2, H*0.45, Math.min(W,H)*0.45, W/2, H*0.5, Math.max(W,H)*0.75);
    r.addColorStop(0, 'rgba(0,0,0,0)'); r.addColorStop(1, 'rgba(20,10,50,0.14)');
    c.fillStyle = r; c.fillRect(0,0,W,H);
    // Scrim oben: Höhenzähler bleibt immer lesbar
    const s = c.createLinearGradient(0,0,0,130);
    s.addColorStop(0, 'rgba(4,6,18,0.42)'); s.addColorStop(1, 'rgba(4,6,18,0)');
    c.fillStyle = s; c.fillRect(0,0,W,130);
    vigCache = { key, cvs: oc };
  }
  ctx.drawImage(vigCache.cvs, 0, 0);
}

function skyColors(h){
  // Kräftige, klar getrennte Stufen statt Pastell: jede Höhenzone soll wie
  // eine eigene "Welt" wirken (Block-Blast-Prinzip der Tier-Reskins).
  const stops = [
    [0,   [79,195,255],  [255,233,168]],   // Dächer
    [25,  [47,168,255],  [255,179,122]],
    [50,  [45,107,255],  [201,155,255]],   // Wolken
    [75,  [43,27,168],   [123,91,255]],    // Jetstream
    [100, [18,9,63],     [74,42,160]],     // Weltraum
    [160, [7,3,31],      [27,15,77]],
  ];
  let a=stops[stops.length-1], b=stops[stops.length-1];
  for (let i=0;i<stops.length-1;i++) if (h>=stops[i][0] && h<=stops[i+1][0]){ a=stops[i]; b=stops[i+1]; break; }
  const t = clamp((h-a[0])/Math.max(1,b[0]-a[0]),0,1);
  const mix = (u,v)=> u.map((c,i)=> Math.round(lerp(c, v[i], t)));
  return [mix(a[1],b[1]), mix(a[2],b[2])];
}
const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;

// Kamera: ppm = Pixel pro Meter, (cx,cy) = Weltpunkt in Bildschirmmitte
const cam = { ppm: 60, cx: 0, cy: 2, shake: 0 };
let skyCache = { key: '', grad: null };
function worldToScreen(wx, wy){
  return [ W/2 + (wx - cam.cx)*cam.ppm, H*0.62 - (wy - cam.cy)*cam.ppm ];
}

function drawScene(sim, ghost, t){
  const h = sim.h;
  // Gradient nur bei Höhen-/Größenänderung neu bauen (Per-Frame-Allokation sparen)
  const skyKey = ((h*2)|0) + '_' + H;
  const [top, bot] = skyColors(h);   // bot tönt auch die Silhouettenbänder
  if (skyCache.key !== skyKey){
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, rgb(top)); g.addColorStop(1, rgb(bot));
    skyCache = { key: skyKey, grad: g };
  }
  ctx.fillStyle = skyCache.grad; ctx.fillRect(0,0,W,H);

  // Sonne (unten) bzw. Mond (oben)
  const sunA = clamp(1 - h/65, 0, 1);
  if (sunA > 0){
    const sx = W*0.78, sy = H*0.2;
    const glow = ctx.createRadialGradient(sx, sy, 4, sx, sy, 130);
    glow.addColorStop(0, `rgba(255,244,200,${0.85*sunA})`);
    glow.addColorStop(0.25, `rgba(255,220,150,${0.4*sunA})`);
    glow.addColorStop(1, 'rgba(255,210,140,0)');
    ctx.fillStyle = glow; ctx.fillRect(sx-130, sy-130, 260, 260);
    ctx.fillStyle = `rgba(255,250,225,${0.95*sunA})`;
    ctx.beginPath(); ctx.arc(sx, sy, 26, 0, 7); ctx.fill();
  }
  if (h > 70){
    const a = clamp((h-70)/30, 0, 1);
    for (const s of stars){
      ctx.globalAlpha = a * (0.4 + 0.6*Math.abs(Math.sin(t*0.8+s.tw)));
      ctx.fillStyle = '#fff';
      ctx.fillRect(s.x*W, s.y*H*0.9, s.s, s.s);
    }
    // Mond mit Sichel-Schatten
    ctx.globalAlpha = a;
    const mx = W*0.22, my = H*0.16;
    ctx.fillStyle = '#f4f0e2';
    ctx.beginPath(); ctx.arc(mx, my, 22, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(20,24,60,0.85)';
    ctx.beginPath(); ctx.arc(mx-9, my-4, 19, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
  }
  const shX = (Math.random()-0.5)*cam.shake, shY = (Math.random()-0.5)*cam.shake;
  ctx.save(); ctx.translate(shX, shY);

  // Boden + Stadt: flache Silhouettenbänder statt grauem Detailbrei.
  // Die Bänder werden aus der aktuellen Himmelsfarbe getönt, bleiben also
  // immer als Hintergrund lesbar und konkurrieren nie mit der Spielebene.
  const gy0 = worldToScreen(0, 0)[1];
  if (gy0 < H + 260){
    const mix = (c, t) => `rgb(${Math.round(lerp(c[0],43,t))},${Math.round(lerp(c[1],27,t))},${Math.round(lerp(c[2],79,t))})`;
    // Ferne Silhouette (25 % abgedunkelt, halbe Parallaxe, keine Fenster)
    ctx.fillStyle = mix(bot, 0.25);
    for (const b of farCity){
      const bh = b.h * cam.ppm/60;
      ctx.fillRect(W/2 + b.x*1.6 - cam.cx*cam.ppm*0.45, gy0-bh, b.w, bh+6);
    }
    // Mittlere Silhouette (45 %)
    ctx.fillStyle = mix(bot, 0.45);
    for (const b of farCity){
      const bh = b.h * 0.72 * cam.ppm/60;
      ctx.fillRect(W/2 + b.x*1.1 - cam.cx*cam.ppm*0.65 + 30, gy0-bh, b.w*0.9, bh+6);
    }
    // Boden
    const gnd = ctx.createLinearGradient(0, gy0, 0, gy0+140);
    gnd.addColorStop(0, '#3EA65B'); gnd.addColorStop(1, '#1F6B39');
    ctx.fillStyle = gnd;
    ctx.fillRect(0, gy0, W, Math.max(0, H-gy0)+260);
    // Nahe Silhouette (65 %) mit EINER warmen Fensterfarbe
    const near = mix(bot, 0.65);
    for (const b of buildings){
      const bx = W/2 + b.x - cam.cx*cam.ppm*0.85;
      const bh = b.h * cam.ppm/60;
      ctx.fillStyle = near;
      ctx.fillRect(bx, gy0-bh, b.w, bh);
      if (b.ant){ ctx.fillStyle = near; ctx.fillRect(bx+b.w*0.5-1.5, gy0-bh-14, 3, 14); }
      ctx.fillStyle = 'rgba(255,198,41,0.6)';
      for (let wy=10; wy<bh-8; wy+=16) for (let wx=8; wx<b.w-10; wx+=15)
        if (((wx*7+wy*13+((b.c*100)|0))|0)%3===0) ctx.fillRect(bx+wx, gy0-bh+wy, 5, 7);
    }
  }
  // Wolken: ferne Schicht (langsam, blass) + nahe Schicht
  for (const c of cloudsFar){
    const cy = worldToScreen(0, c.wy)[1];
    if (cy < -90 || cy > H+90) continue;
    const x = (((c.wx*cam.ppm + W/2 + t*c.sp*8 - cam.cx*cam.ppm*0.35) % (W+340)) + (W+340)) % (W+340) - 170;
    ctx.fillStyle = 'rgba(255,255,255,0.34)';
    ctx.beginPath();
    ctx.ellipse(x, cy, c.s*0.9, c.s*0.42, 0, 0, 7);
    ctx.ellipse(x+c.s*0.6, cy-c.s*0.1, c.s*0.55, c.s*0.32, 0, 0, 7);
    ctx.ellipse(x-c.s*0.55, cy+c.s*0.05, c.s*0.5, c.s*0.28, 0, 0, 7);
    ctx.fill();
  }
  for (const c of clouds){
    const cy = worldToScreen(0, c.wy)[1];
    if (cy < -80 || cy > H+80) continue;
    const x = (((c.wx*cam.ppm + W/2 + t*c.sp*8 - cam.cx*cam.ppm*0.7) % (W+300)) + (W+300)) % (W+300) - 150;
    // Dichte Wolkenblöcke: Schattensockel + strahlend weiße Kappe
    ctx.fillStyle = 'rgba(176,196,236,0.9)';
    ctx.beginPath();
    ctx.ellipse(x+2, cy+c.s*0.16, c.s*1.0, c.s*0.42, 0, 0, 7);
    ctx.ellipse(x+c.s*0.62, cy+c.s*0.2, c.s*0.6, c.s*0.32, 0, 0, 7);
    ctx.fill();
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath();
    ctx.ellipse(x, cy, c.s*0.96, c.s*0.44, 0, 0, 7);
    ctx.ellipse(x+c.s*0.58, cy-c.s*0.14, c.s*0.6, c.s*0.34, 0, 0, 7);
    ctx.ellipse(x-c.s*0.54, cy+c.s*0.02, c.s*0.5, c.s*0.3, 0, 0, 7);
    ctx.fill();
  }
  // Jetstream-Streifen
  if (h > 58 && h < 112){
    ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 2;
    for (let i=0;i<5;i++){
      const ly = worldToScreen(0, 72 + i*6)[1];
      if (ly<-20||ly>H+20) continue;
      const off = (t*90 + i*140) % (W+240) - 120;
      ctx.beginPath(); ctx.moveTo(off-70, ly); ctx.lineTo(off+70, ly); ctx.stroke();
    }
  }

  // PB-Goldlinie
  if (SAVE.pb > 2){
    const py = worldToScreen(0, SAVE.pb)[1];
    if (py > -30 && py < H+30){
      ctx.strokeStyle = '#ffd76a'; ctx.lineWidth = 2; ctx.setLineDash([10,8]);
      ctx.beginPath(); ctx.moveTo(0,py); ctx.lineTo(W,py); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = '#ffd76a'; ctx.font = '700 13px system-ui'; ctx.textAlign='right';
      ctx.fillText('PB ' + SAVE.pb.toFixed(0) + ' m', W-10, py-6);
    }
  }
  // Ghost-Ziellinie
  if (ghost && Game.ghostData){
    const gy = worldToScreen(0, Game.ghostData.height)[1];
    if (gy > -30 && gy < H+30){
      ctx.strokeStyle = 'rgba(183,166,255,0.8)'; ctx.lineWidth = 2; ctx.setLineDash([4,6]);
      ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(W,gy); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = '#b7a6ff'; ctx.font = '700 13px system-ui'; ctx.textAlign='left';
      ctx.fillText('👻 ' + Game.ghostData.height.toFixed(0) + ' m', 10, gy-6);
    }
  }
  // Landmark-Linien + Pill-Labels
  ctx.textAlign = 'left';
  const marks = CFG.flagBandsBase.concat([150,200,250,300,400,500]);
  ctx.font = '800 11px system-ui';
  for (const m of marks){
    const my = worldToScreen(0, m)[1];
    if (my < -30 || my > H+30) continue;
    ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth=1; ctx.setLineDash([3,9]);
    ctx.beginPath(); ctx.moveTo(0,my); ctx.lineTo(W,my); ctx.stroke(); ctx.setLineDash([]);
    if (my < Game.meterY + 26) continue;   // nicht unter den HUD-Kopf schieben
    const label = (LANDMARKS[m] || ('SEKTOR ' + (m/50))) + '  ' + m + ' m';
    const tw = ctx.measureText(label).width;
    ctx.fillStyle = 'rgba(10,15,34,0.42)';
    ctx.beginPath(); ctx.roundRect(10, my-18, tw+18, 17, 9); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.82)';
    ctx.fillText(label, 19, my-6);
  }

  // Ghost zuerst (hinter dem Spieler)
  if (ghost && ghost.visible) drawLadderClimber(ghost.sim, t, { alpha: 0.32, ghost: true });
  drawLadderClimber(sim, t, { alpha: 1, hideClimber: RAG.on });
  if (RAG.on) drawRagdoll(t);

  ctx.restore();
  vignette();
}

function drawLadderClimber(sim, t, style){
  const th = sim.theta;
  const sin = Math.sin(th), cos = Math.cos(th);
  const ladderTop = sim.h + 1.6;
  const gxOff = style.ghost ? 0.9 : 0;
  const pt = s => worldToScreen(sin*s + gxOff, cos*s);
  ctx.globalAlpha = style.alpha;

  const gold = SAVE.unlocked.gold && !style.ghost;
  const railDark  = style.ghost ? PAL.ghostDark : (gold ? PAL.railGoldLit : PAL.rail);
  const railLight = style.ghost ? PAL.ghost : (gold ? PAL.railGold : PAL.railLit);
  const railOff = 0.34;                 // dickere Leiter: hält die Silhouette
  const S = Math.max(0.5, cam.ppm/60);  // eine Skala für alle Konturbreiten
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // Warmes Rimlight in der Höhe, damit die Leiter vor dem Nachthimmel steht
  const rim = clamp((sim.h-45)/60, 0, 1) * (style.ghost ? 0.25 : 0.6);
  if (rim > 0.02){
    ctx.strokeStyle = style.ghost ? `rgba(183,166,255,${rim*0.5})` : `rgba(255,183,110,${rim*0.35})`;
    ctx.lineWidth = Math.max(6, cam.ppm*0.22);
    const [ax,ay] = worldToScreen(gxOff, 0);
    const [bx,by] = worldToScreen(sin*ladderTop + gxOff, cos*ladderTop);
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
  }
  // Bodenschatten der Leiter (nur in Bodennähe sichtbar)
  if (!style.ghost){
    const shA = clamp(1 - sim.h/40, 0, 1) * 0.28;
    if (shA > 0){
      const [bx0, by0] = worldToScreen(gxOff, 0);
      ctx.fillStyle = `rgba(10,20,10,${shA})`;
      ctx.beginPath();
      ctx.ellipse(bx0 + sin*cam.ppm*0.8, by0 + cam.ppm*0.06, cam.ppm*0.9, cam.ppm*0.14, 0, 0, 7);
      ctx.fill();
    }
  }
  // Holme: Kontur -> Grundton -> Lichtkante. Achse (sinθ·s, cosθ·s),
  // Querversatz senkrecht dazu = (cosθ, -sinθ)·off
  const railPts = off => {
    const [ax,ay] = worldToScreen(cos*off + gxOff, -sin*off);
    const [bx,by] = worldToScreen(sin*ladderTop + cos*off + gxOff, cos*ladderTop - sin*off);
    return [ax,ay,bx,by];
  };
  const halfSpan = H/cam.ppm;
  const visBottom = Math.max(0, cam.cy - halfSpan);
  const visTop = Math.min(ladderTop, cam.cy + halfSpan);
  const rungPath = () => {
    ctx.beginPath();
    for (let s = Math.ceil(visBottom*2)/2; s <= visTop; s += 0.5){
      const [x1,y1] = worldToScreen(sin*s + cos*railOff + gxOff, cos*s - sin*railOff);
      const [x2,y2] = worldToScreen(sin*s - cos*railOff + gxOff, cos*s + sin*railOff);
      ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
    }
  };
  // 1. Durchgang: gemeinsame Kontur unter allem
  if (!style.ghost){
    ctx.strokeStyle = PAL.ink;
    ctx.lineWidth = Math.max(4, cam.ppm*0.135);
    for (const off of [-railOff, railOff]){
      const p = railPts(off);
      ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.lineTo(p[2],p[3]); ctx.stroke();
    }
    ctx.lineWidth = Math.max(3, cam.ppm*0.105); rungPath(); ctx.stroke();
  }
  // 2. Grundton
  ctx.strokeStyle = railDark;
  ctx.lineWidth = Math.max(2.6, cam.ppm*0.095);
  for (const off of [-railOff, railOff]){
    const p = railPts(off);
    ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.lineTo(p[2],p[3]); ctx.stroke();
  }
  ctx.lineWidth = Math.max(2, cam.ppm*0.07); rungPath(); ctx.stroke();
  // 3. Lichtkante (Glanzstreifen) – gibt der Leiter Volumen
  ctx.strokeStyle = railLight;
  ctx.lineWidth = Math.max(1.2, cam.ppm*0.036);
  ctx.globalAlpha = style.alpha * 0.9;
  for (const off of [-railOff, railOff]){
    const p = railPts(off);
    ctx.beginPath(); ctx.moveTo(p[0]-1.5,p[1]); ctx.lineTo(p[2]-1.5,p[3]); ctx.stroke();
  }
  ctx.strokeStyle = style.ghost ? PAL.ghost : PAL.rung;
  ctx.lineWidth = Math.max(1, cam.ppm*0.03); rungPath(); ctx.stroke();
  ctx.globalAlpha = style.alpha;
  // Gepflanzte Flaggen (gezeichnet statt Emoji: einheitlich auf allen Geräten)
  for (const f of sim.flagsPlanted){
    const [fx,fy] = pt(f);
    if (fy < -30 || fy > H+30) continue;
    const fs = Math.max(8, cam.ppm*0.36);
    ctx.lineJoin = 'round';
    ctx.strokeStyle = PAL.ink; ctx.lineWidth = Math.max(2.5, fs*0.26);
    ctx.beginPath(); ctx.moveTo(fx+fs*0.6, fy); ctx.lineTo(fx+fs*0.6, fy-fs*1.6); ctx.stroke();
    ctx.strokeStyle = '#F2F5FF'; ctx.lineWidth = Math.max(1.2, fs*0.13);
    ctx.beginPath(); ctx.moveTo(fx+fs*0.6, fy); ctx.lineTo(fx+fs*0.6, fy-fs*1.6); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(fx+fs*0.6, fy-fs*1.6);
    ctx.lineTo(fx+fs*2.0, fy-fs*1.22);
    ctx.lineTo(fx+fs*0.6, fy-fs*0.84);
    ctx.closePath();
    ctx.strokeStyle = PAL.ink; ctx.lineWidth = Math.max(2, fs*0.2); ctx.stroke();
    ctx.fillStyle = style.ghost ? PAL.ghost : PAL.danger; ctx.fill();
  }
  // Kletterer (beim Sturz übernimmt der Ragdoll).
  // Proportionen ~1:3 (Kopf ein Drittel der Höhe) und große Cartoon-Augen:
  // beides laut Recherche entscheidend für Lesbarkeit auf Daumennagelgröße.
  if (style.hideClimber){ ctx.globalAlpha = 1; return; }
  const [cx2, cy2] = pt(sim.h);
  const s = Math.max(0.5, cam.ppm/60);
  ctx.save();
  ctx.translate(cx2, cy2);
  ctx.rotate(th*0.5 + (sim.curU||0)*0.3);
  const bob = Math.sin(sim.climbPhase*3.1)*3*s;
  const skin = style.ghost ? PAL.ghost : PAL.skin;
  const suit = style.ghost ? '#8f7ce0' : PAL.suit;
  const suitDark = style.ghost ? PAL.ghostDark : PAL.suitDark;
  const ink = style.ghost ? PAL.ghostDark : PAL.ink;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const line = (x1,y1,x2,y2,col,w) => {
    ctx.strokeStyle = ink; ctx.lineWidth = (w+3)*s;
    ctx.beginPath(); ctx.moveTo(x1*s,y1*s); ctx.lineTo(x2*s,y2*s); ctx.stroke();
    ctx.strokeStyle = col; ctx.lineWidth = w*s;
    ctx.beginPath(); ctx.moveTo(x1*s,y1*s); ctx.lineTo(x2*s,y2*s); ctx.stroke();
  };
  // Beine + Schuhe
  for (const leg of [[-3,-8,bob/s],[3,8,-bob/s]]){
    line(leg[0], 7, leg[1], 17 + leg[2], suit, 5.5);
    ctx.fillStyle = ink;
    ctx.beginPath(); ctx.arc(leg[1]*s, 17.5*s + leg[2]*s, 3.2*s, 0, 7); ctx.fill();
  }
  // Rucksack
  ctx.fillStyle = ink;
  ctx.beginPath(); ctx.roundRect(-12*s, -9*s, 7.5*s, 14*s, 3.5*s); ctx.fill();
  ctx.fillStyle = style.ghost ? '#5c4ab0' : '#A05A18';
  ctx.beginPath(); ctx.roundRect(-11*s, -8*s, 6*s, 12*s, 3*s); ctx.fill();
  // Rumpf: Kontur, Grundton, Lichtkante
  ctx.fillStyle = ink;
  ctx.beginPath(); ctx.roundRect(-8.5*s, -13*s, 17*s, 21*s, 7.5*s); ctx.fill();
  ctx.fillStyle = suitDark;
  ctx.beginPath(); ctx.roundRect(-7*s, -11.5*s, 14*s, 18.5*s, 6.5*s); ctx.fill();
  ctx.fillStyle = suit;
  ctx.beginPath(); ctx.roundRect(-7*s, -11.5*s, 14*s, 14*s, 6.5*s); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.beginPath(); ctx.roundRect(-6*s, -10.5*s, 4*s, 12*s, 2*s); ctx.fill();
  if (SAVE.unlocked.scarf && !style.ghost){
    line(0, -10, -11 - (sim.omega||0)*20, -2, '#E8323C', 4.5);
  }
  // Arme
  for (const arm of [[-5,-10,-bob/s],[5,10,bob/s]]){
    line(arm[0], -8, arm[1], -18 + arm[2], skin, 5);
  }
  // Kopf: großer Kreis mit Kontur
  ctx.fillStyle = ink;
  ctx.beginPath(); ctx.arc(0, -19*s, 9.6*s, 0, 7); ctx.fill();
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(0, -19*s, 8.2*s, 0, 7); ctx.fill();
  // Helm als klare Kuppel mit Streifen
  ctx.fillStyle = ink;
  ctx.beginPath(); ctx.arc(0, -20.2*s, 9.9*s, Math.PI*1.0, Math.PI*2.0); ctx.fill();
  ctx.fillStyle = style.ghost ? '#cabfff' : PAL.helmet;
  ctx.beginPath(); ctx.arc(0, -20.2*s, 8.6*s, Math.PI*1.02, Math.PI*1.98); ctx.fill();
  ctx.fillStyle = style.ghost ? '#8f7ce0' : PAL.helmetStripe;
  ctx.fillRect(-8.6*s, -22.6*s, 17.2*s, 2.8*s);
  ctx.fillStyle = ink;
  ctx.fillRect(-9.9*s, -20.6*s, 19.8*s, 1.6*s);   // Helmrand
  // Große Cartoon-Augen: weiße Sklera + Pupille, weiten sich bei Gefahr
  const panic = Math.abs(sim.theta)/CFG.fallAngle;
  const er = (panic > 0.55 ? 3.5 : 2.8) * s;
  for (const ex of [-3.4, 3.4]){
    ctx.fillStyle = ink;
    ctx.beginPath(); ctx.arc(ex*s, -17.5*s, er+1.1*s, 0, 7); ctx.fill();
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath(); ctx.arc(ex*s, -17.5*s, er, 0, 7); ctx.fill();
    ctx.fillStyle = ink;
    ctx.beginPath(); ctx.arc(ex*s + (sim.curU||0)*1.2*s, -17.5*s + (panic>0.55?0.6*s:0), er*0.52, 0, 7); ctx.fill();
  }
  if (panic > 0.55){    // Schrei-Mund
    ctx.fillStyle = ink;
    ctx.beginPath(); ctx.ellipse(0, -12.6*s, 2.6*s, 3.4*s, 0, 0, 7); ctx.fill();
  } else {
    ctx.strokeStyle = ink; ctx.lineWidth = 1.8*s;
    ctx.beginPath(); ctx.arc(0, -14.2*s, 2.6*s, 0.15*Math.PI, 0.85*Math.PI); ctx.stroke();
  }
  ctx.restore();

  // Gerald
  if (sim.gerald && !style.ghost){
    const gph = sim.gerald;
    let gx, gy;
    const [tx,ty] = pt(sim.h + 1.2);
    if (gph.phase === 'approach'){
      const p = clamp(gph.t/1.2, 0, 1);
      gx = lerp(gph.dir>0 ? W+60 : -60, tx + gph.dir*cam.ppm*0.32, p);
      gy = lerp(H*0.25, ty, p);
    } else if (gph.phase === 'landed'){
      gx = tx + gph.dir*cam.ppm*0.32; gy = ty + Math.sin(t*10)*1.5;
    } else {
      const p = clamp(gph.t/0.8, 0, 1);
      gx = lerp(tx + gph.dir*cam.ppm*0.32, gph.dir>0 ? W+80 : -80, p);
      gy = ty - p*H*0.3;
    }
    drawGerald(ctx, gx, gy, gph.dir, gph.phase, t, Math.max(0.8, cam.ppm/60));
  }
  ctx.globalAlpha = 1;
}
function drawGerald(c, x, y, dir, phase, t, s){
  c.save(); c.translate(x, y); c.scale(-dir*s, s);
  c.lineJoin = 'round'; c.lineCap = 'round';
  const flap = phase !== 'landed' ? Math.sin(t*22)*0.5 : 0;
  const ink = PAL.ink;
  // Alles zweistufig: erst Kontur, dann Füllung – eine Strichstärke für alles
  const shape = (fill, path) => {
    c.strokeStyle = ink; c.lineWidth = 3.4; path(); c.stroke();
    c.fillStyle = fill; path(); c.fill();
  };
  shape('#5C6B86', () => { c.beginPath(); c.moveTo(-8,-1); c.lineTo(-17,-6); c.lineTo(-16,2); c.closePath(); });
  shape('#8B9AB8', () => { c.beginPath(); c.ellipse(0, 0, 10.5, 7.5, 0, 0, 7); });
  c.fillStyle = '#D5DDEC';
  c.beginPath(); c.ellipse(1.5, 2.6, 7.5, 4.2, 0, 0, 7); c.fill();
  shape('#6E7E9C', () => { c.beginPath(); c.ellipse(-2, -2.5, 9, 4.6, -0.45 - flap, 0, 7); });
  c.fillStyle = 'rgba(255,255,255,0.3)';
  c.beginPath(); c.ellipse(-3, -3.5, 5.5, 2.4, -0.45 - flap, 0, 7); c.fill();
  shape('#7C8CAA', () => { c.beginPath(); c.arc(9, -5, 5, 0, 7); });
  c.fillStyle = 'rgba(90,230,160,0.45)';
  c.beginPath(); c.arc(8, -6.2, 3, 0, 7); c.fill();
  // Großes Auge: weiße Sklera, dunkle Pupille – auf Daumennagelgröße lesbar
  c.fillStyle = ink; c.beginPath(); c.arc(10.4, -5.8, 2.9, 0, 7); c.fill();
  c.fillStyle = '#FFFFFF'; c.beginPath(); c.arc(10.4, -5.8, 2.2, 0, 7); c.fill();
  c.fillStyle = PAL.danger; c.beginPath(); c.arc(10.8, -5.7, 1.3, 0, 7); c.fill();
  c.fillStyle = ink; c.beginPath(); c.arc(11.0, -5.6, 0.65, 0, 7); c.fill();
  shape('#FFB020', () => { c.beginPath(); c.moveTo(13.4,-5.9); c.lineTo(18.4,-4.4); c.lineTo(13.4,-2.9); c.closePath(); });
  if (phase === 'landed'){
    c.strokeStyle = '#FFB020'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(-2, 7); c.lineTo(-2, 9.6); c.moveTo(3, 7); c.lineTo(3, 9.6); c.stroke();
  }
  if (SAVE.unlocked.helm){
    shape(PAL.gold, () => { c.beginPath(); c.arc(9, -7.4, 5.2, Math.PI, 0); c.closePath(); });
    c.fillStyle = '#C98A00'; c.fillRect(3.8, -7.8, 10.4, 1.5);
  }
  c.restore();
}

// ------------------------------------------------ Ragdoll ----
/* Verlet-Ragdoll in Weltkoordinaten (Meter). Rein kosmetisch: die Simulation
   ist beim Sturz bereits beendet, der Ragdoll beeinflusst nichts mehr.
   Während des Kippens hängen die Hände an der Leiterspitze, kurz vor dem
   Aufschlag lässt er los und segelt frei. */
const RAG = {
  on:false, pts:null, cons:null, pinned:false, acc:0, t:0, landed:false, dizzy:0,
  spawn(sim){
    const sin = Math.sin(sim.theta), cos = Math.cos(sim.theta);
    const bx = sin*sim.h, by = cos*sim.h;
    const P = (up, side, r) => {
      const x = bx + sin*up + cos*side, y = by + cos*up - sin*side;
      return { x, y, px:x, py:y, r };
    };
    this.pts = [
      P( 0.58,  0.00, 0.115), // 0 Kopf
      P( 0.36,  0.00, 0.095), // 1 Brust
      P( 0.06,  0.00, 0.085), // 2 Hüfte
      P( 0.72, -0.15, 0.055), // 3 Hand links
      P( 0.72,  0.15, 0.055), // 4 Hand rechts
      P(-0.26, -0.10, 0.065), // 5 Fuß links
      P(-0.26,  0.10, 0.065), // 6 Fuß rechts
    ];
    const L = (a,b,stiff=1) => ({ a, b, stiff,
      len: Math.hypot(this.pts[a].x-this.pts[b].x, this.pts[a].y-this.pts[b].y) });
    this.cons = [L(0,1), L(1,2), L(1,3,0.85), L(1,4,0.85), L(2,5,0.85), L(2,6,0.85),
                 L(0,2,0.45), L(3,4,0.2), L(5,6,0.2)];
    // Startschwung aus der Drehbewegung der Leiterspitze
    const vt = clamp(sim.omega, -3, 3) * sim.h * CFG.dt * 0.5;
    for (const p of this.pts){ p.px = p.x - cos*vt; p.py = p.y + sin*vt; }
    this.on = true; this.pinned = true; this.acc = 0; this.t = 0; this.landed = false; this.dizzy = 0;
  },
  step(dt, sim){
    if (!this.on) return;
    this.t += dt;
    // Er reitet die Leiter bis kurz vor dem Aufschlag hinunter und wird dann
    // weggeschleudert – deutlich lustiger (und schneller) als freier Fall aus 100 m.
    if (this.pinned && sim && Math.abs(sim.theta) > 1.42){
      this.pinned = false;
      AudioEngine.letGo();
      const vmax = 0.32;                          // m pro Verlet-Schritt (~19 m/s)
      for (const p of this.pts){
        let vx = p.x - p.px, vy = p.y - p.py;
        const v = Math.hypot(vx, vy);
        if (v > vmax){ vx = vx/v*vmax; vy = vy/v*vmax; p.px = p.x - vx; p.py = p.y - vy; }
      }
    }
    const G = 24;
    for (const p of this.pts){
      const vx = (p.x - p.px) * 0.994, vy = (p.y - p.py) * 0.994;
      p.px = p.x; p.py = p.y;
      p.x += vx; p.y += vy - G*dt*dt;
    }
    for (let it = 0; it < 4; it++){
      for (const c of this.cons){
        const a = this.pts[c.a], b = this.pts[c.b];
        const dx = b.x-a.x, dy = b.y-a.y;
        const d = Math.hypot(dx, dy) || 1e-6;
        const f = (d - c.len)/d * 0.5 * c.stiff;
        a.x += dx*f; a.y += dy*f; b.x -= dx*f; b.y -= dy*f;
      }
      if (this.pinned && sim){
        const sin = Math.sin(sim.theta), cos = Math.cos(sim.theta);
        const tx = sin*sim.h, ty = cos*sim.h;
        for (const [i, side] of [[3,-0.15],[4,0.15]]){
          const p = this.pts[i];
          p.x = tx + cos*side; p.y = ty - sin*side;
        }
      }
      for (const p of this.pts){
        if (p.y < p.r){
          const vx = p.x - p.px, vy = p.y - p.py;
          // vy ist der Versatz pro Schritt (~1/60 s): -0.07 entspricht gut 4 m/s
          if (!this.landed && vy < -0.07){ this.landed = true; this.dizzy = 2.6;
            AudioEngine.bodyThud(); punch({ shake: 9, shakeDur: 0.11, hitStop: 0.05 }); }
          p.y = p.r;
          p.py = p.y + vy*0.36;   // Abprall
          p.px = p.x - vx*0.5;    // Bodenreibung
        }
      }
    }
    if (this.dizzy > 0) this.dizzy -= dt;
  },
};

function drawRagdoll(t){
  if (!RAG.on) return;
  // Mindestgröße: bei herausgezoomter Sturzkamera bliebe er sonst ein Pixelfleck.
  // Skaliert um den Schwerpunkt, die Position stimmt also weiterhin.
  const k = Math.max(1, 46 / Math.max(1, cam.ppm));
  let mx = 0, my = 0;
  for (const p of RAG.pts){ mx += p.x; my += p.y; }
  mx /= RAG.pts.length; my /= RAG.pts.length;
  const S = RAG.pts.map(p => worldToScreen(mx + (p.x-mx)*k, my + (p.y-my)*k));
  const w = Math.max(2.6, cam.ppm*k*0.11);
  const skin = PAL.skin, suit = PAL.suit, suitDark = PAL.ink;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const limb = (a, b, col, outline, mul=1) => {
    ctx.strokeStyle = PAL.ink; ctx.lineWidth = w*1.55*mul;
    ctx.beginPath(); ctx.moveTo(S[a][0], S[a][1]); ctx.lineTo(S[b][0], S[b][1]); ctx.stroke();
    ctx.strokeStyle = col; ctx.lineWidth = w*mul;
    ctx.beginPath(); ctx.moveTo(S[a][0], S[a][1]); ctx.lineTo(S[b][0], S[b][1]); ctx.stroke();
  };
  limb(2, 5, suit, suitDark); limb(2, 6, suit, suitDark);      // Beine
  limb(1, 2, suit, suitDark, 1.9);                              // Rumpf
  limb(1, 3, skin, suitDark, 0.85); limb(1, 4, skin, suitDark, 0.85); // Arme
  // Schuhe + Hände
  ctx.fillStyle = PAL.ink;
  for (const i of [5,6]){ ctx.beginPath(); ctx.arc(S[i][0], S[i][1], w*0.6, 0, 7); ctx.fill(); }
  ctx.fillStyle = skin;
  for (const i of [3,4]){ ctx.beginPath(); ctx.arc(S[i][0], S[i][1], w*0.5, 0, 7); ctx.fill(); }
  // Kopf mit Helm, Blickrichtung entlang Kopf-Brust-Achse
  const hx = S[0][0], hy = S[0][1];
  const ang = Math.atan2(S[0][0]-S[1][0], -(S[0][1]-S[1][1]));
  const hr = Math.max(5.5, cam.ppm*k*0.12);
  ctx.save(); ctx.translate(hx, hy); ctx.rotate(ang);
  ctx.fillStyle = suitDark; ctx.beginPath(); ctx.arc(0, 0, hr*1.12, 0, 7); ctx.fill();
  ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(0, 0, hr, 0, 7); ctx.fill();
  ctx.fillStyle = PAL.helmet; ctx.beginPath(); ctx.arc(0, -hr*0.2, hr*1.06, Math.PI*1.02, Math.PI*1.98); ctx.fill();
  ctx.fillStyle = PAL.helmetStripe; ctx.fillRect(-hr*1.06, -hr*0.38, hr*2.12, hr*0.34);
  // X-Augen nach dem Aufschlag, sonst Panikaugen
  ctx.strokeStyle = PAL.ink; ctx.lineWidth = Math.max(1.4, hr*0.2); ctx.fillStyle = PAL.ink;
  if (RAG.landed){
    for (const ex of [-hr*0.36, hr*0.36]){
      ctx.beginPath();
      ctx.moveTo(ex-hr*0.2, -hr*0.2); ctx.lineTo(ex+hr*0.2, hr*0.2);
      ctx.moveTo(ex+hr*0.2, -hr*0.2); ctx.lineTo(ex-hr*0.2, hr*0.2);
      ctx.stroke();
    }
  } else {
    for (const ex of [-hr*0.36, hr*0.36]){ ctx.beginPath(); ctx.arc(ex, -hr*0.05, hr*0.24, 0, 7); ctx.fill(); }
    ctx.beginPath(); ctx.ellipse(0, hr*0.42, hr*0.26, hr*0.34, 0, 0, 7); ctx.fill(); // Schrei
  }
  ctx.restore();
  // Schwindel-Sternchen nach der Landung
  if (RAG.dizzy > 0){
    ctx.fillStyle = PAL.gold;
    for (let i = 0; i < 3; i++){
      const a = t*4 + i*2.1;
      ctx.beginPath();
      ctx.arc(hx + Math.cos(a)*hr*2.1, hy - hr*1.9 + Math.sin(a)*hr*0.6, Math.max(1.5, hr*0.16), 0, 7);
      ctx.fill();
    }
  }
}

// Balance-Anzeige: fix oben mittig, immer im Blick
function drawBalanceMeter(sim, t){
  if (!sim || !sim.alive) return;
  const bw = Math.min(300, W*0.76), bh = 15;
  const bx = W/2 - bw/2, by = Game.meterY;
  const tNorm = clamp(sim.theta/CFG.fallAngle, -1, 1);
  const danger = Math.abs(tNorm);
  ctx.save();
  // Track mit Gefahrenzonen
  ctx.fillStyle = 'rgba(8,12,28,0.55)';
  ctx.beginPath(); ctx.roundRect(bx-3, by-3, bw+6, bh+6, (bh+6)/2); ctx.fill();
  const g = ctx.createLinearGradient(bx, 0, bx+bw, 0);
  g.addColorStop(0,    'rgba(255,84,112,0.85)');
  g.addColorStop(0.24, 'rgba(255,175,94,0.35)');
  g.addColorStop(0.5,  'rgba(125,255,178,0.22)');
  g.addColorStop(0.76, 'rgba(255,175,94,0.35)');
  g.addColorStop(1,    'rgba(255,84,112,0.85)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, bh/2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(bx+0.5, by+0.5, bw-1, bh-1, bh/2); ctx.stroke();
  // Mittelkerbe
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillRect(W/2-1, by+3, 2, bh-6);
  // Soll-Marke (Daumen)
  const u = Input.lean();
  if (Input.touching || u !== 0){
    ctx.fillStyle = '#ffd76a';
    const ux = W/2 + u*(bw/2-9);
    ctx.beginPath();
    ctx.moveTo(ux, by+bh+4); ctx.lineTo(ux-5, by+bh+12); ctx.lineTo(ux+5, by+bh+12);
    ctx.closePath(); ctx.fill();
  }
  // Ist-Knopf mit Glow
  const kx = W/2 + tNorm*(bw/2-9), ky = by + bh/2;
  const col = danger > 0.72 ? '#ff5470' : danger > 0.42 ? '#ffaf5e' : '#7dffb2';
  const pulse = danger > 0.72 ? 1 + Math.sin(t*16)*0.14 : 1;
  ctx.globalAlpha = 0.35 * (0.5 + danger);
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(kx, ky, 15*pulse, 0, 7); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#0b1020';
  ctx.beginPath(); ctx.arc(kx, ky, 9.5*pulse, 0, 7); ctx.fill();
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(kx, ky, 7*pulse, 0, 7); ctx.fill();
  // Abgestützt-Hinweis
  if (Input.brace() || (sim.curBrace && sim.curHeld)){
    ctx.fillStyle = '#7db8ff'; ctx.font = '800 11px system-ui'; ctx.textAlign = 'center';
    ctx.letterSpacing = '1px';
    ctx.fillText('ABGESTÜTZT', W/2, by - 8);
    ctx.letterSpacing = '0px';
  }
  ctx.restore();
}

const DEATH_TEXTS = {
  wind:    { stamp: 'DER WIND GEWINNT', emo: '💨' },
  gerald:  { stamp: 'ERLEDIGT VON GERALD', emo: '🕊️' },
  balance: { stamp: 'GLEICHGEWICHT VERLOREN', emo: '🌀' },
