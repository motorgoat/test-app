<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2b6cb8">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Alpenflug K90 – Skisprung</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #2b6cb8; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; touch-action: none;
         -webkit-user-select: none; user-select: none; }
  #game { display: block; width: 100%; height: 100%; touch-action: none; }

  /* --- Glas-Overlays (Start / Ergebnis / Tutorial) --- */
  .panel {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    background: linear-gradient(160deg, rgba(13,27,46,.97), rgba(9,18,32,.98));
    color: #eef6ff; border-radius: 24px;
    padding: 26px 28px; width: min(92vw, 400px); text-align: center;
    box-shadow: 0 24px 60px rgba(2,10,24,.55), inset 0 1px 0 rgba(255,255,255,.12);
    border: 1px solid rgba(120,200,255,.22);
    animation: pop .32s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes pop { from { transform: translate(-50%,-46%) scale(.92); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .panel { animation: none; } }
  .panel h1 {
    font-size: 34px; font-weight: 900; letter-spacing: 3px;
    background: linear-gradient(100deg, #7fd8ff 10%, #ffffff 50%, #9be8ff 90%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .panel h2 { font-size: 15px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #8fc6ea; }
  .panel .sub { color: #7ea8c9; font-size: 13px; letter-spacing: 1px; margin: 4px 0 16px; }
  .panel .big {
    font-size: 54px; font-weight: 900; margin: 8px 0 2px; letter-spacing: -1px;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(180deg, #ffffff, #9adcff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .pills { display: flex; gap: 8px; justify-content: center; margin: 14px 0 6px; }
  .pill { flex: 1; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12);
          border-radius: 14px; padding: 9px 4px; }
  .pill .v { font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .pill .k { font-size: 10px; color: #7ea8c9; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }
  .total { font-size: 15px; color: #cfe6f8; margin: 6px 0 4px; }
  .total b { font-size: 22px; color: #fff; }
  .windline { font-size: 13px; color: #7ea8c9; margin-bottom: 12px; }
  .rating { font-weight: 800; color: #9be8ff; }
  .panel button {
    font: inherit; font-weight: 800; font-size: 17px; letter-spacing: .5px; color: #06222e;
    background: linear-gradient(180deg, #7fe3ff, #22b8e6); border: none; border-radius: 14px;
    padding: 14px 26px; margin-top: 10px; cursor: pointer; width: 100%;
    box-shadow: 0 6px 20px rgba(34,184,230,.45), inset 0 1px 0 rgba(255,255,255,.6);
  }
  .panel button:active { transform: translateY(1px); }
  .best { font-size: 13px; color: #ffd35c; margin-top: 12px; font-weight: 600; }
  .hint { font-size: 12px; color: #7ea8c9; margin-top: 10px; line-height: 1.5; }
  .hidden { display: none !important; }

  /* Tutorial-Karte (blockiert keine Taps – die gehen ans Canvas) */
  #tutCard {
    position: fixed; left: 50%; bottom: max(4vh, env(safe-area-inset-bottom, 0px) + 18px);
    transform: translateX(-50%);
    width: min(90vw, 380px); pointer-events: none;
    background: linear-gradient(160deg, rgba(13,27,46,.96), rgba(9,18,32,.97));
    border: 1px solid rgba(120,200,255,.25); border-left: 4px solid #35d0ff;
    border-radius: 16px; padding: 14px 16px; color: #eef6ff;
    box-shadow: 0 14px 40px rgba(2,10,24,.5);
    animation: rise .3s cubic-bezier(.2,1.3,.4,1);
  }
  @keyframes rise { from { transform: translateX(-50%) translateY(14px); opacity: 0; } }
  #tutCard .step { font-size: 10px; font-weight: 800; letter-spacing: 2px; color: #35d0ff; text-transform: uppercase; }
  #tutCard .txt { font-size: 15px; font-weight: 600; line-height: 1.45; margin-top: 4px; }
  #tutCard .go { font-size: 12px; color: #7ea8c9; margin-top: 8px; animation: blink 1.1s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { #tutCard, #tutCard .go { animation: none; } }
</style>
</head>
<body>
<canvas id="game"></canvas>

<!-- Startbildschirm -->
<div id="startPanel" class="panel">
  <h1>ALPENFLUG</h1>
  <div class="sub">K90 · HILLSIZE 100</div>
  <button id="startBtn">Spiel starten</button>
  <div class="hint">Tippen für Start, Absprung &amp; Landung.<br>Im Flug ziehen oder oben/unten halten. Desktop: Leertaste + ↑ ↓</div>
  <div class="best" id="startBest"></div>
</div>

<!-- Ergebnis -->
<div id="resultPanel" class="panel hidden">
  <h2 id="resTitle">Sprungweite</h2>
  <div class="big" id="resDist">–</div>
  <div class="pills">
    <div class="pill"><div class="v" id="pDist">–</div><div class="k">Weite</div></div>
    <div class="pill"><div class="v" id="pFlight">–</div><div class="k">Flug</div></div>
    <div class="pill"><div class="v" id="pLand">–</div><div class="k">Landung</div></div>
  </div>
  <div class="total">Gesamt <b id="resTotal">–</b> Punkte</div>
  <div class="windline"><span id="resLanding" class="rating"></span> · <span id="resWind"></span></div>
  <button id="nextBtn">Nächster Sprung</button>
  <div class="best" id="resBest"></div>
</div>

<!-- Interaktives Tutorial -->
<div id="tutCard" class="hidden">
  <div class="step" id="tutStep">Tutorial 1/4</div>
  <div class="txt" id="tutText"></div>
  <div class="go" id="tutGo">▸ Tippen zum Fortfahren</div>
</div>

<script>
'use strict';

/* =====================================================================
   ALPENFLUG K90 – HTML5-Canvas-Skisprung-Prototyp (Vanilla JS)
   Struktur:
     CONFIG   – alle Balancing-Parameter
     Hill     – Anlaufspur + Aufsprungprofil (vorberechnete Punktlisten)
     Input    – Pointer + Tastatur, vereinheitlicht
     Tutorial – interaktive Schritte mit Spielpausen (nur beim 1. Mal)
     Game     – State-Machine (MENU → GATE → INRUN → FLIGHT → OUTRUN → RESULT)
     Render   – Kamera, Parallax, Schanze, Springer, HUD
   ===================================================================== */

// ------------------------------------------------------------------ CONFIG
const CONFIG = {
  // Allgemein
  gravity: 9.81,              // m/s²
  timestep: 1 / 60,           // fixe Physikrate

  // Schanze (K90 / HS100)
  kPoint: 90,                 // K-Punkt in m (entlang des Hangs gemessen)
  hillSize: 100,              // Hillsize in m
  takeoffHeight: 3.0,         // Höhe der Tischkante über dem Profil-Ursprung (m)
  tableAngle: 10.5,           // Neigung des Schanzentischs (Grad, abwärts)
  tableLength: 6.5,           // Länge des Tischs (m)
  inrunAngle: 35,             // Neigung des Anlaufhangs (Grad)
  inrunStraight: 42,          // Länge des geraden Anlaufstücks (m)
  inrunRadius: 90,            // Übergangsradius Anlauf → Tisch (m)
  // Aufsprungprofil: Winkelverlauf über horizontale Distanz x
  landing: { startAngle: 10, maxAngle: 36, steepen0: 8, steepen1: 50, flat0: 88, flat1: 135 },

  // Anlauf
  inrunFriction: 0.025,       // Gleitreibungskoeffizient Ski/Spur
  inrunDrag: 0.0011,          // Luftwiderstand in der Hocke (a = k·v²)

  // Absprung
  takeoffImpulse: 3.2,        // Absprung-Impuls senkrecht zum Tisch (m/s) bei Qualität 1
  takeoffSpeedBonus: 0.06,    // Qualität skaliert Geschwindigkeit: v·(1-bonus+bonus·q)
  perfectWindow: 0.040,       // ± Sekunden um die Tischkante = perfekt (~80 ms Fenster)
  earlyFalloff: 0.50,         // zu früh: Qualität fällt über diese Zeitspanne auf 0
  lateWindow: 0.18,           // so lange nach der Kante zählt ein Tap noch (stark reduziert)

  // Flug
  liftCoefficient: 0.0042,    // Auftrieb: a = CL · v_rel² · liftFactor(α)
  dragCoefficient: 0.0024,    // Grundwiderstand: a = CD · v_rel² · dragFactor(α)
  dragAngleFactor: 0.0042,    // Zusatzwiderstand bei steilem Anstellwinkel
  optimalAngle: 12,           // optimaler Anstellwinkel α relativ zur Anströmung (Grad)
  angleTolerance: 9,          // ± Korridor (Grad) für vollen Auftrieb / Haltungsnote
  angleSpeed: 45,             // Drehrate der Spielersteuerung (Grad/s)
  pitchDrift: 4,              // aerodynamische Aufdreh-Tendenz (Grad/s) – muss aktiv gehalten werden
  bodyMin: -70, bodyMax: 25,  // Begrenzung des Körperwinkels (Grad, absolut)

  // Wind (positiv = Rückenwind → schlechter, negativ = Gegenwind → besser)
  windStrength: 2.5,          // maximale Windstärke ± m/s (zufällig pro Sprung)
  windAeroFactor: 2.0,        // Gameplay-Verstärkung der Windwirkung auf die Anströmung
  gustAmount: 0.25,           // Böen: ±25 % um den Basiswind

  // Landung
  telemarkWindow: 0.12,       // Tap ≤ 120 ms vor Aufsetzen = Telemark
  okWindow: 0.28,             // Tap ≤ 280 ms = sichere Landung
  earlyLimit: 0.55,           // Taps früher als das zählen nicht (Fenster noch zu)
  crashSpeed: 11.5,           // Aufprall senkrecht zum Hang > x m/s = Sturz
  outrunFriction: 0.06,       // Bremsreibung im Auslauf
  crashFriction: 0.30,        // Sturz bremst stark

  // Punkte
  meterValue: 1.8,            // Weitenpunkte pro Meter (K90-Standard)
  basePoints: 60,             // Punkte am K-Punkt
  styleFlightMax: 30,         // Haltungsnote Flug (Zeit im Korridor)
  styleLandingMax: 30,        // Haltungsnote Landung

  // Kamera (sichtbare Weltbreite in m pro Phase – kleiner = näher dran)
  camGateView: 21,
  camInrunView: 34,
  camFlightMin: 30, camFlightMax: 58,
  camOutrunView: 30,
};

// ------------------------------------------------------------------ Utils
const D2R = Math.PI / 180;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const damp = (cur, target, rate, dt) => lerp(cur, target, 1 - Math.exp(-rate * dt));
// localStorage kann in Sandbox-Umgebungen beim Zugriff werfen
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

// ------------------------------------------------------------------ Hill
// Weltkoordinaten: Tischkante = (0, 0). +x in Flugrichtung, +y nach oben.
const Hill = (() => {
  const L = CONFIG.landing;

  function landingAngle(x) {
    if (x < L.steepen1)
      return L.startAngle + (L.maxAngle - L.startAngle) * smoothstep((x - L.steepen0) / (L.steepen1 - L.steepen0));
    if (x < L.flat0) return L.maxAngle;
    return L.maxAngle * (1 - smoothstep((x - L.flat0) / (L.flat1 - L.flat0)));
  }

  // Profil integrieren: y(x) und Bogenlänge s(x) (= gemessene Weite)
  const STEP = 0.5, XMAX = 320;
  const prof = [{ x: 0, y: -CONFIG.takeoffHeight, s: 0 }];
  for (let x = STEP; x <= XMAX; x += STEP) {
    const th = landingAngle(x - STEP / 2) * D2R;
    const p = prof[prof.length - 1];
    prof.push({ x, y: p.y - Math.tan(th) * STEP, s: p.s + STEP / Math.cos(th) });
  }
  function groundAt(x) {
    x = clamp(x, 0, XMAX - STEP);
    const i = Math.floor(x / STEP), t = (x - prof[i].x) / STEP;
    return {
      y: lerp(prof[i].y, prof[i + 1].y, t),
      s: lerp(prof[i].s, prof[i + 1].s, t),
      angle: landingAngle(x),
    };
  }
  function xAtDistance(s) {
    for (let i = 1; i < prof.length; i++)
      if (prof[i].s >= s) return lerp(prof[i - 1].x, prof[i].x, (s - prof[i - 1].s) / (prof[i].s - prof[i - 1].s));
    return XMAX;
  }

  // Anlaufspur: vom Tisch rückwärts integriert. inrun[0] = Startpunkt oben.
  const arcLen = (CONFIG.inrunAngle - CONFIG.tableAngle) * D2R * CONFIG.inrunRadius;
  const inrunLength = CONFIG.inrunStraight + arcLen + CONFIG.tableLength;
  function inrunAngleAt(sFromTop) {
    if (sFromTop < CONFIG.inrunStraight) return CONFIG.inrunAngle;
    if (sFromTop < CONFIG.inrunStraight + arcLen)
      return CONFIG.inrunAngle - (sFromTop - CONFIG.inrunStraight) / arcLen * (CONFIG.inrunAngle - CONFIG.tableAngle);
    return CONFIG.tableAngle;
  }
  const inrun = [];
  {
    let x = 0, y = 0;
    const n = Math.ceil(inrunLength / STEP);
    inrun[n] = { x: 0, y: 0, s: inrunLength };
    for (let i = n - 1; i >= 0; i--) {
      const s = i * STEP;
      const th = inrunAngleAt(s + STEP / 2) * D2R;
      x -= Math.cos(th) * STEP; y += Math.sin(th) * STEP;
      inrun[i] = { x, y, s };
    }
  }
  function inrunAt(s) {
    s = clamp(s, 0, inrunLength - 0.001);
    const i = Math.floor(s / STEP);
    const t = (s - inrun[i].s) / (inrun[i + 1].s - inrun[i].s);
    return {
      x: lerp(inrun[i].x, inrun[i + 1].x, t),
      y: lerp(inrun[i].y, inrun[i + 1].y, t),
      angle: inrunAngleAt(s),
    };
  }

  return { prof, groundAt, xAtDistance, inrun, inrunAt, inrunLength, landingAngle };
})();

// ------------------------------------------------------------------ Input
const Input = (() => {
  const state = { tap: false, pointerDown: false };
  let startY = 0, curY = 0, dragging = false;
  const keys = {};
  const canvas = document.getElementById('game');

  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    state.tap = true;
    state.pointerDown = true;
    startY = curY = e.clientY;
    dragging = false;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', e => {
    if (!state.pointerDown) return;
    curY = e.clientY;
    if (Math.abs(curY - startY) > 16) dragging = true;
  });
  const up = () => { state.pointerDown = false; dragging = false; };
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);

  window.addEventListener('keydown', e => {
    if (e.repeat) return;
    keys[e.key] = true;
    if (e.key === ' ' || e.key === 'Enter') state.tap = true;
    if (e.key === 'd' || e.key === 'D') Game.debug = !Game.debug;
  });
  window.addEventListener('keyup', e => { keys[e.key] = false; });

  // Pro Physikframe: liefert Steuerwert, konsumiert den Tap
  function poll() {
    let a = 0;
    if (state.pointerDown) {
      if (dragging) {
        a = clamp((startY - curY) / (window.innerHeight * 0.18), -1, 1);
      } else {
        a = curY < window.innerHeight / 2 ? 0.8 : -0.8;
      }
    }
    if (keys['ArrowUp'] || keys['w']) a = 1;
    if (keys['ArrowDown'] || keys['s']) a = -1;
    const tap = state.tap; state.tap = false;
    return { tap, angle: a };
  }
  return { poll, state };
})();

// ------------------------------------------------------------------ Tutorial
// Beim ersten Spiel: an Schlüsselmomenten pausieren, erklären, bei Tap weiter.
const Tutorial = {
  active: !store.get('alpenflug_tut_v1'),
  step: 0,
  paused: false,
  card: null, // DOM-Refs werden unten verdrahtet

  // when(): Bedingung zum Auslösen · pause: Spiel anhalten bis Tap
  steps: [
    { id: 'gate',
      when: () => Game.state === 'GATE',
      pause: false, // Spiel wartet ohnehin – der Start-Tap ist die Aktion
      text: 'Du sitzt am Startbalken. Tippe, um dich abzustoßen – der Anlauf läuft dann automatisch.' },
    { id: 'takeoff',
      when: () => Game.state === 'INRUN' && (Hill.inrunLength - Game.skier.s) / Math.max(Game.skier.v, 0.1) < 1.15,
      pause: true,
      text: 'Gleich kommt die Tischkante (rote Linie)! Tippe GENAU an der Kante ab – zu früh oder zu spät kostet Weite.' },
    { id: 'flight',
      when: () => Game.state === 'FLIGHT' && Game.flight.time > 0.45,
      pause: true,
      text: 'Flug: Halte die Nadel rechts im grünen Korridor. Nach unten ziehen/halten = Vorlage, nach oben = aufrichten.' },
    { id: 'landing',
      when: () => Game.state === 'FLIGHT' && Game.landingTap.tta < 0.85,
      pause: true,
      text: 'Landung! Tippe kurz vor dem Aufsetzen für den Telemark – zu spät bedeutet Sturz.' },
  ],

  update() {
    if (!this.active || this.paused || this.step >= this.steps.length) return;
    const s = this.steps[this.step];
    if (s.when() && tutCard.classList.contains('hidden')) {
      this.show(s);
      if (s.pause) this.paused = true;
    }
  },

  show(s) {
    tutStep.textContent = `Tutorial ${this.step + 1}/${this.steps.length}`;
    tutText.textContent = s.text;
    tutGo.textContent = s.pause ? '▸ Tippen zum Fortfahren' : '▸ Tippen, wenn du bereit bist';
    tutCard.classList.remove('hidden');
  },

  // true = Tap wurde vom Tutorial konsumiert (Spiel läuft weiter, Tap zählt nicht)
  consumeTap() {
    if (!this.active || this.step >= this.steps.length) return false;
    if (this.paused) {
      this.paused = false;
      this.advance();
      return true;
    }
    // Nicht-pausierender Schritt (Gate): Tap zählt als Aktion, Karte weg
    if (!tutCard.classList.contains('hidden')) this.advance();
    return false;
  },

  advance() {
    tutCard.classList.add('hidden');
    this.step++;
  },

  finish() {
    if (!this.active) return;
    this.active = false;
    tutCard.classList.add('hidden');
    store.set('alpenflug_tut_v1', '1');
  },
};

// ------------------------------------------------------------------ Game
const Game = {
  state: 'MENU',   // MENU | GATE | INRUN | FLIGHT | OUTRUN | RESULT
  debug: false,
  time: 0,
  outrunTimer: 0,

  skier: { x: 0, y: 0, vx: 0, vy: 0, body: 0, s: 0, v: 0, pose: 'crouch', spin: 0 },

  wind: 0, gustPhase: 0,
  takeoff: { tapped: false, quality: 0, lateTimer: 0, done: false, tapTTE: null },
  flight: { time: 0, corridorTime: 0, alpha: 0, lift: 0, drag: 0 },
  landingTap: { time: -99, windowOpen: false, tta: 99 },
  result: null,
  best: (() => { try { return JSON.parse(store.get('alpenflug_best') || 'null'); } catch (e) { return null; } })(),

  message: { text: '', color: '#fff', until: 0, start: 0 },
  popup: null,       // Weiten-Popup nach der Landung
  particles: [],

  showMsg(text, color, dur = 1.4) {
    this.message = { text, color, until: this.time + dur, start: this.time };
  },

  // Neuer Sprung: Springer ans Gate, Wind auslosen – Start erst per Tap
  newJump() {
    this.state = 'GATE';
    this.wind = (Math.random() * 2 - 1) * CONFIG.windStrength;
    this.gustPhase = Math.random() * 100;
    const start = Hill.inrunAt(0);
    Object.assign(this.skier, { s: 0, v: 0, x: start.x, y: start.y, vx: 0, vy: 0, body: -start.angle, pose: 'crouch', spin: 0 });
    this.takeoff = { tapped: false, quality: 0, lateTimer: 0, done: false, tapTTE: null };
    this.flight = { time: 0, corridorTime: 0, alpha: 0, lift: 0, drag: 0 };
    this.landingTap = { time: -99, windowOpen: false, tta: 99 };
    this.result = null;
    this.popup = null;
    this.particles.length = 0;
    hide(startPanel); hide(resultPanel);
  },

  currentWind() {
    const gust = Math.sin(this.time * 1.3 + this.gustPhase) * Math.sin(this.time * 0.7);
    return this.wind * (1 + CONFIG.gustAmount * gust);
  },

  // ---------------- Physik-Update (fixer Timestep) ----------------
  update(dt) {
    this.time += dt;
    const inp = Input.poll();
    const S = this.skier;

    // Tutorial: pausierte Schritte fangen den Tap ab
    if (inp.tap && Tutorial.consumeTap()) return;
    if (Tutorial.paused) return;

    if (this.state === 'GATE') {
      if (inp.tap) { this.state = 'INRUN'; this.showMsg('LOS!', '#9be8ff', 0.7); }
    }

    // ---------- ANLAUF ----------
    else if (this.state === 'INRUN') {
      const th = Hill.inrunAt(S.s).angle * D2R;
      const a = CONFIG.gravity * Math.sin(th)
              - CONFIG.inrunFriction * CONFIG.gravity * Math.cos(th)
              - CONFIG.inrunDrag * S.v * S.v;
      S.v += a * dt;
      S.s += S.v * dt;

      // Schneestaub hinter dem Springer
      if (S.v > 8 && Math.random() < 0.5) this.dust();

      // Absprung-Tap: Qualität nach Restzeit bis zur Tischkante
      if (inp.tap && !this.takeoff.tapped) {
        this.takeoff.tapped = true;
        const tte = (Hill.inrunLength - S.s) / Math.max(S.v, 0.1);
        this.takeoff.tapTTE = tte;
        this.takeoff.quality = tte <= CONFIG.perfectWindow
          ? 1
          : Math.max(0.05, 1 - (tte - CONFIG.perfectWindow) / CONFIG.earlyFalloff);
      }

      if (S.s >= Hill.inrunLength) this.startFlight();
      else {
        const p = Hill.inrunAt(S.s);
        S.x = p.x; S.y = p.y; S.body = -p.angle;
      }
    }

    // ---------- FLUG ----------
    else if (this.state === 'FLIGHT') {
      const F = this.flight, T = this.takeoff;

      // Verspäteter Absprung: Tap kurz nach der Kante zählt noch (reduziert)
      if (!T.done) {
        T.lateTimer += dt;
        if (inp.tap && T.lateTimer <= CONFIG.lateWindow) {
          T.tapped = true; T.done = true;
          T.quality = Math.max(0.05, 1 - (T.lateTimer + CONFIG.perfectWindow) / (CONFIG.lateWindow + CONFIG.perfectWindow));
          this.applyTakeoffImpulse(T.quality, true);
          this.rateTakeoff(T.quality, 'spät');
        } else if (T.lateTimer > CONFIG.lateWindow) {
          T.done = true;
          this.rateTakeoff(0, 'keiner');
        }
      }

      // Fluglagensteuerung + aerodynamischer Drift
      S.body += inp.angle * CONFIG.angleSpeed * dt + CONFIG.pitchDrift * dt;
      S.body = clamp(S.body, CONFIG.bodyMin, CONFIG.bodyMax);

      // Aerodynamik relativ zur Anströmung (Wind verstärkt via windAeroFactor)
      const w = this.currentWind() * CONFIG.windAeroFactor;
      const rvx = S.vx - w, rvy = S.vy;
      const rv = Math.hypot(rvx, rvy);
      const velAng = Math.atan2(rvy, rvx) / D2R;
      const alpha = S.body - velAng;                       // Anstellwinkel
      const dNorm = (alpha - CONFIG.optimalAngle) / CONFIG.angleTolerance;
      const liftF = Math.exp(-dNorm * dNorm);              // Gauß-Glocke ums Optimum
      const aPos = Math.max(0, alpha) / 30;
      const dragF = 1 + (CONFIG.dragAngleFactor / CONFIG.dragCoefficient) * aPos * aPos;
      const lift = CONFIG.liftCoefficient * rv * rv * liftF;
      const drag = CONFIG.dragCoefficient * rv * rv * dragF;
      const ux = rvx / rv, uy = rvy / rv;
      S.vx += (-drag * ux - lift * uy) * dt;
      S.vy += (-drag * uy + lift * ux - CONFIG.gravity) * dt;
      S.x += S.vx * dt; S.y += S.vy * dt;

      F.time += dt;
      if (Math.abs(alpha - CONFIG.optimalAngle) <= CONFIG.angleTolerance) F.corridorTime += dt;
      F.alpha = alpha; F.lift = lift; F.drag = drag;

      // Landefenster: geschätzte Zeit bis zum Aufsetzen
      const g = Hill.groundAt(S.x);
      const gap = S.y - g.y;
      const closure = -(S.vy + S.vx * Math.tan(g.angle * D2R));
      this.landingTap.tta = closure > 0.3 ? gap / closure : 99;
      const open = this.landingTap.tta < CONFIG.earlyLimit && F.time > 0.5;
      if (open && !this.landingTap.windowOpen) this.showMsg('LANDEN!', '#ffd35c', 0.9);
      this.landingTap.windowOpen = open;
      if (inp.tap && open) this.landingTap.time = this.time;

      if (S.y <= g.y && F.time > 0.1) this.touchdown(g);
    }

    // ---------- AUSLAUF ----------
    else if (this.state === 'OUTRUN') {
      const th = Hill.groundAt(S.x).angle * D2R;
      const fric = this.result.crashed ? CONFIG.crashFriction : CONFIG.outrunFriction;
      const a = CONFIG.gravity * Math.sin(th) - fric * CONFIG.gravity * Math.cos(th) - 0.002 * S.v * S.v;
      S.v = Math.max(0, S.v + a * dt);
      S.x += S.v * Math.cos(th) * dt;
      const g2 = Hill.groundAt(S.x);
      S.y = g2.y;
      if (this.result.crashed) {
        S.body += S.spin * dt;
        S.spin *= 0.97;
        if (S.v > 2) this.spray(2);
      } else {
        S.body = -g2.angle;
        if (S.v > 6) this.dust();
      }
      this.outrunTimer += dt;
      if ((S.v < 1.5 || this.outrunTimer > 3.5) && this.outrunTimer > 1.6) this.showResult();
    }

    // Partikel
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy -= 6 * dt; p.life -= dt;
      if (p.life <= 0) this.particles.splice(i, 1);
    }
  },

  startFlight() {
    const S = this.skier, T = this.takeoff;
    const ta = -CONFIG.tableAngle * D2R;
    const q = T.tapped ? T.quality : 0;
    const v = S.v * (1 - CONFIG.takeoffSpeedBonus + CONFIG.takeoffSpeedBonus * q);
    S.x = 0; S.y = 0;
    S.vx = v * Math.cos(ta); S.vy = v * Math.sin(ta);
    S.body = -CONFIG.tableAngle + 4;
    S.pose = 'flight';
    this.state = 'FLIGHT';
    if (T.tapped) {
      T.done = true;
      this.applyTakeoffImpulse(q, false);
      this.rateTakeoff(q, T.tapTTE <= CONFIG.perfectWindow ? 'perfekt' : 'früh');
    }
  },

  applyTakeoffImpulse(q, late) {
    const S = this.skier, ta = CONFIG.tableAngle * D2R;
    const imp = CONFIG.takeoffImpulse * q * (late ? 0.8 : 1);
    S.vx += imp * Math.sin(ta) * 0.25;
    S.vy += imp * Math.cos(ta);
  },

  rateTakeoff(q, kind) {
    if (kind === 'keiner')      this.showMsg('Absprung verschlafen!', '#ff7a7a');
    else if (q >= 0.93)         this.showMsg('PERFEKTER ABSPRUNG!', '#5cffa8');
    else if (q >= 0.7)          this.showMsg('Guter Absprung', '#b9f6ca');
    else if (kind === 'spät')   this.showMsg('Zu spät!', '#ffb74d');
    else                        this.showMsg('Zu früh!', '#ffb74d');
  },

  touchdown(g) {
    const S = this.skier;
    const th = g.angle * D2R;
    // Aufprallgeschwindigkeit senkrecht zum Hang (Hangnormale n = (sinθ, cosθ))
    const vNormal = -(S.vx * Math.sin(th) + S.vy * Math.cos(th));
    const dtTap = this.time - this.landingTap.time;
    let landing, landingPts, crashed = false;
    if (dtTap <= CONFIG.telemarkWindow)     { landing = 'Telemark!';        landingPts = CONFIG.styleLandingMax; }
    else if (dtTap <= CONFIG.okWindow)      { landing = 'Sichere Landung';  landingPts = CONFIG.styleLandingMax * 0.6; }
    else if (dtTap <= CONFIG.earlyLimit)    { landing = 'Wacklige Landung'; landingPts = CONFIG.styleLandingMax * 0.33; }
    else                                    { landing = 'STURZ!';           landingPts = 0; crashed = true; }
    if (vNormal > CONFIG.crashSpeed)        { landing = 'STURZ – zu hart!'; landingPts = 0; crashed = true; }

    const dist = Math.round(g.s * 2) / 2;
    const distPts = Math.max(0, CONFIG.basePoints + (dist - CONFIG.kPoint) * CONFIG.meterValue);
    const F = this.flight;
    let flightPts = (F.time > 0 ? F.corridorTime / F.time : 0) * CONFIG.styleFlightMax;
    if (crashed) flightPts *= 0.25;
    const total = distPts + flightPts + landingPts;

    this.result = { dist, distPts, flightPts, landingPts, total, landing, crashed, wind: this.wind, takeoffQ: this.takeoff.quality };
    if (!this.best || total > this.best.total) {
      this.best = { dist, total };
      store.set('alpenflug_best', JSON.stringify(this.best));
    }

    // Weiten-Popup in der Welt
    this.popup = { text: dist.toFixed(1).replace('.', ',') + ' m', x: S.x, y: S.y + 2.5, t0: this.time, crashed };

    this.state = 'OUTRUN';
    this.outrunTimer = 0;
    const vTang = S.vx * Math.cos(th) - S.vy * Math.sin(th);
    S.v = Math.max(3, vTang);
    S.y = g.y;
    S.pose = crashed ? 'crash' : (dtTap <= CONFIG.telemarkWindow ? 'telemark' : 'landed');
    if (crashed) { S.spin = -540; this.showMsg('STURZ!', '#ff5252', 1.8); }
    else this.showMsg(landing, dtTap <= CONFIG.telemarkWindow ? '#5cffa8' : '#fff', 1.4);
    this.spray(crashed ? 40 : 18);
  },

  spray(n) {
    const S = this.skier;
    for (let i = 0; i < n; i++)
      this.particles.push({
        x: S.x, y: S.y + 0.2, life: 0.4 + Math.random() * 0.5,
        vx: -2 - Math.random() * 5, vy: 1 + Math.random() * 4,
      });
  },

  dust() {
    const S = this.skier;
    this.particles.push({
      x: S.x - 0.8, y: S.y + 0.1, life: 0.25 + Math.random() * 0.2,
      vx: -1 - Math.random() * 2, vy: 0.5 + Math.random() * 1.5,
    });
  },

  showResult() {
    this.state = 'RESULT';
    Tutorial.finish();
    const r = this.result;
    resTitle.textContent = r.crashed ? 'Gestürzt' : 'Sprungweite';
    resDist.textContent = r.dist.toFixed(1).replace('.', ',') + ' m';
    pDist.textContent = r.distPts.toFixed(1);
    pFlight.textContent = r.flightPts.toFixed(1);
    pLand.textContent = r.landingPts.toFixed(1);
    resTotal.textContent = r.total.toFixed(1);
    resLanding.textContent = r.landing;
    resWind.textContent = 'Wind: ' + windLabel(r.wind);
    resBest.textContent = this.best
      ? `Bestleistung: ${this.best.dist.toFixed(1).replace('.', ',')} m · ${this.best.total.toFixed(1)} Pkt.` : '';
    show(resultPanel);
  },
};

function windLabel(w) {
  const abs = Math.abs(w).toFixed(1).replace('.', ',');
  if (Math.abs(w) < 0.15) return 'windstill';
  return w < 0 ? `${abs} m/s Gegenwind` : `${abs} m/s Rückenwind`;
}

// ------------------------------------------------------------------ Render
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1, vignette = null;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  vignette = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.45, W / 2, H / 2, Math.max(W, H) * 0.75);
  vignette.addColorStop(0, 'rgba(8,20,36,0)');
  vignette.addColorStop(1, 'rgba(8,20,36,0.30)');
}
window.addEventListener('resize', resize);
resize();

// Kamera: Weltkoordinaten (m) → Bildschirm (CSS-px)
const cam = { x: -55, y: 22, ppm: 14 };
function worldToScreen(wx, wy) {
  return { x: (wx - cam.x) * cam.ppm + W * 0.5, y: H * 0.46 - (wy - cam.y) * cam.ppm };
}

function updateCamera(dt) {
  const S = Game.skier;
  let vw, tx, ty;
  if (Game.state === 'MENU' || Game.state === 'GATE') {
    vw = CONFIG.camGateView; tx = S.x + 5; ty = S.y - 2;
  } else if (Game.state === 'INRUN') {
    vw = CONFIG.camInrunView; tx = S.x + 10; ty = S.y - 4;
  } else if (Game.state === 'FLIGHT') {
    const hAbove = S.y - Hill.groundAt(S.x).y;
    vw = clamp(hAbove * 1.5 + 24, CONFIG.camFlightMin, CONFIG.camFlightMax);
    tx = S.x + S.vx * 0.4; ty = S.y - hAbove * 0.42;
  } else {
    vw = CONFIG.camOutrunView; tx = S.x + 5; ty = S.y + 2;
  }
  const targetPpm = Math.min(W / vw, H / (vw * 0.82));
  cam.ppm = damp(cam.ppm, targetPpm, 2.5, dt);
  cam.x = damp(cam.x, tx, 4, dt);
  cam.y = damp(cam.y, ty, 4, dt);
}

// --- Hintergrund: Himmel, Sonne, Wolken, Parallax-Bergketten mit Wald ---
function ridgeY(x, seed) {
  return Math.sin(x * 0.011 + seed) * 14 + Math.sin(x * 0.031 + seed * 2.3) * 6 + Math.sin(x * 0.005 + seed * 0.7) * 20;
}
function drawBackground() {
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#1d5fae');
  sky.addColorStop(0.45, '#4f97d6');
  sky.addColorStop(1, '#cfe9fa');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

  // Sonne mit Glow
  const sx = W * 0.76, sy = H * 0.15, sr = Math.min(W, H) * 0.05;
  const glow = ctx.createRadialGradient(sx, sy, sr * 0.4, sx, sy, sr * 4.5);
  glow.addColorStop(0, 'rgba(255,244,200,0.85)');
  glow.addColorStop(0.25, 'rgba(255,240,190,0.25)');
  glow.addColorStop(1, 'rgba(255,240,190,0)');
  ctx.fillStyle = glow; ctx.fillRect(sx - sr * 5, sy - sr * 5, sr * 10, sr * 10);
  ctx.fillStyle = '#fff7d6';
  ctx.beginPath(); ctx.arc(sx, sy, sr, 0, 7); ctx.fill();

  // Wolken (leichte Parallax); c[2] = Größenfaktor relativ zur Basisgröße
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  for (const c of [[0.14, 0.16, 1.2], [0.48, 0.10, 0.8], [0.85, 0.26, 1.0]]) {
    const cx = ((c[0] * W - cam.x * cam.ppm * 0.06) % (W + 260) + W + 260) % (W + 260) - 130;
    const cy = c[1] * H, cw = c[2] * clamp(Math.min(W, H) / 420, 0.9, 1.5);
    ctx.beginPath();
    ctx.ellipse(cx, cy, 44 * cw, 12 * cw, 0, 0, 7);
    ctx.ellipse(cx + 26 * cw, cy - 8 * cw, 30 * cw, 11 * cw, 0, 0, 7);
    ctx.ellipse(cx - 30 * cw, cy - 4 * cw, 26 * cw, 9 * cw, 0, 0, 7);
    ctx.fill();
  }

  // drei Bergketten: hinten hell/dunstig, vorn kräftiger + Waldsilhouette
  const layers = [
    { par: 0.06, base: 0.38, color: '#a8c4dd', snow: true,  seed: 3 },
    { par: 0.14, base: 0.47, color: '#7fa3c4', snow: true,  seed: 8 },
    { par: 0.26, base: 0.58, color: '#597e9f', snow: false, seed: 13 },
  ];
  for (const l of layers) {
    ctx.fillStyle = l.color;
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let px = 0; px <= W; px += 10) {
      const wx = px + cam.x * cam.ppm * l.par;
      ctx.lineTo(px, H * l.base - ridgeY(wx, l.seed) - cam.y * cam.ppm * l.par * 0.3);
    }
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
  }
  // Waldband auf der vordersten Kette
  const l = layers[2];
  ctx.fillStyle = '#37536e';
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let px = 0; px <= W; px += 7) {
    const wx = px + cam.x * cam.ppm * l.par;
    const baseY = H * l.base - ridgeY(wx, l.seed) - cam.y * cam.ppm * l.par * 0.3 + 14;
    const spike = (Math.sin(wx * 0.9) * 0.5 + 0.5) * 9 + 4;
    ctx.lineTo(px, baseY - (px % 14 < 7 ? spike : 0));
  }
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
}

function drawHill() {
  // --- Aufsprunghang: Schnee mit kühlem Verlauf + Kantenlicht ---
  const first = worldToScreen(Hill.prof[0].x, Hill.prof[0].y);
  const last = worldToScreen(Hill.prof[Hill.prof.length - 1].x, Hill.prof[Hill.prof.length - 1].y);
  ctx.beginPath();
  ctx.moveTo(first.x, first.y);
  for (const p of Hill.prof) { const s = worldToScreen(p.x, p.y); ctx.lineTo(s.x, s.y); }
  ctx.lineTo(last.x, H + 60); ctx.lineTo(first.x, H + 60); ctx.closePath();
  const snow = ctx.createLinearGradient(0, 0, 0, H * 1.2);
  snow.addColorStop(0, '#ffffff');
  snow.addColorStop(0.55, '#e9f3fb');
  snow.addColorStop(1, '#c9ddef');
  ctx.fillStyle = snow; ctx.fill();
  // Kantenlicht + Schattenlinie
  ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 2.5;
  ctx.beginPath();
  for (const p of Hill.prof) { const s = worldToScreen(p.x, p.y); ctx.lineTo(s.x, s.y); }
  ctx.stroke();
  ctx.strokeStyle = 'rgba(120,160,200,0.45)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (const p of Hill.prof) { const s = worldToScreen(p.x, p.y + 0.35); ctx.lineTo(s.x, s.y); }
  ctx.stroke();

  // Weitenmarken alle 10 m, K-/HS-Linien deutlich
  ctx.textBaseline = 'alphabetic';
  for (let d = 20; d <= 130; d += 10) {
    const x = Hill.xAtDistance(d);
    const g = Hill.groundAt(x);
    const a = worldToScreen(x, g.y), th = g.angle * D2R;
    const isK = d === CONFIG.kPoint, isHS = d === CONFIG.hillSize;
    const len = (isK || isHS ? 2.6 : 1.5) * cam.ppm;
    ctx.strokeStyle = isK ? '#ff3d55' : isHS ? '#35d0ff' : 'rgba(90,120,150,0.55)';
    ctx.lineWidth = isK || isHS ? 3 : 1.5;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(a.x + Math.sin(th) * len * 0.4, a.y + Math.cos(th) * len * 0.4);
    ctx.stroke();
    if (cam.ppm > 5 || isK || isHS) {
      ctx.fillStyle = isK ? '#ff3d55' : isHS ? '#35d0ff' : 'rgba(70,100,130,0.8)';
      ctx.font = `${isK || isHS ? '800' : '600'} ${Math.max(10, cam.ppm * 1.05)}px system-ui`;
      ctx.textAlign = 'left';
      ctx.fillText(isK ? 'K ' + d : isHS ? 'HS ' + d : d,
        a.x + Math.sin(th) * len * 0.4 + 5, a.y + Math.cos(th) * len * 0.4 + 4);
    }
  }

  // --- Anlaufturm: schlanke Stahl-Optik mit Akzentlinie ---
  const ir = Hill.inrun;
  const top = worldToScreen(ir[0].x, ir[0].y);
  const edge = worldToScreen(0, 0);
  // Deckband unter der Spur (1,8 m stark), darunter Stützpfeiler
  ctx.fillStyle = '#16283c';
  ctx.beginPath();
  ctx.moveTo(top.x, top.y);
  for (const p of ir) { const s = worldToScreen(p.x, p.y); ctx.lineTo(s.x, s.y); }
  for (let i = ir.length - 1; i >= 0; i -= 4) {
    const s = worldToScreen(ir[i].x, ir[i].y - 1.8);
    ctx.lineTo(s.x, s.y);
  }
  ctx.closePath(); ctx.fill();
  // Stützpfeiler
  ctx.strokeStyle = '#16283c'; ctx.lineWidth = Math.max(3, cam.ppm * 0.5);
  for (const fs of [0.12, 0.4, 0.68, 0.92]) {
    const p = ir[Math.floor(ir.length * fs)];
    const s0 = worldToScreen(p.x, p.y - 1.5);
    ctx.beginPath(); ctx.moveTo(s0.x, s0.y); ctx.lineTo(s0.x, Math.min(H + 20, s0.y + 60 * cam.ppm)); ctx.stroke();
  }
  // Akzentlinie an der Unterkante des Deckbands
  ctx.strokeStyle = '#35d0ff'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (const p of ir) { const s = worldToScreen(p.x, p.y - 1.8); ctx.lineTo(s.x, s.y); }
  ctx.stroke();
  // Anlaufspur mit Doppelrille
  ctx.strokeStyle = '#f4f9fd'; ctx.lineWidth = Math.max(2.5, cam.ppm * 0.34);
  ctx.beginPath();
  for (const p of ir) { const s = worldToScreen(p.x, p.y); ctx.lineTo(s.x, s.y); }
  ctx.stroke();
  ctx.strokeStyle = 'rgba(120,160,200,0.7)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (const p of ir) { const s = worldToScreen(p.x, p.y + 0.06); ctx.lineTo(s.x, s.y); }
  ctx.stroke();
  // Startbalken am Gate
  const gp = worldToScreen(ir[0].x + 0.4, ir[0].y + 1.1);
  ctx.strokeStyle = '#ff3d55'; ctx.lineWidth = Math.max(2, cam.ppm * 0.16);
  ctx.beginPath(); ctx.moveTo(gp.x - cam.ppm * 0.9, gp.y); ctx.lineTo(gp.x + cam.ppm * 0.9, gp.y); ctx.stroke();
  // Tischkante: kräftige rote Markierung (der Absprungpunkt!)
  ctx.strokeStyle = '#ff3d55'; ctx.lineWidth = Math.max(3, cam.ppm * 0.2);
  ctx.beginPath(); ctx.moveTo(edge.x, edge.y - cam.ppm * 0.25); ctx.lineTo(edge.x, edge.y + cam.ppm * 1.1); ctx.stroke();
}

// --- Springer: stilisierte Figur mit VORLAGE über den Ski ---
function drawSkier() {
  const S = Game.skier;
  const p = worldToScreen(S.x, S.y);

  // Speedlines im Flug
  if (Game.state === 'FLIGHT') {
    const v = Math.hypot(S.vx, S.vy);
    if (v > 18) {
      ctx.strokeStyle = 'rgba(255,255,255,0.16)'; ctx.lineWidth = 2;
      const ux = S.vx / v, uy = S.vy / v;
      for (const o of [-0.9, 0.2, 1.1]) {
        const ox = p.x - uy * o * cam.ppm, oy = p.y - ux * o * cam.ppm;
        ctx.beginPath();
        ctx.moveTo(ox - ux * cam.ppm * 1.6, oy + uy * cam.ppm * 1.6);
        ctx.lineTo(ox - ux * cam.ppm * 3.4, oy + uy * cam.ppm * 3.4);
        ctx.stroke();
      }
    }
  }

  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(-S.body * D2R);
  ctx.scale(cam.ppm, cam.ppm);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  const SUIT = '#ff4757', SUIT_D = '#d63447', LEGS = '#22354a', SKI = '#ffd23f', SKI_D = '#e0a800';
  const limb = (x1, y1, x2, y2, color, w) => {
    ctx.strokeStyle = color; ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  };
  const path = (pts, color, w) => {
    ctx.strokeStyle = color; ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.stroke();
  };
  const head = (hx, hy) => {
    ctx.fillStyle = '#f8fafc';
    ctx.beginPath(); ctx.arc(hx, hy, 0.18, 0, 7); ctx.fill();
    ctx.strokeStyle = '#22354a'; ctx.lineWidth = 0.045; ctx.stroke();
    // Visier
    ctx.strokeStyle = '#35d0ff'; ctx.lineWidth = 0.06;
    ctx.beginPath(); ctx.arc(hx, hy, 0.13, -0.5, 0.6); ctx.stroke();
  };
  // Ski mit aufgebogener Spitze
  const ski = (yOff, tipUp, color) => {
    ctx.strokeStyle = color; ctx.lineWidth = 0.15;
    ctx.beginPath();
    ctx.moveTo(-1.05, yOff);
    ctx.lineTo(1.1, yOff - tipUp * 0.4);
    ctx.quadraticCurveTo(1.32, yOff - tipUp * 0.4 - 0.02, 1.42, yOff - tipUp * 0.4 - 0.16);
    ctx.stroke();
  };

  if (S.pose === 'flight') {
    // V-Stil: hinterer Ski flacher, vorderer leicht geöffnet
    ski(0.12, 0.05, SKI_D);
    ski(0.0, 0.25, SKI);
    // Beine: Bindung → Knie → Hüfte (Hüfte hinten-oben)
    path([[0.05, 0], [-0.05, -0.3], [-0.42, -0.5]], LEGS, 0.17);
    // Torso: Hüfte → Schulter, deutlich NACH VORN über die Ski gestreckt
    path([[-0.42, -0.5], [0.52, -0.78]], SUIT, 0.24);
    // Arme: eng am Körper nach hinten angelegt
    path([[0.38, -0.72], [-0.3, -0.5]], SUIT_D, 0.11);
    head(0.72, -0.85);
  } else if (S.pose === 'crouch') {
    ski(0.1, 0, SKI_D);
    ski(0.0, 0, SKI);
    // tiefe Hocke: kompakt, Rücken flach
    path([[0.05, 0], [-0.12, -0.32], [-0.28, -0.5]], LEGS, 0.17);
    path([[-0.28, -0.5], [0.5, -0.62]], SUIT, 0.24);
    path([[0.34, -0.58], [0.62, -0.3]], SUIT_D, 0.11);
    head(0.68, -0.72);
  } else if (S.pose === 'telemark') {
    ski(0.1, 0, SKI_D);
    ski(0.0, 0, SKI);
    path([[0.42, 0], [0.46, -0.36], [0.08, -0.58]], LEGS, 0.17);   // vorderes Bein
    path([[-0.5, 0], [-0.32, -0.26], [0.08, -0.58]], LEGS, 0.15);  // hinteres Bein gebeugt
    path([[0.08, -0.58], [0.14, -1.08]], SUIT, 0.24);              // Torso aufrecht
    limb(0.12, -1.0, 0.58, -0.82, SUIT_D, 0.11);                   // Arme ausbalancierend
    limb(0.12, -1.0, -0.4, -0.86, SUIT_D, 0.11);
    head(0.17, -1.27);
  } else if (S.pose === 'landed') {
    ski(0.1, 0, SKI_D);
    ski(0.0, 0, SKI);
    path([[0.08, 0], [-0.02, -0.5], [0.14, -1.05]], LEGS, 0.18);
    path([[0.0, -0.55], [0.16, -1.05]], SUIT, 0.24);
    limb(0.14, -1.0, 0.5, -0.72, SUIT_D, 0.11);
    head(0.22, -1.25);
  } else { // crash
    const wob = Math.sin(Game.time * 30) * 0.15;
    ski(0.15, 0.3, SKI_D);
    ski(-0.05, -0.2, SKI);
    path([[0, 0], [-0.3 + wob, -0.5], [0.4, -0.8 - wob]], LEGS, 0.17);
    limb(0.4, -0.8, 0.9, -0.5 + wob, SUIT, 0.2);
    limb(0.4, -0.8, -0.1, -1.1 - wob, SUIT_D, 0.11);
    head(0.62, -1.0);
  }
  ctx.restore();
}

function drawParticles() {
  for (const p of Game.particles) {
    const s = worldToScreen(p.x, p.y);
    ctx.globalAlpha = clamp(p.life * 2, 0, 0.85);
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(s.x, s.y, Math.max(1.5, cam.ppm * 0.11), 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// --- HUD ---
function pillRect(x, y, w, h) {
  ctx.fillStyle = 'rgba(10,22,38,0.6)';
  roundRect(x, y, w, h, h / 2);
  ctx.strokeStyle = 'rgba(160,220,255,0.28)'; ctx.lineWidth = 1;
  ctx.stroke();
}

function drawHUD() {
  const S = Game.skier;
  const ui = clamp(Math.min(W, H) / 420, 0.9, 1.5);
  const pad = 14 * ui, ph = 30 * ui;

  // --- Wind-Pill (oben links): Pfeil + Wert ---
  const w = Game.currentWind();
  const windW = 172 * ui;
  pillRect(pad, pad, windW, ph);
  const windCol = Math.abs(w) < 0.15 ? '#9fb8cc' : (w < 0 ? '#5cffa8' : '#ff7a7a');
  // Pfeil (Richtung der Luftbewegung: → = Rückenwind, ← = Gegenwind)
  const ax = pad + 18 * ui, ay = pad + ph / 2;
  const dir = w >= 0 ? 1 : -1, alen = (6 + Math.abs(w) / CONFIG.windStrength * 8) * ui;
  ctx.strokeStyle = windCol; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(ax - alen * dir, ay); ctx.lineTo(ax + alen * dir, ay);
  ctx.moveTo(ax + (alen - 5 * ui) * dir, ay - 4 * ui); ctx.lineTo(ax + alen * dir, ay);
  ctx.lineTo(ax + (alen - 5 * ui) * dir, ay + 4 * ui);
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = `700 ${13 * ui}px system-ui`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  const windTxt = Math.abs(w) < 0.15 ? 'windstill'
    : `${Math.abs(w).toFixed(1).replace('.', ',')} m/s ${w < 0 ? 'Gegenwind' : 'Rückenwind'}`;
  ctx.fillText(windTxt, ax + 16 * ui, ay + 0.5);

  // --- Tempo-Pill (daneben) ---
  if (Game.state === 'INRUN' || Game.state === 'FLIGHT' || Game.state === 'OUTRUN') {
    const spd = Game.state === 'FLIGHT' ? Math.hypot(S.vx, S.vy) : S.v;
    const px = pad + windW + 8 * ui, pw = 86 * ui;
    pillRect(px, pad, pw, ph);
    ctx.fillStyle = '#9be8ff';
    ctx.font = `800 ${13 * ui}px system-ui`;
    ctx.textAlign = 'center';
    ctx.fillText(`${(spd * 3.6).toFixed(0)} km/h`, px + pw / 2, pad + ph / 2 + 0.5);
  }

  // --- Best-Pill (oben rechts) ---
  if (Game.best) {
    const bw = 112 * ui;
    pillRect(W - bw - pad, pad, bw, ph);
    ctx.fillStyle = '#ffd35c';
    ctx.font = `700 ${13 * ui}px system-ui`;
    ctx.textAlign = 'center';
    ctx.fillText(`★ ${Game.best.dist.toFixed(1).replace('.', ',')} m`, W - bw / 2 - pad, pad + ph / 2 + 0.5);
  }

  // --- zentrale Meldung mit Pop ---
  if (Game.time < Game.message.until) {
    const m = Game.message;
    const alpha = clamp((m.until - Game.time) / 0.3, 0, 1);
    const popT = clamp((Game.time - m.start) / 0.18, 0, 1);
    const scale = 1 + 0.35 * (1 - smoothstep(popT));
    ctx.save();
    ctx.translate(W / 2, H * 0.24);
    ctx.scale(scale, scale);
    ctx.globalAlpha = alpha;
    ctx.font = `900 ${30 * ui}px system-ui`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.strokeStyle = 'rgba(5,15,30,0.5)'; ctx.lineWidth = 5;
    ctx.strokeText(m.text, 0, 0);
    ctx.fillStyle = m.color;
    ctx.fillText(m.text, 0, 0);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // --- Weiten-Popup: schwebt über dem Springer ---
  if (Game.popup) {
    const age = Game.time - Game.popup.t0;
    if (age < 2.2) {
      const p = worldToScreen(S.x, S.y + 3 + age * 1.2);
      ctx.globalAlpha = clamp(2.2 - age, 0, 1) * clamp(age * 6, 0, 1);
      ctx.font = `900 ${34 * ui}px system-ui`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.strokeStyle = 'rgba(5,15,30,0.55)'; ctx.lineWidth = 6;
      ctx.strokeText(Game.popup.text, p.x, p.y);
      ctx.fillStyle = Game.popup.crashed ? '#ff7a7a' : '#ffffff';
      ctx.fillText(Game.popup.text, p.x, p.y);
      ctx.globalAlpha = 1;
    }
  }

  // --- Start-Hinweis am Gate ---
  if (Game.state === 'GATE' && !Tutorial.active) {
    ctx.globalAlpha = 0.65 + Math.sin(Game.time * 4) * 0.35;
    ctx.fillStyle = '#fff';
    ctx.font = `800 ${19 * ui}px system-ui`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('TIPPEN ZUM START', W / 2, H * 0.72);
    ctx.globalAlpha = 1;
  }

  // --- Fluglagen-Korridor (rechts) ---
  if (Game.state === 'FLIGHT') {
    const gw = 12 * ui, gh = Math.min(H * 0.36, 230);
    const gx = W - gw - 18, gy = (H - gh) / 2;
    const mapA = a => gy + gh * (1 - (a + 15) / 50);   // Skala: -15° … +35°
    // Track
    ctx.fillStyle = 'rgba(10,22,38,0.55)';
    roundRect(gx - 4, gy - 8, gw + 8, gh + 16, (gw + 8) / 2);
    // Korridor mit Glow
    const c0 = mapA(CONFIG.optimalAngle - CONFIG.angleTolerance);
    const c1 = mapA(CONFIG.optimalAngle + CONFIG.angleTolerance);
    ctx.fillStyle = 'rgba(50,220,130,0.9)';
    roundRect(gx, c1, gw, c0 - c1, gw / 2);
    // Nadel
    const inCorr = Math.abs(Game.flight.alpha - CONFIG.optimalAngle) <= CONFIG.angleTolerance;
    const ny = clamp(mapA(Game.flight.alpha), gy - 4, gy + gh + 4);
    ctx.save();
    ctx.shadowColor = inCorr ? '#5cffa8' : '#ff7a7a';
    ctx.shadowBlur = 10;
    ctx.fillStyle = inCorr ? '#eafff3' : '#ffdfdf';
    roundRect(gx - 6, ny - 3, gw + 12, 6, 3);
    ctx.restore();
    // Landefenster-Hinweis
    if (Game.landingTap.windowOpen) {
      ctx.globalAlpha = 0.55 + Math.sin(Game.time * 18) * 0.45;
      ctx.fillStyle = '#ffd35c';
      ctx.font = `900 ${23 * ui}px system-ui`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('JETZT TIPPEN!', W / 2, H * 0.68);
      ctx.globalAlpha = 1;
    }
  }

  // --- Debug (Taste D) ---
  if (Game.debug) {
    const g = Hill.groundAt(S.x);
    const spd = Game.state === 'FLIGHT' ? Math.hypot(S.vx, S.vy) : S.v;
    const lines = [
      `state: ${Game.state}  tut: ${Tutorial.active ? Tutorial.step : '-'}`,
      `v: ${spd.toFixed(1)} m/s (${(spd * 3.6).toFixed(0)} km/h)`,
      `pos: ${S.x.toFixed(1)} / ${S.y.toFixed(1)}   h: ${(S.y - g.y).toFixed(1)} m`,
      `alpha: ${Game.flight.alpha.toFixed(1)}°   body: ${S.body.toFixed(1)}°`,
      `lift: ${Game.flight.lift.toFixed(2)}   drag: ${Game.flight.drag.toFixed(2)}`,
      `wind: ${Game.currentWind().toFixed(2)} m/s   tta: ${Game.landingTap.tta.toFixed(2)} s`,
      `korridor: ${(Game.flight.time ? Game.flight.corridorTime / Game.flight.time * 100 : 0).toFixed(0)} %  ppm: ${cam.ppm.toFixed(1)}`,
    ];
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    roundRect(10, H - 26 - lines.length * 16, 320, lines.length * 16 + 12, 6);
    ctx.fillStyle = '#b2ff59';
    ctx.font = '12px ui-monospace, monospace';
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    lines.forEach((l, i) => ctx.fillText(l, 18, H - 20 - (lines.length - 1 - i) * 16));
  }
  ctx.textBaseline = 'alphabetic';
}

function roundRect(x, y, w, h, r) {
  r = Math.min(r, h / 2, w / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath(); ctx.fill();
}

// ------------------------------------------------------------------ Loop
let last = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now;
  dt = Math.min(dt, 0.25);
  acc += dt;
  while (acc >= CONFIG.timestep) {
    Game.update(CONFIG.timestep);
    Tutorial.update();
    acc -= CONFIG.timestep;
  }
  updateCamera(dt);
  drawBackground();
  drawHill();
  drawParticles();
  drawSkier();
  ctx.fillStyle = vignette; ctx.fillRect(0, 0, W, H);
  drawHUD();
}

// ------------------------------------------------------------------ UI-Verdrahtung
const startPanel = document.getElementById('startPanel');
const resultPanel = document.getElementById('resultPanel');
const resTitle = document.getElementById('resTitle');
const resDist = document.getElementById('resDist');
const pDist = document.getElementById('pDist');
const pFlight = document.getElementById('pFlight');
const pLand = document.getElementById('pLand');
const resTotal = document.getElementById('resTotal');
const resLanding = document.getElementById('resLanding');
const resWind = document.getElementById('resWind');
const resBest = document.getElementById('resBest');
const tutCard = document.getElementById('tutCard');
const tutStep = document.getElementById('tutStep');
const tutText = document.getElementById('tutText');
const tutGo = document.getElementById('tutGo');
const show = el => el.classList.remove('hidden');
const hide = el => el.classList.add('hidden');

document.getElementById('startBtn').addEventListener('click', () => Game.newJump());
document.getElementById('nextBtn').addEventListener('click', () => Game.newJump());
window.addEventListener('keydown', e => {
  if ((e.key === ' ' || e.key === 'Enter') && (Game.state === 'MENU' || Game.state === 'RESULT')) {
    e.preventDefault();
    Game.newJump();
  }
});
if (Game.best)
  document.getElementById('startBest').textContent =
    `Bestleistung: ${Game.best.dist.toFixed(1).replace('.', ',')} m · ${Game.best.total.toFixed(1)} Pkt.`;

// Springer für den Startbildschirm ans Gate setzen
{
  const start = Hill.inrunAt(0);
  Object.assign(Game.skier, { x: start.x, y: start.y, body: -start.angle, pose: 'crouch' });
  cam.x = start.x + 5; cam.y = start.y - 2;
  cam.ppm = Math.min(W / CONFIG.camGateView, H / (CONFIG.camGateView * 0.82));
}

// Alten Service-Worker (aus früherem Projekt auf dieser Domain) entfernen,
// damit keine gecachte Fremd-Version ausgeliefert wird.
if ('serviceWorker' in navigator)
  navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});

requestAnimationFrame(frame);
</script>
