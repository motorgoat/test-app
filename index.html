    torso: [0.02, -0.6, 0.16, -1.05],
    arm1: [0.14, -1.0, 0.5, -0.72], arm2: [0.14, -1.0, -0.2, -0.75],
    head: [0.22, -1.25], skiV: 0,
  },
  brake: { // Schneepflug: tief, Arme vor dem Körper, leicht zurückgelehnt
    legF: [0.18, 0, 0.28, -0.28, -0.08, -0.5], legB: [-0.12, 0, 0.0, -0.26, -0.08, -0.5],
    torso: [-0.08, -0.5, 0.12, -0.92],
    arm1: [0.1, -0.86, 0.48, -0.62], arm2: [0.08, -0.84, 0.4, -0.58],
    head: [0.2, -1.1], skiV: 0,
  },
};
const mixArr = (a, b, t) => a.map((v, i) => lerp(v, b[i], t));

function drawSkier() {
  const S = Game.skier;
  if (S.crash && Ragdoll.active) { drawRagdoll(); return; }
  const p = renToScreen(S.x, S.y);

  // Speedlines im Flug
  if (Game.state === 'FLIGHT') {
    const v = Math.hypot(S.vx, S.vy);
    if (v > 18) {
      ctx.strokeStyle = 'rgba(255,255,255,0.16)'; ctx.lineWidth = 2;
      const ux = S.vx / v, uy = S.vy / v;
      for (const o of [-0.9, 0.2, 1.1]) {
        const ox = p.x - uy * o * cam.ppm, oy = p.y - ux * o * cam.ppm;
        ctx.beginPath();
        ctx.moveTo(ox - ux * cam.ppm * 1.6, oy + uy * cam.ppm * 1.6);
        ctx.lineTo(ox - ux * cam.ppm * 3.4, oy + uy * cam.ppm * 3.4);
        ctx.stroke();
      }
    }
  }

  // Turbulenz-Zittern: außerhalb des Winkel-Korridors flattert die Figur –
  // das ERSETZT den Regler als Feedback für die Fluglage.
  let jitter = 0;
  if (Game.state === 'FLIGHT' && !Game.flight.stance && Game.flight.time > 0.3) {
    const dev = Math.abs(S.alphaCtl - CONFIG.optimalAngle) / CONFIG.angleTolerance;
    if (dev > 1) jitter = Math.min(dev - 1, 1.6) * 2.2 * Math.sin(Game.time * 34);
  }

  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(-(S.body + jitter) * D2R);
  ctx.scale(cam.ppm * 1.12, cam.ppm * 1.12); // Figur leicht größer
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  const SUIT = '#ff4757', SUIT_D = '#d63447', LEGS = '#22354a',
        SKI = '#ffd23f', SKI_D = '#e0a800', OUT = '#12212f';
  // Gliedmaßen mit dunkler Kontur (Vektor-Look)
  const limb = (pts, color, w) => {
    ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
    for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
    ctx.strokeStyle = OUT; ctx.lineWidth = w + 0.07; ctx.stroke();
    ctx.strokeStyle = color; ctx.lineWidth = w; ctx.stroke();
  };
  const head = (hx, hy) => {
    // Helm
    ctx.fillStyle = '#f8fafc';
    ctx.strokeStyle = OUT; ctx.lineWidth = 0.05;
    ctx.beginPath(); ctx.arc(hx, hy, 0.2, 0, 7); ctx.fill(); ctx.stroke();
    // Visier (dunkler Keil in Blickrichtung)
    ctx.fillStyle = '#35d0ff';
    ctx.beginPath();
    ctx.moveTo(hx + 0.03, hy - 0.11);
    ctx.quadraticCurveTo(hx + 0.27, hy - 0.05, hx + 0.18, hy + 0.08);
    ctx.lineTo(hx + 0.03, hy + 0.03);
    ctx.closePath(); ctx.fill();
    // Helmstreifen
    ctx.strokeStyle = '#ff4757'; ctx.lineWidth = 0.05;
    ctx.beginPath(); ctx.arc(hx, hy, 0.155, Math.PI * 0.75, Math.PI * 1.45); ctx.stroke();
  };
  const ski = (yOff, tipUp, color, xOff = 0) => { // Bindung hinten: viel Ski vor dem Fuß
    ctx.beginPath();
    ctx.moveTo(-0.85 + xOff, yOff);
    ctx.lineTo(1.68 + xOff, yOff - tipUp * 0.42);
    ctx.quadraticCurveTo(1.92 + xOff, yOff - tipUp * 0.42 - 0.02, 2.02 + xOff, yOff - tipUp * 0.42 - 0.17);
    ctx.strokeStyle = OUT; ctx.lineWidth = 0.21; ctx.stroke();
    ctx.strokeStyle = color; ctx.lineWidth = 0.14; ctx.stroke();
  };
  const boot = (bx, by) => {
    ctx.fillStyle = OUT;
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(bx - 0.1, by - 0.13, 0.26, 0.15, 0.04) : ctx.rect(bx - 0.1, by - 0.13, 0.26, 0.15);
    ctx.fill();
  };

  {
    // Ease-out für knackige Streckung beim Absprung
    const t = 1 - Math.pow(1 - S.poseT, 3);
    const A = POSES[S.poseA], B = POSES[S.poseB];
    const legF = mixArr(A.legF, B.legF, t), legB = mixArr(A.legB, B.legB, t);
    const torso = mixArr(A.torso, B.torso, t);
    const arm1 = mixArr(A.arm1, B.arm1, t), arm2 = mixArr(A.arm2, B.arm2, t);
    const hd = mixArr(A.head, B.head, t);
    let skiV = lerp(A.skiV, B.skiV, t);
    const split = lerp(A.skiSplit || 0, B.skiSplit || 0, t);

    // Haltungs-Morph: die Figur zeigt den Anstellwinkel deutlich –
    // hoher alpha = aufgerichtet + Ski-V weit offen, niedriger = flacher Vorwärtsdruck
    if (Game.state === 'FLIGHT' && S.poseB === 'flight') {
      const dev = clamp((S.alphaCtl - CONFIG.optimalAngle) / 10, -1, 1) * t;
      torso[3] -= dev * 0.38;
      hd[1] -= dev * 0.46; hd[0] -= Math.max(0, dev) * 0.26;
      arm1[1] -= dev * 0.28; arm2[1] -= dev * 0.26;
      legF[5] -= dev * 0.16; legB[5] -= dev * 0.16;
      skiV = clamp(skiV + dev * 0.9, -0.3, 1.8);
    }

    ski(0.12, skiV * 0.07, SKI_D, -split * 0.34); // hinterer Ski zurück
    ski(0.0, skiV * 0.32, SKI, split * 0.52);     // vorderer Ski nach vorn
    boot(legF[0] + split * 0.4 + 0.02, 0.0);       // Schuh vorn (Knöchel im Block)
    limb(legB, LEGS, 0.15);
    limb(legF, LEGS, 0.17);
    limb(arm2, SUIT_D, 0.1);
    limb(torso, SUIT, 0.25);
    // weißer Zierstreifen auf dem Anzug
    ctx.globalAlpha = 0.6;
    ctx.strokeStyle = '#ffe3e6'; ctx.lineWidth = 0.06;
    ctx.beginPath(); ctx.moveTo(torso[0], torso[1] + 0.06); ctx.lineTo(torso[2], torso[3] + 0.06); ctx.stroke();
    ctx.globalAlpha = 1;
    limb(arm1, SUIT_D, 0.11);
    // Handschuh
    ctx.fillStyle = OUT;
    ctx.beginPath(); ctx.arc(arm1[2], arm1[3], 0.08, 0, 7); ctx.fill();
    head(hd[0], hd[1]);
  }
  ctx.restore();
}

// --- Ragdoll zeichnen (ersetzt die Figur bei Stürzen) ---
function drawRagdoll() {
  const P = Ragdoll.pts, K = Ragdoll.skiPts;
  const w2s = p => renToScreen(p.x, p.y);
  const OUT = '#12212f';
  const line = (a, b, color, w) => { // mit dunkler Kontur wie das Spielermodell
    const A = w2s(a), B = w2s(b);
    ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y);
    ctx.strokeStyle = OUT; ctx.lineWidth = Math.max(3, (w + 0.07) * cam.ppm); ctx.stroke();
    ctx.strokeStyle = color; ctx.lineWidth = Math.max(2, w * cam.ppm); ctx.stroke();
  };
  ctx.lineCap = 'round';
  // Ski (frei fliegend)
  line(K[0], K[1], '#ffd23f', 0.14);
  line(K[2], K[3], '#e0a800', 0.14);
  // Beine, Torso, Arm
  line(P[0], P[3], '#22354a', 0.17);
  line(P[0], P[4], '#22354a', 0.15);
  line(P[0], P[1], '#ff4757', 0.25);
  line(P[1], P[5], '#d63447', 0.11);
  // Schuhe an den Füßen
  ctx.fillStyle = OUT;
  for (const f of [P[3], P[4]]) {
    const b = w2s(f);
    ctx.beginPath(); ctx.arc(b.x, b.y, Math.max(2.5, 0.11 * cam.ppm), 0, 7); ctx.fill();
  }
  // Helm mit Visier
  const h = w2s(P[2]);
  const r = Math.max(3, 0.2 * cam.ppm * 1.12);
  ctx.fillStyle = '#f8fafc';
  ctx.beginPath(); ctx.arc(h.x, h.y, r, 0, 7); ctx.fill();
  ctx.strokeStyle = OUT; ctx.lineWidth = Math.max(1.5, 0.05 * cam.ppm); ctx.stroke();
  ctx.fillStyle = '#35d0ff';
  ctx.beginPath(); ctx.arc(h.x + r * 0.35, h.y, r * 0.45, -0.9, 0.9); ctx.fill();
}

// --- Effektringe (Absprung) ---
function drawFX() {
  for (const f of Game.fx) {
    const age = Game.time - f.t0;
    if (age < 0 || age > 0.6) continue;
    const p = renToScreen(f.x, f.y);
    ctx.globalAlpha = (1 - age / 0.6) * 0.9;
    ctx.strokeStyle = f.color;
    ctx.lineWidth = 3.5 * (1 - age / 0.6) + 1;
    ctx.beginPath();
    ctx.arc(p.x, p.y, (0.5 + age * 9) * cam.ppm, 0, 7);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawParticles() {
  for (const p of Game.particles) {
    const s = renToScreen(p.x, p.y);
    ctx.globalAlpha = clamp(p.life * 2, 0, 0.85);
    ctx.fillStyle = p.color || '#ffffff';
    ctx.beginPath(); ctx.arc(s.x, s.y, Math.max(1.5, cam.ppm * 0.11), 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// --- HUD ---
function pillRect(x, y, w, h) {
  ctx.fillStyle = 'rgba(10,22,38,0.6)';
  roundRect(x, y, w, h, h / 2);
  ctx.strokeStyle = 'rgba(160,220,255,0.28)'; ctx.lineWidth = 1;
  ctx.stroke();
}

function drawHUD() {
  const S = Game.skier;
  const ui = clamp(Math.min(W, H) / 370, 0.95, 1.6);
  const pad = 14 * ui, ph = 30 * ui;

  // --- Wind-Pill (oben links): Pfeil + Wert ---
  const w = Game.currentWind();
  const windW = 172 * ui;
  pillRect(pad, pad, windW, ph);
  const windCol = Math.abs(w) < 0.15 ? '#9fb8cc' : (w < 0 ? '#5cffa8' : '#ff7a7a');
  // Pfeil (Richtung der Luftbewegung: → = Rückenwind, ← = Gegenwind)
  const ax = pad + 18 * ui, ay = pad + ph / 2;
  const dir = w >= 0 ? 1 : -1, alen = (6 + Math.abs(w) / CONFIG.windStrength * 8) * ui;
  ctx.strokeStyle = windCol; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(ax - alen * dir, ay); ctx.lineTo(ax + alen * dir, ay);
  ctx.moveTo(ax + (alen - 5 * ui) * dir, ay - 4 * ui); ctx.lineTo(ax + alen * dir, ay);
  ctx.lineTo(ax + (alen - 5 * ui) * dir, ay + 4 * ui);
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = `700 ${13 * ui}px system-ui`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  const windTxt = Math.abs(w) < 0.15 ? 'windstill'
    : `${Math.abs(w).toFixed(1).replace('.', ',')} m/s ${w < 0 ? 'Gegenwind' : 'Rückenwind'}`;
  ctx.fillText(windTxt, ax + 16 * ui, ay + 0.5);

  // --- Tempo-Pill (zweite Zeile links – kollidiert nie mit der Best-Pill) ---
  if (Game.state === 'INRUN' || Game.state === 'FLIGHT' || Game.state === 'OUTRUN') {
    const spd = Game.state === 'FLIGHT' ? Math.hypot(S.vx, S.vy) : S.v;
    const px = pad, pw = 86 * ui, py = pad + ph + 6 * ui;
    pillRect(px, py, pw, 24 * ui);
    ctx.fillStyle = '#9be8ff';
    ctx.font = `800 ${12 * ui}px system-ui`;
    ctx.textAlign = 'center';
    ctx.fillText(`${(spd * 3.6).toFixed(0)} km/h`, px + pw / 2, py + 12 * ui + 0.5);
  }

  // --- Best-Pill (oben rechts) + Durchgangs-Anzeige darunter ---
  if (Game.best) {
    const bw = 112 * ui;
    pillRect(W - bw - pad, pad, bw, ph);
    ctx.fillStyle = '#ffd35c';
    ctx.font = `700 ${13 * ui}px system-ui`;
    ctx.textAlign = 'center';
    ctx.fillText(`★ ${Game.best.dist.toFixed(1).replace('.', ',')} m`, W - bw / 2 - pad, pad + ph / 2 + 0.5);
  }
  if (Game.mode === 'comp') {
    const rw = 74 * ui, ry = pad + ph + 6 * ui;
    pillRect(W - rw - pad, ry, rw, 24 * ui);
    ctx.fillStyle = '#9be8ff';
    ctx.font = `800 ${11 * ui}px system-ui`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(`DG ${Game.round}/2`, W - rw / 2 - pad, ry + 12 * ui + 0.5);
  }

  // --- zentrale Meldung mit Pop ---
  if (Game.time < Game.message.until) {
    const m = Game.message;
    const alpha = clamp((m.until - Game.time) / 0.3, 0, 1);
    const popT = clamp((Game.time - m.start) / 0.18, 0, 1);
    const scale = 1 + 0.35 * (1 - smoothstep(popT));
    ctx.save();
    ctx.translate(W / 2, H * 0.24);
    ctx.scale(scale, scale);
    ctx.globalAlpha = alpha;
    ctx.font = `900 ${30 * ui}px system-ui`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.strokeStyle = 'rgba(5,15,30,0.5)'; ctx.lineWidth = 5;
    ctx.strokeText(m.text, 0, 0);
    ctx.fillStyle = m.color;
    ctx.fillText(m.text, 0, 0);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // --- Weiten-Popup: schwebt über dem Springer ---
  if (Game.popup) {
    const age = Game.time - Game.popup.t0;
    if (age < 2.2) {
      const p = renToScreen(S.x, S.y + 3 + age * 1.2);
      ctx.globalAlpha = clamp(2.2 - age, 0, 1) * clamp(age * 6, 0, 1);
      ctx.font = `900 ${34 * ui}px system-ui`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.strokeStyle = 'rgba(5,15,30,0.55)'; ctx.lineWidth = 6;
      ctx.strokeText(Game.popup.text, p.x, p.y);
      ctx.fillStyle = Game.popup.crashed ? '#ff7a7a' : '#ffffff';
      ctx.fillText(Game.popup.text, p.x, p.y);
      ctx.globalAlpha = 1;
    }
  }

  // --- Start-Hinweis am Gate ---
  if (Game.state === 'GATE' && !Tutorial.active) {
    ctx.globalAlpha = 0.65 + Math.sin(Game.time * 4) * 0.35;
    ctx.fillStyle = '#fff';
    ctx.font = `800 ${19 * ui}px system-ui`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('TIPPEN ZUM START', W / 2, H * 0.72);
    ctx.globalAlpha = 1;
  }

  // (Kein Fluglagen-Regler mehr: die Haltung des Springers selbst zeigt den
  //  Winkel – bei falscher Lage zittert die Figur sichtbar in der Anströmung.)

  // --- Live-Ergebnis unter dem Springer, während er ausfährt ---
  if ((Game.state === 'RESULT' || Game.state === 'OUTRUN') && Game.result && Game.outrunTimer > 0.9) {
    const r = Game.result, ot = Game.outrunTimer;
    const sp = renToScreen(S.x, S.y);
    const cx = clamp(sp.x, 130 * ui, W - 130 * ui);
    let y = clamp(sp.y + 60 * ui, 76 * ui, H - 190 * ui);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    // 0) Weite – sofort und dauerhaft sichtbar
    ctx.font = `900 ${30 * ui}px system-ui`;
    ctx.strokeStyle = 'rgba(5,15,30,0.55)'; ctx.lineWidth = 5;
    const dTxt = r.dist.toFixed(1).replace('.', ',') + ' m';
    ctx.strokeText(dTxt, cx, y - 14 * ui);
    ctx.fillStyle = r.crashed ? '#ff8a8a' : '#ffffff';
    ctx.fillText(dTxt, cx, y - 14 * ui);
    y += 22 * ui;
    // 1) Jury-Noten nacheinander (Streichresultate werden dann abgedunkelt)
    const cardW = 42 * ui, cardH = 27 * ui, gap = 5 * ui;
    const row = 5 * cardW + 4 * gap;
    const allShown = ot > 1.0 + 4 * 0.35 + 0.35;
    for (let i = 0; i < 5; i++) {
      const a = ot - (1.0 + i * 0.35);
      if (a < 0) continue;
      const pop = 1 + 0.35 * Math.max(0, 1 - a / 0.15);
      const dropped = allShown && (i === r.dropA || i === r.dropB);
      const x0 = cx - row / 2 + i * (cardW + gap) + cardW / 2;
      ctx.save();
      ctx.translate(x0, y + cardH / 2);
      ctx.scale(pop, pop);
      ctx.globalAlpha = dropped ? 0.35 : 1;
      ctx.fillStyle = 'rgba(10,22,38,0.78)';
      roundRect(-cardW / 2, -cardH / 2, cardW, cardH, 6 * ui);
      ctx.strokeStyle = 'rgba(160,220,255,0.3)'; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = dropped ? '#8fa8bf' : '#ffffff';
      ctx.font = `800 ${13 * ui}px system-ui`;
      ctx.fillText(r.notes[i].toFixed(1).replace('.', ','), 0, 0.5);
      if (dropped) {
        ctx.strokeStyle = '#ff7a7a'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(-cardW * 0.32, 0); ctx.lineTo(cardW * 0.32, 0); ctx.stroke();
      }
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    // 2) Punkte + Platzierung
    if (ot > 2.9) {
      const fade = clamp((ot - 2.9) / 0.3, 0, 1);
      ctx.globalAlpha = fade;
      y += cardH + 26 * ui;
      ctx.font = `900 ${24 * ui}px system-ui`;
      ctx.strokeStyle = 'rgba(5,15,30,0.55)'; ctx.lineWidth = 4;
      const ptsTxt = `${r.total.toFixed(1).replace('.', ',')} PUNKTE`;
      ctx.strokeText(ptsTxt, cx, y);
      ctx.fillStyle = '#ffffff';
      ctx.fillText(ptsTxt, cx, y);
      y += 26 * ui;
      if (Game.mode === 'comp') {
        ctx.font = `800 ${16 * ui}px system-ui`;
        const placeTxt = `${Game.round === 2 ? 'Endstand' : 'Zwischenstand'}: Platz ${r.rank} von ${CONFIG.fieldSize}`;
        ctx.strokeText(placeTxt, cx, y);
        ctx.fillStyle = '#ffd35c';
        ctx.fillText(placeTxt, cx, y);
      }
      if (Game.round === 2 && r.sum != null) {
        y += 22 * ui;
        ctx.font = `700 ${13 * ui}px system-ui`;
        const sumTxt = `Gesamt: ${r.sum.toFixed(1).replace('.', ',')} Punkte${r.record ? ' · NEUER REKORD!' : ''}`;
        ctx.strokeText(sumTxt, cx, y);
        ctx.fillStyle = r.record ? '#5cffa8' : '#cfe6f8';
        ctx.fillText(sumTxt, cx, y);
      }
      ctx.globalAlpha = 1;
    }
  }

  // --- Debug (Taste D) ---
  if (Game.debug) {
    const g = Hill.groundAt(S.x);
    const spd = Game.state === 'FLIGHT' ? Math.hypot(S.vx, S.vy) : S.v;
    const lines = [
      `state: ${Game.state}  tut: ${Tutorial.active ? Tutorial.step : '-'}`,
      `v: ${spd.toFixed(1)} m/s (${(spd * 3.6).toFixed(0)} km/h)`,
      `pos: ${S.x.toFixed(1)} / ${S.y.toFixed(1)}   h: ${(S.y - g.y).toFixed(1)} m`,
      `alpha: ${Game.flight.alpha.toFixed(1)}°   body: ${S.body.toFixed(1)}°`,
      `lift: ${Game.flight.lift.toFixed(2)}   drag: ${Game.flight.drag.toFixed(2)}`,
      `wind: ${Game.currentWind().toFixed(2)} m/s   tta: ${Game.landingTap.tta.toFixed(2)} s`,
      `korridor: ${(Game.flight.time ? Game.flight.corridorTime / Game.flight.time * 100 : 0).toFixed(0)} %  ppm: ${cam.ppm.toFixed(1)}`,
    ];
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    roundRect(10, H - 26 - lines.length * 16, 320, lines.length * 16 + 12, 6);
    ctx.fillStyle = '#b2ff59';
    ctx.font = '12px ui-monospace, monospace';
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    lines.forEach((l, i) => ctx.fillText(l, 18, H - 20 - (lines.length - 1 - i) * 16));
  }
  ctx.textBaseline = 'alphabetic';
}

function roundRect(x, y, w, h, r) {
  r = Math.min(r, h / 2, w / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath(); ctx.fill();
}

// --- Retro-Finish: Bayer-Dithering mit begrenzter Palette über die Welt.
// Aus weichen Verläufen werden klassisch gerasterte Farbbänder – echter Pixel-Art-Look.
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
function posterizeWorld() {
  if (!CONFIG.pixelLevels) return;
  const w = canvas.width, h = canvas.height;
  const img = wctx.getImageData(0, 0, w, h);
  const d = img.data;
  const step = 255 / (CONFIG.pixelLevels - 1);
  const amp = step * CONFIG.ditherAmount; // schmale Dither-Zonen statt Vollflächen-Rauschen
  for (let y = 0; y < h; y++) {
    const by = (y & 3) << 2;
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) << 2;
      const t = (BAYER[by | (x & 3)] / 16 - 0.5) * amp;
      d[i]     = Math.max(0, Math.min(255, Math.round((d[i]     + t) / step) * step));
      d[i + 1] = Math.max(0, Math.min(255, Math.round((d[i + 1] + t) / step) * step));
      d[i + 2] = Math.max(0, Math.min(255, Math.round((d[i + 2] + t) / step) * step));
    }
  }
  wctx.putImageData(img, 0, 0);
}

// ------------------------------------------------------------------ Loop
let last = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now;
  dt = Math.min(dt, 0.25);
  acc += dt;
  while (acc >= CONFIG.timestep) {
    Game.update(CONFIG.timestep);
    Tutorial.update();
    acc -= CONFIG.timestep;
  }
  updateCamera(dt);
  // Wind-Sound: Pegel und Frequenz folgen Tempo und Phase
  {
    const S = Game.skier;
    let lvl = 0.02, frq = 400;
    if (Game.state === 'FLIGHT') {
      const spd = Math.hypot(S.vx, S.vy);
      lvl = clamp((spd - 10) / 45, 0, 1) * 0.32;
      frq = 380 + spd * 9;
    } else if (Game.state === 'INRUN' || Game.state === 'OUTRUN') {
      lvl = clamp(S.v / 26, 0, 1) * 0.18;
      frq = 280 + S.v * 7;
    }
    Sound.wind(lvl, frq);
  }
  // Welt-Ebene: niedrig aufgelöst, pixelig
  ctx = wctx;
  drawBackground();
  drawHill();
  drawTrees();
  drawBuildings();
  drawCrowd();
  drawFlag(Hill.xAtDistance(CONFIG.kPoint), '#ff3d55');
  drawFlag(Hill.xAtDistance(CONFIG.hillSize), '#35d0ff');
  drawShadow();
  drawTrail();
  drawParticles();
  drawFX();
  drawSkier();
  posterizeWorld();
  // HUD-Ebene: volle Auflösung, scharfe Texte und Anzeigen
  ctx = hctx;
  ctx.clearRect(0, 0, W, H);
  drawHillLabels();
  drawPrediction();
  ctx.fillStyle = vignette; ctx.fillRect(0, 0, W, H);
  drawHUD();
}

// ------------------------------------------------------------------ UI-Verdrahtung
const startPanel = document.getElementById('startPanel');
const tutCard = document.getElementById('tutCard');
const tutStep = document.getElementById('tutStep');
const tutText = document.getElementById('tutText');
const tutGo = document.getElementById('tutGo');
const show = el => el.classList.remove('hidden');
const hide = el => el.classList.add('hidden');

const nextBtn = document.getElementById('nextBtn');
const muteBtn = document.getElementById('muteBtn');
const homeBtn = document.getElementById('homeBtn');
function goMenu() {
  Game.state = 'MENU';
  Game.result = null; Game.popup = null;
  Game.trail.length = 0; Game.particles.length = 0;
  Ragdoll.active = false;
  Tutorial.paused = false; tutCard.classList.add('hidden');
  hide(nextBtn); hide(homeBtn); show(startPanel);
  const start = Hill.inrunAt(CONFIG.gateOffset);
  Object.assign(Game.skier, { x: start.x, y: start.y, vx: 0, vy: 0, v: 0, s: CONFIG.gateOffset,
    body: -start.angle, poseA: 'gate', poseB: 'gate', poseT: 1, crash: false });
}
function startRun(mode) {
  Sound.init(); Sound.click();
  Game.mode = mode;
  Game.newCompetition();
  Game.newJump();
  show(homeBtn);
}
document.getElementById('startBtn').addEventListener('click', () => startRun('comp'));
document.getElementById('trainBtn').addEventListener('click', () => startRun('train'));
document.getElementById('tutBtn').addEventListener('click', () => {
  try { localStorage.removeItem('alpenflug_tut_v1'); } catch (e) {}
  Tutorial.active = true; Tutorial.step = 0; Tutorial.paused = false;
  startRun('train');
});
homeBtn.addEventListener('click', () => { Sound.click(); goMenu(); });
nextBtn.addEventListener('click', () => { Sound.init(); Sound.click(); Game.advance(); show(homeBtn); });
muteBtn.addEventListener('click', () => {
  Sound.init();
  muteBtn.textContent = Sound.toggle() ? '🔊' : '🔇';
});
window.addEventListener('keydown', e => {
  if ((e.key === ' ' || e.key === 'Enter') && Game.state === 'MENU') {
    e.preventDefault();
    startRun('comp');
  } else if ((e.key === ' ' || e.key === 'Enter') && Game.state === 'RESULT') {
    e.preventDefault();
    Game.advance();
  }
});
if (Game.best)
  document.getElementById('startBest').textContent =
    `Bestleistung: ${Game.best.dist.toFixed(1).replace('.', ',')} m · ${Game.best.total.toFixed(1)} Pkt.`;

// Springer für den Startbildschirm ans Gate setzen
{
  const start = Hill.inrunAt(CONFIG.gateOffset);
  Object.assign(Game.skier, { x: start.x, y: start.y, body: -start.angle, poseA: 'gate', poseB: 'gate', poseT: 1 });
  cam.x = start.x + 5; cam.y = start.y - 2;
  cam.ppm = Math.min(W / CONFIG.camGateView, H / (CONFIG.camGateView * 0.82));
}

// Alten Service-Worker (aus früherem Projekt auf dieser Domain) entfernen,
// damit keine gecachte Fremd-Version ausgeliefert wird.
if ('serviceWorker' in navigator)
  navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});

requestAnimationFrame(frame);
</script>
